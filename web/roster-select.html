<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>용병 선택 · Roster Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim);
    text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; transition:color 0.15s ease;
  }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }

  header { padding:28px 40px 18px; border-bottom:1px solid var(--line); }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  header .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  header h1 { font-family:'Cinzel',serif; font-weight:700; font-size:26px; margin:8px 0 4px; color:#f2efe8; }
  header .desc { font-size:13px; color:var(--mist-dim); max-width:620px; line-height:1.6; margin-top:8px; }
  .battle-context {
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold);
    border:1px solid var(--gold-dim); border-radius:20px; padding:6px 14px; white-space:nowrap;
  }
  .nav-link {
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); text-decoration:none;
    border:1px solid var(--line); padding:7px 14px; border-radius:20px; white-space:nowrap;
  }
  .nav-link:hover { border-color:var(--gold); color:var(--gold); }

  main { flex:1; padding:24px 40px 20px; max-width:1000px; margin:0 auto; width:100%; }

  .monster-preview-wrap { max-width:1000px; margin:0 auto; padding:4px 40px 140px; }
  .monster-preview-title {
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.1em; color:var(--mist-dim);
    text-transform:uppercase; margin-bottom:10px;
  }
  .monster-chip-row { display:flex; gap:10px; flex-wrap:wrap; }
  .monster-chip {
    display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line);
  }
  .monster-chip.rare { border-color:var(--gold-dim); background:#d9b45c14; }
  .monster-chip .m-icon { font-size:18px; }
  .monster-chip .m-name { font-family:'Cinzel',serif; font-size:12.5px; color:#f2efe8; }
  .monster-chip .m-rare-tag { color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:10px; }
  .monster-chip .m-prob { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:14px; }

  /* 2026-08-21: Home 카드(roster-index.html)와 동일한 큰 3:4 초상화 스타일로 통일. */
  .pick-card {
    position:relative; border-radius:10px; background:var(--panel); border:2px solid var(--line);
    overflow:hidden; cursor:pointer; transition:border-color 0.12s ease, transform 0.1s ease;
    display:flex; flex-direction:column;
  }
  .pick-card:hover { transform:translateY(-2px); }
  .pick-card.selected { border-color:var(--gold); background:#d9b45c14; }
  .pick-card .p-portrait {
    width:100%; aspect-ratio:3/4; background:var(--panel-raised); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:64px; overflow:hidden;
  }
  .pick-card .p-portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .pick-card .p-body { padding:12px 14px 14px; }
  .pick-card .p-name { font-family:'Cinzel',serif; font-size:14.5px; color:#f2efe8; }
  .pick-card .p-meta { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); margin-top:2px; }
  .pick-card .p-check {
    position:absolute; top:10px; right:10px; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel-raised); display:flex; align-items:center; justify-content:center;
    font-size:12px; color:transparent; z-index:1;
  }
  .pick-card.selected .p-check { background:var(--gold); border-color:var(--gold); color:var(--ink); }

  .empty-wrap {
    text-align:center; padding:60px 20px; color:var(--mist-dim); font-family:'JetBrains Mono',monospace; font-size:12px;
  }
  .empty-wrap a { color:var(--gold); }

  /* 하단 고정 바 */
  .selection-bar {
    position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line);
    padding:16px 40px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .selection-count { font-family:'JetBrains Mono',monospace; font-size:13px; color:#f2efe8; }
  .selection-count b { color:var(--gold); }
  .selection-warning {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--danger);
    display:flex; align-items:center; gap:6px;
  }
  .enter-btn {
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.05em; padding:11px 26px; border-radius:8px;
    border:none; background:var(--gold); color:var(--ink); font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .practice-btn {
    font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--panel);
    color:var(--mist); border:1px solid var(--line); border-radius:8px; padding:11px 20px;
    cursor:pointer; margin-right:8px;
  }
  .practice-btn:hover:not(:disabled) { border-color:var(--cyan); color:var(--cyan); }
  .practice-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .enter-btn:disabled { background:var(--panel-raised); color:var(--mist-dim); cursor:not-allowed; }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <script src="nav.js"></script>
  



<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">Roster Select</div>
      <h1>용병 선택</h1>
      <div class="desc">전투에 데려갈 용병을 최소 1명, 최대 5명까지 골라주세요.</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <span class="battle-context" id="battleContext"></span>
      <a class="nav-link" href="battle-select.html">← 전투 선택으로</a>
    </div>
  </div>
</header>

<main id="mainArea"></main>

<div id="monsterPreviewArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
<script src="battle-themes.js"></script>
<script src="battle-encounters.js"></script>
<script>
  // battle-select.html/battle-view.html/dispatch.html과 같은 공용 소스
  // (battle-themes.js/battle-encounters.js)를 씀 — 예전엔 이 파일만 따로
  // BATTLE_NAMES/BATTLE_MONSTER_POOLS 사본을 갖고 있어서 다른 세 곳(2026-08-14
  // 정리됨)과 다르게 여기만 낡은 채로 남아 있었음(실측: 존재하지 않는
  // "gate-ambush"가 있고 실제 전투 "goblin-cart-raid"는 빠져 있었음 — 같은
  // 종류의 버그가 이 파일엔 그대로 있었던 것). getMonsterTable()로 몬스터
  // 이름/초상화도 game_content 기준으로 가져옴.
  const { BATTLE_MONSTER_POOLS, RARE_THRESHOLD, computePoolProbabilities, getMonsterTable, setMonsterRoster } = window.BattleEncounters;
  const { battleNameById, isAftermathBattle } = window.BattleThemes;

  // 초상화 이중 모드 렌더링 — character-sheet.html/roster-index.html과 동일
  // 로직(공용 파일로 안 빼는 이유도 거기 주석 참고). 커스텀 이미지 URL을
  // 설정한 캐릭터가 이 원형 미리보기에서 URL 문자열 그대로 노출되는 걸 막음.
  function isImagePortrait(p) {
    return /^(https?:|data:)/i.test(p || "");
  }
  function renderPortrait(p) {
    return isImagePortrait(p) ? `<img src="${p}" alt="" />` : (p || "❓");
  }

  let session = null;
  let roster = [];

  const params = new URLSearchParams(location.search);
  const themeId = params.get("theme") || "";

  const battleId = params.get("battle") || "";
  const battleName = battleNameById(battleId) || "이름 없는 전투";
  // 특수의뢰(AFTERMATH) 구획 — battle-themes.js의 section:"aftermath"에서
  // 직접 파생시킴(2026-08-20, 예전엔 여기 하드코딩 사본이 있었는데
  // unknownEncounter가 빠져있어 "???"에 연습하기 버튼이 잘못 노출되던
  // 버그가 있었음). 이 구획은 "한 번 한 번의 기회가 신중해야 한다"는
  // 설계라 연습 모드를 제공하지 않음(입장 조건도 소모재/쿨다운으로
  // 무겁게 잡혀 있음).
  const isAftermath = isAftermathBattle(battleId);

  const MAX_PARTY = 5;
  const selected = new Set();

  function renderContext() {
    document.getElementById("battleContext").textContent = `⚔️ ${battleName}`;
  }

  function renderMain() {
    const main = document.getElementById("mainArea");

    if (!roster.length) {
      main.innerHTML = `
        <div class="empty-wrap">
          보유한 용병이 없습니다.<br />
          <a href="village.html">마을에서 용병을 고용하세요 →</a>
        </div>
      `;
      return;
    }

    main.innerHTML = `
      <div class="grid" id="grid">
        ${roster.map((c) => `
          <div class="pick-card ${selected.has(c.id) ? "selected" : ""}" data-id="${c.id}">
            <div class="p-check">✓</div>
            <div class="p-portrait">${renderPortrait(c.portrait)}</div>
            <div class="p-body">
              <div class="p-name">${c.name}</div>
              <div class="p-meta">Lv.${c.level} · ${c.job} · ${c.row === "back" ? "후열" : "전열"}</div>
            </div>
          </div>
        `).join("")}
      </div>

      <div class="selection-bar">
        <div>
          <div class="selection-count">선택 <b id="countNum">0</b> / ${MAX_PARTY}</div>
          <div class="selection-warning" id="warningText"></div>
        </div>
        ${isAftermath ? "" : `<button class="practice-btn" id="practiceBtn" disabled title="보상 없이 결과만 확인해요. 쿨다운도 소모되지 않아요.">🧪 연습하기</button>`}
        <button class="enter-btn" id="enterBtn" disabled>전투 참가 →</button>
      </div>
    `;

    main.querySelectorAll(".pick-card").forEach((card) => {
      card.addEventListener("click", () => {
        const id = card.dataset.id;
        if (selected.has(id)) selected.delete(id);
        else selected.add(id);
        renderMain(); // 선택 상태 반영해서 다시 그림(간단하게 통짜 리렌더)
      });
    });

    updateSelectionBar();
  }

  function updateSelectionBar() {
    const countEl = document.getElementById("countNum");
    const warnEl = document.getElementById("warningText");
    const enterBtn = document.getElementById("enterBtn");
    if (!countEl) return;

    const count = selected.size;
    countEl.textContent = count;

    let warning = "";
    if (count === 0) warning = "⚠ 최소 1명은 선택해야 전투에 참가할 수 있어요.";
    else if (count > MAX_PARTY) warning = `⚠ 최대 ${MAX_PARTY}명까지만 참전할 수 있어요. ${count - MAX_PARTY}명을 빼주세요.`;

    warnEl.textContent = warning;
    const invalidParty = count === 0 || count > MAX_PARTY;
    enterBtn.disabled = invalidParty;
    const practiceBtn = document.getElementById("practiceBtn");
    if (practiceBtn) practiceBtn.disabled = invalidParty;
  }

  document.addEventListener("click", (e) => {
    const isEnter = e.target.id === "enterBtn";
    const isPractice = e.target.id === "practiceBtn";
    if ((isEnter || isPractice) && !e.target.disabled) {
      const party = [...selected].join(",");
      const q = new URLSearchParams({ theme: themeId, battle: battleId, party });
      // 연습 모드 — 보상도 클리어 기록도 남기지 않고 결과만 봄. 쿨다운도
      // 소모하지 않아서 빌드를 마음껏 시험할 수 있음(패턴 퍼즐 게임이라
      // 시행착오 자체는 자유로워야 한다는 원칙).
      // Aftermath 구획은 연습을 허용하지 않음 — 버튼도 안 그리지만,
      // URL을 직접 만져 practice=1을 붙이는 경우까지 여기서 막음.
      if (isPractice && !isAftermath) q.set("practice", "1");
      location.href = `battle-view.html?${q.toString()}`;
    }
  });

  function renderMonsterPreview() {
    const el = document.getElementById("monsterPreviewArea");
    const config = BATTLE_MONSTER_POOLS[battleId];
    if (!config) { el.innerHTML = ""; return; }

    const entries = computePoolProbabilities(config);
    const monsterTable = getMonsterTable();
    el.innerHTML = `
      <div class="monster-preview-wrap">
        <div class="monster-preview-title">⚔️ 등장 가능한 몬스터 (최대 ${config.maxCount}체)</div>
        <div class="monster-chip-row">
          ${entries.map((e) => {
            const monster = monsterTable[e.monsterId] || { name: e.monsterId, portrait: "❓" };
            const probLabel = e.guaranteed ? "확정 등장" : `${(e.probability * 100).toFixed(1)}%`;
            return `
              <div class="monster-chip ${e.isRare ? "rare" : ""}">
                <span class="m-icon">${monster.portrait}</span>
                <span class="m-name">${e.isRare ? `<span class="m-rare-tag">[Rare]</span> ` : ""}${monster.name}</span>
                <span class="m-prob">${probLabel}</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  // ============================================================================
  // 부트스트랩 — 로그인 확인 → 캐릭터 · 몬스터 로스터를 받아온 뒤 첫 렌더.
  // ============================================================================
  (async () => {
    session = await window.AuthGuard.requireSession();

    const [charRes, monsterRes] = await Promise.all([
      window.sbClient.from("characters").select("*").eq("user_id", session.user.id),
      window.sbClient.from("game_content").select("data").eq("key", "monsterRoster").single(),
    ]);
    if (charRes.error) { alert(`용병 목록을 불러오지 못했습니다: ${charRes.error.message}`); return; }
    if (monsterRes.error) { alert(`몬스터 정보를 불러오지 못했습니다: ${monsterRes.error.message}`); return; }

    roster = (charRes.data || []).map((row) => ({
      id: row.id, name: row.name, job: row.job, level: row.level,
      portrait: row.portrait, row: row.row_position,
    }));
    setMonsterRoster(monsterRes.data?.data || []);

    renderContext();
    renderMonsterPreview();
    renderMain();
  })();
</script>

</body>
</html>
