<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:36px 32px; max-width:360px; width:100%; text-align:center;
  }
  .title { font-family:'Cinzel',serif; font-weight:700; font-size:24px; color:#f2efe8; margin:0 0 8px; }
  .desc { font-size:13px; color:var(--mist-dim); line-height:1.6; margin-bottom:28px; }
  .discord-btn {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600;
    background:#5865F2; color:#fff; border:none; border-radius:8px; padding:13px 18px; cursor:pointer;
  }
  .discord-btn:hover { opacity:0.9; }
  .discord-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .status { margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--mist-dim); min-height:16px; }
  .status.error { color:var(--danger); }
  .mock-badge {
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim);
    border:1px dashed var(--line); border-radius:20px; padding:5px 12px; display:inline-block; margin-top:20px;
  }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="card">
    <div class="title">Celestial Pinnacle</div>
    <div class="desc">Discord 계정으로 로그인합니다.<br />커뮤니티 서버 가입은 선택 사항이며 로그인과 무관합니다.</div>
    <button class="discord-btn" id="discordLoginBtn">💬 Discord로 로그인</button>
    <div class="status" id="statusMsg"></div>
    <div class="mock-badge">⚠ 로그인/세션 감지 검증 단계 — 아직 실제 게임 데이터와 연결 안 됨</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
  const statusEl = document.getElementById("statusMsg");
  const btn = document.getElementById("discordLoginBtn");

  // 이미 로그인된 세션이 있으면(예: 뒤로가기로 이 페이지에 다시 온 경우)
  // 로그인 성공 시와 동일하게 용병단 화면으로 바로 넘김 — 굳이 로그인
  // 페이지에 머무르게 둘 이유가 없음.
  (async () => {
    const { data } = await window.sbClient.auth.getSession();
    if (data.session) {
      statusEl.textContent = `이미 로그인됨: ${data.session.user.user_metadata?.full_name || data.session.user.email}\n용병단으로 이동합니다...`;
      btn.disabled = true;
      setTimeout(() => {
        location.href = new URL("roster-index.html", location.href).toString();
      }, 600);
    }
  })();

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "Discord로 이동 중...";
    // redirectTo — auth-callback.html의 절대 URL. GitHub Pages 배포 주소 기준으로
    // 자동 계산되게 해서, 로컬/배포 환경이 바뀌어도 하드코딩 없이 항상 맞는
    // 주소로 감(new URL(..., location.href) 패턴).
    const redirectTo = new URL("auth-callback.html", location.href).toString();
    const { error } = await window.sbClient.auth.signInWithOAuth({
      provider: "discord",
      options: { redirectTo },
    });
    if (error) {
      statusEl.className = "status error";
      statusEl.textContent = `오류: ${error.message}`;
      btn.disabled = false;
    }
    // 성공하면 이 시점에 브라우저가 Discord로 리다이렉트되므로 이후 코드는 안 돔.
  });
</script>
</body>
</html>
