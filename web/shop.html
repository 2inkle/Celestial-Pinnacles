<title>상점 · Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim);
    text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; transition:color 0.15s ease;
  }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }

  header { padding:28px 40px 18px; border-bottom:1px solid var(--line); }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  header .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  header h1 { font-family:'Cinzel',serif; font-weight:700; font-size:26px; margin:8px 0 4px; color:#f2efe8; }
  .gold-badge {
    font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--gold); font-weight:600;
    background:var(--panel); border:1px solid var(--gold-dim); border-radius:20px; padding:8px 16px;
  }
  .mock-badge {
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.06em; color:var(--mist-dim);
    border:1px dashed var(--line); border-radius:20px; padding:5px 12px; display:inline-block; margin-top:12px;
  }

  .cat-tabs { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .cat-tab {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--mist-dim); background:var(--panel);
    border:1px solid var(--line); border-radius:20px; padding:7px 16px; cursor:pointer;
  }
  .cat-tab.active { color:var(--gold); border-color:var(--gold-dim); background:var(--panel-raised); }

  main { flex:1; padding:24px 40px 140px; max-width:960px; margin:0 auto; width:100%; }

  .shop-row {
    display:flex; align-items:flex-start; gap:14px; padding:14px 16px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel); margin-bottom:8px;
  }
  .shop-row .row-check { margin-top:4px; width:16px; height:16px; accent-color:var(--gold); cursor:pointer; flex-shrink:0; }
  .shop-icon {
    width:42px; height:42px; border-radius:9px; background:var(--panel-raised); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
  }
  .shop-main { flex:1; min-width:0; }
  .shop-name-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .shop-name { font-family:'Cinzel',serif; font-size:14px; color:#f2efe8; }
  .shop-cat-badge {
    font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.04em; padding:2px 8px; border-radius:10px;
    border:1px solid; white-space:nowrap; flex-shrink:0;
  }
  .shop-cat-badge.equipment { color:var(--ember); border-color:var(--ember-dim); }
  .shop-cat-badge.material  { color:var(--cyan);  border-color:var(--cyan-dim); }
  .shop-cat-badge.keyItem   { color:var(--gold);  border-color:var(--gold-dim); }
  .shop-cat-badge.stash     { color:#c99ee8;      border-color:#5a3f6b; }
  .shop-desc { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); margin-top:4px; line-height:1.6; }
  .shop-spec { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); margin-top:3px; line-height:1.6; }
  .shop-condition { font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--cyan); margin-top:5px; }
  .shop-price { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--gold); font-weight:600; margin-top:6px; }

  .shop-qty-wrap { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .shop-qty {
    width:64px; font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--panel-raised); color:var(--mist);
    border:1px solid var(--line); border-radius:6px; padding:7px 8px; text-align:right;
  }
  .shop-qty:focus { outline:none; border-color:var(--gold); }
  .shop-qty-label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); }

  .empty-wrap {
    text-align:center; padding:60px 20px; color:var(--mist-dim); font-family:'JetBrains Mono',monospace; font-size:12px;
  }

  /* ── 하단 고정 장바구니 바 — 뭐라도 담겨있을 때만 보임 ─────────────────── */
  .cart-bar {
    position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--gold-dim);
    padding:14px 40px; box-shadow:0 -8px 24px rgba(0,0,0,0.4); z-index:50;
  }
  .cart-bar-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .cart-list { flex:1; min-width:200px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--mist); line-height:1.7; max-height:60px; overflow-y:auto; }
  .cart-total { font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--gold); font-weight:600; white-space:nowrap; }
  .cart-buy-btn {
    font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--ember); color:#1a1108; border:none;
    border-radius:8px; padding:11px 24px; cursor:pointer; font-weight:600; white-space:nowrap;
  }
  .cart-buy-btn:hover { opacity:0.9; }

  /* ── 최상단/최하단 이동 버튼 ─────────────────────────────────────────── */
  .scroll-nav { position:fixed; right:18px; bottom:100px; display:flex; flex-direction:column; gap:8px; z-index:40; }
  .scroll-btn {
    width:38px; height:38px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    color:var(--mist-dim); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .scroll-btn:hover { color:var(--gold); border-color:var(--gold-dim); }

  /* ── 구매 확인 모달 ──────────────────────────────────────────────────── */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(10,9,14,0.75); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-box {
    background:var(--panel); border:1px solid var(--line); border-radius:14px; max-width:520px; width:100%;
    max-height:80vh; display:flex; flex-direction:column;
  }
  .modal-head { padding:20px 22px 14px; border-bottom:1px solid var(--line); }
  .modal-head h2 { font-family:'Cinzel',serif; font-size:18px; color:#f2efe8; margin:0; }
  .modal-body { padding:16px 22px; overflow-y:auto; flex:1; }
  .modal-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .modal-row:last-child { border-bottom:none; }
  .modal-row-name { flex:1; font-size:13px; color:var(--mist); }
  .modal-row-price { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); width:80px; text-align:right; }
  .modal-foot { padding:16px 22px 20px; border-top:1px solid var(--line); }
  .modal-total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .modal-total-label { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim); }
  .modal-total-value { font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--gold); font-weight:700; }
  .modal-actions { display:flex; gap:10px; align-items:center; }
  .modal-btn {
    font-family:'JetBrains Mono',monospace; font-size:12.5px; padding:11px 18px; border-radius:8px; cursor:pointer; flex:1;
  }
  .modal-btn.cancel { background:transparent; border:1px solid var(--line); color:var(--mist-dim); }
  .modal-btn.confirm { background:var(--ember); border:none; color:#1a1108; font-weight:600; }
  .modal-btn.confirm:disabled { background:var(--panel-raised); color:var(--mist-dim); cursor:not-allowed; }
  .modal-insufficient { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--danger); white-space:nowrap; }
</style>

  // 상점 데이터 — 아이템 마스터 테이블은 일부러 안 둠(강화/조합으로 파생되는
  // 아이템까지 "정의에 없는 버그 아이템"으로 오판하게 되는 걸 피하기 위함).
  // 상점은 그 자체로 완결된 판매 목록일 뿐, 다른 목록과 대조·검증되지 않음.

  //   price               — 판매가(골드)
  //   combatReal/combatBonus — 장비의 real/bonus 능력치(character-sheet.html과

  //   stock               — 개인 계정 기준 "구매 가능한 남은 개수". 생략하면 무제한.

  //                          샀는지로 계산함 — 다른 플레이어와 공유 안 됨)
  //   saleStart/saleEnd   — "YYYY-MM-DD" 판매 기간. 생략하면 상시 판매.
  //   saleDays            — 요일 배열(0=일~6=토). 생략하면 매일 판매.
  //   조건을 하나라도 못 채우면 목록에서 완전히 숨김(비활성 표시가 아님).
  //   equipmentType — 무기/방어구 무게·숙련 등급(dagger/sword/greatsword/staff/

  ];
  // SHOP_TABLE/currentGold/shopPurchasedMap은 이제 부트스트랩(파일 맨 아래)의
  // 비동기 조회 결과로 채워짐 — 최상단 동기 로드가 없어져서 let으로 선언.
  let SHOP_TABLE = [];
  let session = null;
  let currentGold = 0;
  let shopPurchasedMap = {}; // itemName -> 누적 구매수량(shop_purchased 테이블)

  const CATEGORY_LABELS = {
    equipment: { label: "장비", icon: "⚔️" },
    material:  { label: "소재", icon: "🧪" },
    keyItem:   { label: "열쇠 아이템", icon: "🗝️" },
    stash:     { label: "보물상자", icon: "🎁" },
  };

  // ── 저장 헬퍼 — getGold는 이제 캐시된 currentGold만 반환(동기 함수 형태를
  // 유지해서 아래 렌더 함수들을 안 건드림). 실제 값 변경은 confirmPurchase의
  // Supabase 호출로만 일어남.
  function getGold() { return currentGold; }

  // ── 판매 조건 판정 ──────────────────────────────────────────────────────
  function remainingStock(item) {
    if (item.stock === undefined) return Infinity;
    const bought = shopPurchasedMap[item.name] || 0;
    return Math.max(0, item.stock - bought);
  }
  function isOnSaleNow(item) {
    const today = new Date();
    if (item.saleDays && !item.saleDays.includes(today.getDay())) return false;
    if (item.saleStart || item.saleEnd) {
      const ymd = today.toISOString().slice(0, 10);
      if (item.saleStart && ymd < item.saleStart) return false;
      if (item.saleEnd && ymd > item.saleEnd) return false;
    }
    return true;
  }
  function isItemAvailable(item) {
    return remainingStock(item) > 0 && isOnSaleNow(item);
  }
  function saleConditionLabel(item) {
    const parts = [];
    if (item.stock !== undefined) parts.push(`앞으로 ${remainingStock(item)}개 남음`);
    if (item.saleStart || item.saleEnd) parts.push(`${item.saleStart || "제한 없음"} ~ ${item.saleEnd || "제한 없음"} 판매`);
    if (item.saleDays) {
      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
      parts.push(`매주 ${item.saleDays.map((d) => dayNames[d]).join("·")}요일 한정 판매`);
    }
    return parts.join(" · ");
  }

  // grantsResource.key → 표시용 한글 라벨. character-sheet.html의
  // PERSONAL_RESOURCE_TYPES와 같은 목적이지만 상점은 그 레지스트리를 로드하지
  // 않아서 최소한의 로컬 매핑만 둠(2026-08-17, 화살통 카드에 화살 부여
  // 정보가 아예 안 보이던 문제로 추가 — 매핑에 없는 키는 그대로 노출).
  const RESOURCE_LABELS = { arrow: "🏹 화살" };

  function describeShopSpec(item) {
    const parts = [];
    if (item.equipmentType) parts.push(item.equipmentType);
    const real = item.combatReal || {};
    const bonus = item.combatBonus || {};
    [["ATK", "atk"], ["MATK", "matk"], ["DEF", "def"], ["MDEF", "mdef"]].forEach(([label, key]) => {
      if (real[key] || bonus[key]) parts.push(`${label} ${real[key] || 0}+${bonus[key] || 0}`);
    });
    if (item.weight) parts.push(`무게 ${item.weight}`);
    if (item.twoHanded) parts.push(`양손 무기`);
    if (item.grantsResource) {
      const label = RESOURCE_LABELS[item.grantsResource.key] || item.grantsResource.key;
      parts.push(`${label} 최대 ${item.grantsResource.max}(전투 시작 시 충전)`);
    }
    return parts.join(" · ");
  }

  // ── 상태: 체크된 아이템의 수량. { itemName: qty } ───────────────────────
  const cart = {};

  // 상점 탭은 "장비" / "아이템" 두 그룹으로만 나눔(너무 세분화하지 않기 위함) —
  // 다만 아이템 하나하나의 실제 category 값(equipment/material/keyItem/stash)은
  // 그대로 둠. 구매 후 창고에 저장될 때 item.html의 기존 분류·배지 색상과
  // 계속 맞아야 하기 때문 — 탭은 "보여주는 방식"만 묶은 것이지 데이터 자체를
  // 바꾼 게 아님.
  const SHOP_TABS = [
    { key: "equipment", label: "⚔️ 장비", match: (cat) => cat === "equipment" },
    { key: "item", label: "🎒 아이템", match: (cat) => cat !== "equipment" },
  ];
  let activeShopTab = "equipment";

  function cartEntries() {
    return SHOP_TABLE.filter((it) => (cart[it.name] || 0) >= 1);
  }
  function cartTotal() {
    return cartEntries().reduce((sum, it) => sum + it.price * cart[it.name], 0);
  }

  function renderCatTabs() {
    const el = document.getElementById("catTabs");
    el.innerHTML = SHOP_TABS.map((t) => `
      <button class="cat-tab ${t.key === activeShopTab ? "active" : ""}" data-tab="${t.key}">${t.label}</button>
    `).join("");
    el.querySelectorAll(".cat-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeShopTab = btn.dataset.tab;
        renderCatTabs();
        renderList();
      });
    });
  }

  function renderList() {
    const el = document.getElementById("mainArea");
    const activeTab = SHOP_TABS.find((t) => t.key === activeShopTab);
    const items = SHOP_TABLE.filter((it) => activeTab.match(it.category) && isItemAvailable(it));

    if (items.length === 0) {
      el.innerHTML = `<div class="empty-wrap">지금 이 카테고리에서 판매 중인 상품이 없어요.</div>`;
      return;
    }

    el.innerHTML = items.map((it) => {
      const catMeta = CATEGORY_LABELS[it.category] || { label: it.category, icon: "❔" };
      const spec = describeShopSpec(it);
      const condition = saleConditionLabel(it);
      const qty = cart[it.name] || 0;
      const max = remainingStock(it) === Infinity ? 999 : remainingStock(it);
      return `
        <div class="shop-row" data-item="${it.name}">
          <input type="checkbox" class="row-check" ${qty >= 1 ? "checked" : ""} />
          <div class="shop-icon">${catMeta.icon}</div>
          <div class="shop-main">
            <div class="shop-name-row">
              <span class="shop-name">${it.name}</span>
              <span class="shop-cat-badge ${it.category}">${it.category === "equipment" ? it.slot : catMeta.label}</span>
            </div>
            ${it.description ? `<div class="shop-desc">${it.description}</div>` : ""}
            ${spec ? `<div class="shop-spec">${spec}</div>` : ""}
            ${condition ? `<div class="shop-condition">${condition}</div>` : ""}
            <div class="shop-price">${it.price.toLocaleString()} G</div>
          </div>
          <div class="shop-qty-wrap">
            <span class="shop-qty-label">수량</span>
            <input type="number" class="shop-qty" min="0" max="${max}" value="${qty}" />
          </div>
        </div>
      `;
    }).join("");

    el.querySelectorAll(".shop-row").forEach((row) => {
      const itemName = row.dataset.item;
      const item = SHOP_TABLE.find((it) => it.name === itemName);
      const checkbox = row.querySelector(".row-check");
      const qtyInput = row.querySelector(".shop-qty");

      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          cart[itemName] = Math.max(1, cart[itemName] || 1);
          qtyInput.value = cart[itemName];
        } else {
          cart[itemName] = 0;
          qtyInput.value = 0;
        }
        renderCartBar();
      });

      qtyInput.addEventListener("input", () => {
        const max = remainingStock(item) === Infinity ? 999 : remainingStock(item);
        let v = Math.max(0, Math.min(max, Number(qtyInput.value) || 0));
        qtyInput.value = v;
        cart[itemName] = v;
        checkbox.checked = v >= 1;
        renderCartBar();
      });
    });
  }

  // ── 하단 장바구니 바 — 뭐라도 담겨있을 때만 표시 ────────────────────────
  function renderCartBar() {
    const wrap = document.getElementById("cartBarWrap");
    const entries = cartEntries();
    if (entries.length === 0) {
      wrap.innerHTML = "";
      return;
    }
    const listText = entries.map((it) => `${it.name} ×${cart[it.name]}`).join(", ");
    wrap.innerHTML = `
      <div class="cart-bar">
        <div class="cart-bar-inner">
          <div class="cart-list">${listText}</div>
          <div class="cart-total">${cartTotal().toLocaleString()} G</div>
          <button class="cart-buy-btn" id="openModalBtn">구매</button>
        </div>
      </div>
    `;
    document.getElementById("openModalBtn").addEventListener("click", openModal);
  }

  // ── 구매 확인 모달 — 페이지 이동 없이 같은 스코프의 데이터를 그대로 참조함
  // (다른 창으로 데이터를 넘기지 않으므로 변조 가능성 자체가 없음) ─────────
  function openModal() {
    renderModal();
  }
  function closeModal() {
    document.getElementById("modalWrap").innerHTML = "";
  }

  function renderModal() {
    const wrap = document.getElementById("modalWrap");
    const entries = cartEntries();
    const total = cartTotal();
    const gold = getGold();
    const insufficient = total > gold;

    wrap.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <div class="modal-head"><h2>구매 확인</h2></div>
          <div class="modal-body">
            ${entries.map((it) => `
              <div class="modal-row" data-item="${it.name}">
                <span class="modal-row-name">${it.name}</span>
                <input type="number" class="shop-qty modal-qty" min="0" max="${remainingStock(it) === Infinity ? 999 : remainingStock(it)}" value="${cart[it.name]}" />
                <span class="modal-row-price">${(it.price * cart[it.name]).toLocaleString()} G</span>
              </div>
            `).join("")}
          </div>
          <div class="modal-foot">
            <div class="modal-total-row">
              <span class="modal-total-label">합계</span>
              <span class="modal-total-value" id="modalTotalValue">${total.toLocaleString()} G</span>
            </div>
            <div class="modal-actions">
              <button class="modal-btn cancel" id="modalCancelBtn">취소</button>
              <button class="modal-btn confirm" id="modalConfirmBtn" ${insufficient ? "disabled" : ""}>구매 확정</button>
              ${insufficient ? `<span class="modal-insufficient">*소지금 부족</span>` : ""}
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "modalOverlay") closeModal();
    });
    const confirmBtn = document.getElementById("modalConfirmBtn");
    if (confirmBtn) confirmBtn.addEventListener("click", confirmPurchase);

    // 모달 안에서도 수량을 그대로 조절 가능 — 여기서 바뀐 값이 곧 실제 구매
    // 데이터가 됨(0으로 낮춰도 목록에서 안 빠짐 — 다시 필요하면 창을 나갔다
    // 들어올 필요 없이 바로 숫자만 올리면 됨).
    wrap.querySelectorAll(".modal-qty").forEach((input) => {
      const row = input.closest(".modal-row");
      const itemName = row.dataset.item;
      const item = SHOP_TABLE.find((it) => it.name === itemName);
      input.addEventListener("input", () => {
        const max = remainingStock(item) === Infinity ? 999 : remainingStock(item);
        const v = Math.max(0, Math.min(max, Number(input.value) || 0));
        input.value = v;
        cart[itemName] = v;
        renderModal(); // 합계/소지금부족 표시 갱신 위해 통째로 재렌더
      });
    });
  }

  // 상점 아이템(camelCase, price/stock/saleStart/saleEnd/saleDays 등 상점
  // 카탈로그 전용 필드 포함)을 warehouse_items insert payload(snake_case,
  // 실제 컬럼만)로 변환. 카탈로그 전용 필드는 소유 인스턴스에 의미가 없어서
  // 일부러 뺌(예전 localStorage 방식은 스프레드로 다 같이 넘어갔지만 그건
  // 그냥 부수 효과였지 의도가 아니었음).
  function buildWarehouseInsertFromShopItem(it, quantity, userId) {
    return {
      user_id: userId,
      name: it.name,
      category: it.category,
      quantity,
      description: it.description ?? null,
      slot: it.slot ?? null,
      combat_real: it.combatReal ?? null,
      combat_bonus: it.combatBonus ?? null,
      stat_bonus: it.statBonus ?? null,
      passive_bonus: it.passiveBonus ?? null,
      max_hp_bonus: it.maxHpBonus ?? null,
      max_sp_bonus: it.maxSpBonus ?? null,
      weight: it.weight ?? null,
      two_handed: it.twoHanded ?? null,
      set_id: it.setId ?? null,
      required_job: it.requiredJob ?? null,
      stat_real_bonus: it.statRealBonus ?? null,
      pattern_slot_bonus: it.patternSlotBonus ?? null,
      crit_multiplier: it.critMultiplier ?? null,
      conditional_passive_mods: it.conditionalPassiveMods ?? null,
      grants_resource: it.grantsResource ?? null,
      equipment_type: it.equipmentType ?? null,
      avatar_portrait: it.avatarPortrait ?? null,
      grants_skill: it.grantsSkill ?? null,
      consumable: it.consumable ?? null,
      uses_per_battle: it.usesPerBattle ?? null,
      enhanceable: it.enhanceable ?? null,
      modifiable: it.modifiable ?? null,
    };
  }

  // ── 실제 구매 확정 — 여기 남아있는 cart 데이터 중 수량 1 이상인 것만 반영 ─
  async function confirmPurchase() {
    const entries = cartEntries(); // 이 시점 cart는 모달에서 조절한 최종 상태
    const total = cartTotal();
    if (total > getGold()) return; // 이중 방어(버튼은 이미 비활성화되어 있음)

    const confirmBtn = document.getElementById("modalConfirmBtn");
    if (confirmBtn) confirmBtn.disabled = true;

    // heldBy가 없는(=아직 아무도 안 가져간 "풀") 항목만 병합 대상으로 삼음 —
    // heldBy가 붙은 항목(누군가 이미 장착한 개별 인스턴스)과는 절대 안 섞임.
    // enhanceLevel도 같이 봐야 함 — 상점 구매품은 항상 +0(강화 안 됨)인데,
    // 창고에 이미 강화된 같은 이름의 장비가 있으면 절대 같이 섞이면 안 됨.
    const names = entries.map((it) => it.name);
    const { data: poolRows, error: poolError } = await window.sbClient
      .from("warehouse_items").select("id,name,category,quantity")
      .eq("user_id", session.user.id).in("name", names)
      .is("held_by", null).is("enhance_level", null);
    if (poolError) { alert(`구매 실패: ${poolError.message}`); if (confirmBtn) confirmBtn.disabled = false; return; }

    for (const it of entries) {
      const qty = cart[it.name];
      const existing = poolRows.find((w) => w.name === it.name && w.category === it.category);
      if (existing) {
        const { error } = await window.sbClient.from("warehouse_items")
          .update({ quantity: existing.quantity + qty }).eq("id", existing.id);
        if (error) { alert(`구매 실패: ${error.message}`); if (confirmBtn) confirmBtn.disabled = false; return; }
      } else {
        const { error } = await window.sbClient.from("warehouse_items")
          .insert(buildWarehouseInsertFromShopItem(it, qty, session.user.id));
        if (error) { alert(`구매 실패: ${error.message}`); if (confirmBtn) confirmBtn.disabled = false; return; }
      }
      shopPurchasedMap[it.name] = (shopPurchasedMap[it.name] || 0) + qty;
      const { error: purchasedError } = await window.sbClient.from("shop_purchased")
        .upsert({ user_id: session.user.id, item_name: it.name, quantity: shopPurchasedMap[it.name] }, { onConflict: "user_id,item_name" });
      if (purchasedError) { alert(`구매 실패: ${purchasedError.message}`); if (confirmBtn) confirmBtn.disabled = false; return; }
      cart[it.name] = 0; // 구매 완료했으니 장바구니에서 비움
    }

    const { error: goldError } = await window.sbClient.from("profiles")
      .update({ gold: currentGold - total }).eq("user_id", session.user.id);
    if (goldError) { alert(`구매 실패: ${goldError.message}`); if (confirmBtn) confirmBtn.disabled = false; return; }
    currentGold -= total;

    closeModal();
    document.getElementById("goldBadge").textContent = `💰 ${getGold().toLocaleString()} G`;
    renderList();
    renderCartBar();
  }

  document.getElementById("scrollTopBtn").addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("scrollBottomBtn").addEventListener("click", () => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  });

  // ============================================================================
  // 부트스트랩 — 로그인 확인 → 상점 카탈로그(game_content) + 골드(profiles) +
  // 누적 구매수량(shop_purchased)을 받아온 뒤 첫 렌더.
  // ============================================================================
  (async () => {
    session = await window.AuthGuard.requireSession();

    const [shopRes, profileRes, purchasedRes] = await Promise.all([
      window.sbClient.from("game_content").select("data").eq("key", "shopTable").single(),
      window.sbClient.from("profiles").select("gold").eq("user_id", session.user.id).single(),
      window.sbClient.from("shop_purchased").select("item_name,quantity").eq("user_id", session.user.id),
    ]);
    if (shopRes.error) { alert(`상점 정보를 불러오지 못했습니다: ${shopRes.error.message}`); return; }
    if (profileRes.error) { alert(`골드 정보를 불러오지 못했습니다: ${profileRes.error.message}`); return; }
    if (purchasedRes.error) { alert(`구매 이력을 불러오지 못했습니다: ${purchasedRes.error.message}`); return; }

    SHOP_TABLE = shopRes.data?.data || [];
    currentGold = profileRes.data?.gold ?? 0;
    shopPurchasedMap = {};
    (purchasedRes.data || []).forEach((row) => { shopPurchasedMap[row.item_name] = row.quantity; });

    document.getElementById("goldBadge").textContent = `💰 ${getGold().toLocaleString()} G`;
    renderCatTabs();
    renderList();
    renderCartBar();
  })();
</script>
</body>
</html>
