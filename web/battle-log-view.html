<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전투 로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  main { flex:1; max-width:820px; margin:0 auto; width:100%; padding:28px 24px 60px; }

  .note-box {
    background:var(--panel-raised); border:1px dashed var(--line); border-radius:8px; padding:12px 16px;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-bottom:20px; line-height:1.6;
  }
  .intro-banner {
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim);
    padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
  }

  .empty-state { text-align:center; padding:60px 20px; color:var(--mist-dim); font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.8; }
  .empty-state a { color:var(--gold); }

  .raw-log-toggle { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); background:none; border:1px dashed var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; margin-top:14px; }
  .raw-log-box { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist); white-space:pre-wrap; word-break:break-word; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:8px; max-height:400px; overflow-y:auto; text-align:left; }

  .log-list { display:grid; gap:12px; }
  .log-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .log-card.pinned { border-color:var(--gold-dim); }
  .log-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .log-card-title { font-family:'Cinzel',serif; font-size:14.5px; color:#f2efe8; }
  .log-card-outcome { font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:3px 8px; border-radius:5px; border:1px solid var(--line); }
  .log-card-outcome.allyWin { color:var(--gold); border-color:var(--gold-dim); }
  .log-card-outcome.enemyWin { color:var(--danger); border-color:var(--danger-dim); }
  .log-card-outcome.draw { color:var(--mist-dim); }
  .log-card-meta { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-top:6px; }
  .log-card-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .log-card-btn { font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--panel-raised); border:1px solid var(--line); color:var(--mist); border-radius:6px; padding:7px 12px; cursor:pointer; text-decoration:none; }
  .log-card-btn.pin { color:var(--gold); }
  .log-card-btn.danger { color:var(--danger); }
</style>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="battle-log-render.css">
</head>
<body>
  <script src="nav.js"></script>

<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
<script src="battle-log-render.js"></script>
<script>
// ============================================================================
// 전투 로그 뷰어 겸 "내 전투 기록" 목록 — 2026-08-18.
//
// ?id=<uuid> 있으면: get_shared_battle_log RPC로 단건 조회해 그 전투 하나를
//   렌더링(비로그인도 열람 가능 — AuthGuard.requireSession()을 의도적으로
//   호출하지 않음, 공유 링크 요건).
// ?id 없으면: 로그인 세션이 있을 때만 본인이 저장한 로그 목록(최대 10개
//   + 고정 최대 5개)을 보여줌 — 공유 링크를 잃어버리면 회수할 방법이
//   없어지는 문제를 막기 위해 별도 목록 페이지를 안 만들고 이 페이지가 겸함.
// ============================================================================
(async function () {
  const main = document.getElementById("main");
  const params = new URLSearchParams(location.search);
  const sharedId = params.get("id");

  function renderRawToggle() {
    return `
      <button class="raw-log-toggle" id="toggleRawLogBtn">🔍 원본 로그 보기</button>
      <div class="raw-log-box" id="rawLogBox" style="display:none;"></div>
    `;
  }

  // lines를 클로저로 직접 받음 — innerHTML로 넣은 <script>는 실행되지
  // 않으므로 DOM 문자열을 통해 데이터를 넘기지 않고 함수 인자로 직접 전달.
  function bindRawToggle(lines) {
    const btn = document.getElementById("toggleRawLogBtn");
    if (!btn) return;
    btn.addEventListener("click", () => {
      const box = document.getElementById("rawLogBox");
      const show = box.style.display === "none";
      box.style.display = show ? "block" : "none";
      if (show && !box.textContent) box.textContent = lines.join("\n");
    });
  }

  if (sharedId) {
    const { data, error } = await window.sbClient.rpc("get_shared_battle_log", { p_id: sharedId });
    const row = Array.isArray(data) ? data[0] : data;
    if (error || !row) {
      main.innerHTML = `<div class="empty-state">로그를 찾을 수 없습니다.<br/>삭제됐거나 잘못된 주소입니다.</div>`;
      return;
    }
    main.innerHTML = `
      <div class="note-box">"${row.battle_name || row.battle_id || "알 수 없는 전투"}" · 저장자: ${row.saved_by || "?"}</div>
      <div id="battleLogRenderTarget"></div>
      ${renderRawToggle()}
    `;
    document.getElementById("battleLogRenderTarget").innerHTML = window.BattleLogRender.renderBattleLog(row.lines, row.result);
    bindRawToggle(row.lines);
    return;
  }

  // 목록 모드 — 로그인 필요.
  const { data: { session } } = await window.sbClient.auth.getSession();
  if (!session) {
    main.innerHTML = `<div class="empty-state">저장한 전투 기록을 보려면 로그인이 필요합니다.<br/><a href="login.html">로그인하러 가기</a></div>`;
    return;
  }

  async function loadList() {
    const { data, error } = await window.sbClient.from("battle_logs")
      .select("id,battle_id,battle_name,outcome,turns_elapsed,pinned,created_at")
      .eq("user_id", session.user.id)
      .order("pinned", { ascending: false })
      .order("created_at", { ascending: false });
    if (error) { main.innerHTML = `<div class="empty-state">불러오기 실패: ${error.message}</div>`; return; }
    renderList(data || []);
  }

  const OUTCOME_LABEL = { allyWin: "승리", enemyWin: "패배", draw: "무승부" };

  function renderList(rows) {
    if (rows.length === 0) {
      main.innerHTML = `<div class="empty-state">아직 저장한 전투 기록이 없습니다.<br/>전투 결과 화면에서 "💾 이 전투 저장"을 눌러보세요.</div>`;
      return;
    }
    main.innerHTML = `
      <div class="note-box">여기 있는 로그는 본인만 조회할 수 있습니다. 공유하려면 카드의 "링크 복사"를 눌러 그 링크를 직접 건네주세요.</div>
      <div class="log-list">
        ${rows.map((r) => `
          <div class="log-card ${r.pinned ? "pinned" : ""}" data-id="${r.id}">
            <div class="log-card-head">
              <span class="log-card-title">${r.pinned ? "📌 " : ""}${r.battle_name || r.battle_id || "알 수 없는 전투"}</span>
              <span class="log-card-outcome ${r.outcome}">${OUTCOME_LABEL[r.outcome] || r.outcome}</span>
            </div>
            <div class="log-card-meta">${new Date(r.created_at).toLocaleString()} · ${r.turns_elapsed ?? "?"}턴</div>
            <div class="log-card-actions">
              <a class="log-card-btn" href="battle-log-view.html?id=${r.id}">열람</a>
              <button class="log-card-btn copy-btn">링크 복사</button>
              <button class="log-card-btn pin pin-btn">${r.pinned ? "고정 해제" : "📌 고정"}</button>
              <button class="log-card-btn danger delete-btn">삭제</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;

    main.querySelectorAll(".log-card").forEach((card) => {
      const id = card.dataset.id;
      card.querySelector(".copy-btn").addEventListener("click", () => {
        const url = new URL(`battle-log-view.html?id=${id}`, location.href).toString();
        navigator.clipboard?.writeText(url).catch(() => {});
      });
      card.querySelector(".pin-btn").addEventListener("click", async () => {
        const nowPinned = card.classList.contains("pinned");
        const { error } = await window.sbClient.from("battle_logs").update({ pinned: !nowPinned }).eq("id", id);
        if (error) { alert(`실패: ${error.message}`); return; }
        loadList();
      });
      card.querySelector(".delete-btn").addEventListener("click", async () => {
        if (!confirm("이 전투 기록을 삭제할까요? 되돌릴 수 없습니다.")) return;
        const { error } = await window.sbClient.from("battle_logs").delete().eq("id", id);
        if (error) { alert(`삭제 실패: ${error.message}`); return; }
        loadList();
      });
    });
  }

  loadList();
})();
</script>
</body>
</html>
