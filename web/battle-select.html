<html lang="ko">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  /* ---- 공통 상단 내비게이션 ---- */
  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim);
    text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; transition:color 0.15s ease;
  }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }

  header { padding:28px 40px 18px; border-bottom:1px solid var(--line); }
  header .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  header h1 { font-family:'Cinzel',serif; font-weight:700; font-size:28px; margin:8px 0 4px; color:#f2efe8; }
  header .desc { font-size:13px; color:var(--mist-dim); max-width:560px; line-height:1.6; margin-top:8px; }
  .section-tabs { display:flex; gap:6px; margin:16px 0 4px; border-bottom:1px solid var(--line); }
  .section-tab { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim); background:none; border:none; border-bottom:2px solid transparent; padding:10px 18px; cursor:pointer; }
  .section-tab:hover { color:var(--mist); }
  .section-tab.active { color:var(--gold); border-bottom-color:var(--gold); }
  .mock-badge {
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.06em; color:var(--mist-dim);
    border:1px dashed var(--line); border-radius:20px; padding:5px 12px; display:inline-block; margin-top:12px;
  }

  main { flex:1; padding:28px 40px 48px; max-width:820px; margin:0 auto; width:100%; }

  .theme-card { border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-bottom:14px; overflow:hidden; }
  .theme-head {
    display:flex; align-items:center; justify-content:space-between; gap:14px; padding:20px 22px;
    cursor:pointer; user-select:none;
  }
  .theme-head:hover { background:var(--panel-raised); }
  .theme-head-left { display:flex; align-items:center; gap:14px; }
  .theme-icon {
    width:46px; height:46px; border-radius:9px; background:var(--panel-raised); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .theme-name { font-family:'Cinzel',serif; font-size:18px; color:#f2efe8; }
  .theme-sub { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist-dim); margin-top:3px; }
  .theme-chevron {
    font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--mist-dim);
    transition:transform 0.2s ease;
  }
  .theme-card.expanded .theme-chevron { transform:rotate(90deg); color:var(--gold); }

  .battle-list {
    max-height:0; overflow:hidden; transition:max-height 0.25s ease;
    border-top:1px solid transparent;
  }
  .theme-card.expanded .battle-list {
    max-height:400px; border-top:1px solid var(--line);
  }
  .battle-item {
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:15px 22px 15px 46px; text-decoration:none; color:inherit;
    border-bottom:1px solid var(--line); transition:background 0.12s ease;
  }
  .battle-item:last-child { border-bottom:none; }
  .battle-item:hover { background:var(--panel-raised); }
  .battle-item-name { font-size:13.5px; color:#f2efe8; }
  .battle-item-row { display:flex; gap:6px; align-items:stretch; }
  .battle-item-row > .battle-item { flex:1; }
  .dispatch-btn {
    display:flex; align-items:center; font-family:'JetBrains Mono',monospace; font-size:11.5px;
    color:var(--gold); background:var(--panel); border:1px solid var(--gold-dim);
    border-radius:8px; padding:0 14px; text-decoration:none; white-space:nowrap;
  }
  .dispatch-btn:hover { background:var(--gold-dim); color:#f2efe8; }
  .battle-item-hint { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold); opacity:0; transition:opacity 0.12s ease; }
  .battle-item:hover .battle-item-hint { opacity:1; }
  .battle-empty { padding:16px 22px 16px 46px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); }

  .dev-panel { margin-top:24px; border:1px dashed var(--line); border-radius:12px; padding:16px 20px; }
  .dev-panel-title { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; color:var(--mist-dim); margin-bottom:10px; }
  .dev-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  .dev-row:first-of-type { border-top:none; }
  .dev-row span { font-size:12.5px; color:var(--mist); }
  .dev-btn {
    font-family:'JetBrains Mono',monospace; font-size:10.5px; background:transparent; border:1px solid var(--gold-dim);
    color:var(--gold); padding:5px 12px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .dev-btn:hover { border-color:var(--gold); background:#d9b45c14; }
</style>

<body>
  <script src="nav.js"></script>
  



<header>
  <div class="eyebrow">Battle Selection</div>
  <h1>전투</h1>
  <div class="desc" id="sectionDesc"></div>
  <div class="section-tabs">

</header>

<main>
  <div id="themeList"></div>

  <div class="dev-panel">
    <div class="dev-panel-title">🧪 테스트 도구 — 해금 조건 확인용, 실제 진행과 무관</div>
    <div class="dev-row">
      <span>"고블린과 놀기" 승리 처리</span>

    <div class="dev-row">
      <span>"조금 강한 고블린" 승리 처리</span>
      <button class="dev-btn" id="devClearStrongBtn">처리</button>
    </div>
    <div class="dev-row">
      <span>"고블린 전사들" 승리 처리</span>
      <button class="dev-btn" id="devClearWarriorsBtn">처리</button>
    </div>
    <div class="dev-row">
      <span>"고귀한 고블린들" 승리 처리</span>
      <button class="dev-btn" id="devClearNobleBtn">처리</button>
    </div>
    <div class="dev-row">
      <span>"고블린 왕국 통행증" 지급 (용병단 공용 창고)</span>

    </div>
    <div class="dev-row">
      <span>승리 기록 초기화</span>

<script src="battle-themes.js"></script>
<script>
  const { BATTLE_THEMES, findBattleById, battleNameById } = window.BattleThemes;

  function getRoster() {
    try { return JSON.parse(localStorage.getItem("battleSim_roster")) || []; }
    catch { return []; }
  }
  function getClearedBattles() {
    try { return JSON.parse(localStorage.getItem("battleSim_clearedBattles")) || []; }
    catch { return []; }
  }
  function markBattleCleared(battleId) {
    const cleared = getClearedBattles();
    if (!cleared.includes(battleId)) cleared.push(battleId);
    localStorage.setItem("battleSim_clearedBattles", JSON.stringify(cleared));
  }
  // ============================================================================
  // 용병단 공용 창고 — 장비가 아닌 아이템(소재/열쇠 아이템 등)은 특정 캐릭터가
  // 아니라 여기 저장됨. 형태: [{ name, category, quantity, description }]
  // category는 item.html의 ITEM_CATEGORY_TYPES 키("material"/"keyItem" 등).
  // ============================================================================
  function getWarehouse() {
    try { return JSON.parse(localStorage.getItem("battleSim_warehouse")) || []; }
    catch { return []; }
  }
  function saveWarehouse(items) {
    localStorage.setItem("battleSim_warehouse", JSON.stringify(items));
  }
  function addToWarehouse(name, category, amount = 1, description = "") {
    const warehouse = getWarehouse();
    const existing = warehouse.find((it) => it.name === name);
    if (existing) existing.quantity += amount;
    else warehouse.push({ name, category, quantity: amount, description });
    saveWarehouse(warehouse);
  }
  function rosterHasItem(itemName) {
    const inWarehouse = getWarehouse().some((it) => it.name === itemName && it.quantity > 0);
    const inRoster = getRoster().some((c) => {
      const inInventory = (c.inventory || []).some((it) => it.name === itemName);
      const inEquipment = Object.values(c.equipment || {}).some((it) => it && it.name === itemName);
      return inInventory || inEquipment;
    });
    return inWarehouse || inRoster;
  }

  // ============================================================================
  // 전투 해금 조건 레지스트리 — JOB_ADVANCEMENT_TABLE의 ADVANCEMENT_REQUIREMENT_TYPES와
  // 같은 설계. 새 조건 종류가 필요하면 이 객체에 { label, describe, check } 한 줄만
  // 추가하면 BATTLE_THEMES의 requirements 배열에서 바로 쓸 수 있음.
  // ============================================================================
  const BATTLE_REQUIREMENT_TYPES = {
    clearedBattle: {
      label: "전투 승리",
      describe: (value) => `"${battleNameById(value)}" 승리`,
      check: (value) => getClearedBattles().includes(value),
    },
    hasItem: {
      label: "아이템 보유",
      describe: (value) => `"${value}" 보유`,
      check: (value) => rosterHasItem(value),
    },
    // 보유 여부는 hasItem과 같게 보지만, 전투에 "입장할 때 1개 소모"되는 조건.
    // 파밍으로 얻은 일회성 열쇠 아이템(오래된 바퀴 자국 등)으로 특별 전투를
    // 여는 용도 — 실제 소모는 입장 처리(consumeEntryItems)에서 일어남.
    consumesItem: {
      label: "아이템 소모",
      describe: (value) => `"${value}" 1개 소모`,
      check: (value) => rosterHasItem(value),
    },
    // 요일 개방 — value는 요일 배열(0=일 … 6=토). 특정 요일에만 열리는 의뢰용.
    weekday: {
      label: "요일 제한",
      describe: (value) => `${value.map((d) => WEEKDAY_LABELS[d]).join("·")}요일에만 개방`,
      check: (value) => value.includes(new Date().getDay()),
    },
    // 재도전 대기 — value는 시간(hour).
    // ⚠ "아직 한 번도 클리어하지 못한" 전투에는 걸리지 않음. 처음 뚫는
    // 중인 사람은 몇 번이고 시도할 수 있어야 하고(패턴 퍼즐이니 시행착오가
    // 곧 공략 과정임), 이미 뚫어서 파밍 단계로 넘어간 사람만 속도가
    // 제한되는 게 의도. 즉 시스템이 "공략 중"과 "파밍 중"을 알아서 구분함.
    // 전투마다 개별로 도니까 특수의뢰가 늘어나도 한꺼번에 막히지 않고,
    // 그래서 정해진 시간에 접속하라고 강요하지도 않음.
    cooldownHours: {
      label: "재도전 대기",
      describe: (value) => `클리어 후 ${formatHours(value)} 대기 (첫 클리어 전에는 제한 없음)`,
      check: (value, battleId) =>
        !getClearedBattles().includes(battleId) || remainingCooldownMs(battleId, value) <= 0,
    },
    // 시도 기준 대기 — 성패와 무관하게 "입장한 순간" 시계가 돌기 시작함.
    // 특수의뢰(Aftermath)용. 승리해야만 걸리는 cooldownHours를 쓰면
    // "실패하면 소모재만 날리고 즉시 재도전"이 가능해져서 한 번의 기회가
    // 신중해지지 않기 때문(수송대 추적에 실패해도 대가를 치러야 함).
    attemptCooldownHours: {
      label: "재도전 대기",
      describe: (value) => `도전 후 ${formatHours(value)} 대기 (성패 무관)`,
      check: (value, battleId) => remainingAttemptCooldownMs(battleId, value) <= 0,
    },
  };

  const WEEKDAY_LABELS = ["일", "월", "화", "수", "목", "금", "토"];

  // 전투별 마지막 클리어 시각 — { battleId: timestamp }
  function getClearTimes() {
    try { return JSON.parse(localStorage.getItem("battleSim_battleClearTimes")) || {}; }
    catch { return {}; }
  }
  function remainingCooldownMs(battleId, hours) {
    const last = getClearTimes()[battleId];
    if (!last) return 0;
    return Math.max(0, last + hours * 3600 * 1000 - Date.now());
  }
  // 전투별 마지막 "도전 시각"(승패 무관) — { battleId: timestamp }
  function getAttemptTimes() {
    try { return JSON.parse(localStorage.getItem("battleSim_battleAttemptTimes")) || {}; }
    catch { return {}; }
  }
  function markAttempt(battleId) {
    const t = getAttemptTimes();
    t[battleId] = Date.now();
    localStorage.setItem("battleSim_battleAttemptTimes", JSON.stringify(t));
  }
  function remainingAttemptCooldownMs(battleId, hours) {
    const last = getAttemptTimes()[battleId];
    if (!last) return 0;
    return Math.max(0, last + hours * 3600 * 1000 - Date.now());
  }
  function formatHours(h) {
    return h >= 1 ? `${h}시간` : `${Math.round(h * 60)}분`;
  }
  function formatDuration(ms) {
    const total = Math.ceil(ms / 60000);
    const h = Math.floor(total / 60), m = total % 60;
    return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
  }
  // 입장 시 consumesItem 조건에 걸린 아이템을 창고에서 1개씩 실제로 차감함.
  // 창고에만 적용되고(파밍 아이템은 창고로 들어오므로), 수량이 0이 되면 항목
  // 자체를 지움. 차감에 성공했는지를 반환 — 실패하면 입장을 막아야 함.
  function consumeEntryItems(battle) {
    const needed = (battle.requirements || [])
      .filter((r) => r.type === "consumesItem")
      .map((r) => r.value);
    if (needed.length === 0) return true;

    const warehouse = getWarehouse();
    for (const itemName of needed) {
      const entry = warehouse.find((it) => it.name === itemName && it.quantity > 0);
      if (!entry) return false; // 창고에 없음 — 입장 불가
      entry.quantity -= 1;
    }
    const remaining = warehouse.filter((it) => it.quantity > 0);
    localStorage.setItem("battleSim_warehouse", JSON.stringify(remaining));
    return true;
  }

  function isBattleUnlocked(battle) {
    // battle.id를 함께 넘김 — 쿨다운처럼 "어느 전투인지"를 알아야 판정할 수
    // 있는 조건이 있기 때문(대부분의 조건은 두 번째 인자를 무시함).
    return (battle.requirements || []).every((r) => BATTLE_REQUIREMENT_TYPES[r.type].check(r.value, battle.id));
  }

  // 쿨다운 조건이 걸린 전투의 남은 대기시간(0이면 지금 입장 가능).
  // 해금 조건과 달리 "곧 열림"을 보여줘야 하므로 목록에서 숨기지 않고
  // 남은 시간을 표시해 주기 위해 따로 계산함.
  function battleCooldownRemaining(battle) {
    const reqs = battle.requirements || [];
    const attempt = reqs.find((r) => r.type === "attemptCooldownHours");
    if (attempt) return remainingAttemptCooldownMs(battle.id, attempt.value);
    const req = reqs.find((r) => r.type === "cooldownHours");
    if (!req) return 0;
    // 첫 클리어 전에는 대기가 없음(위 cooldownHours의 check와 같은 규칙)
    if (!getClearedBattles().includes(battle.id)) return 0;
    return remainingCooldownMs(battle.id, req.value);
  }

  // 테마/전투 정의(BATTLE_THEMES)는 battle-themes.js로 분리됨(dispatch.html과
  // 공유). 새 테마/전투를 추가하려면 그 파일만 고치면 화면에 자동 반영됨.

  let currentSection = "dispatch";

  function render() {
    const el = document.getElementById("themeList");
    // 해금된 전투가 하나도 없는 테마는 아예 표시하지 않음(존재 자체를 숨김) —
    // 몇 종 중 몇 종이 열렸는지도 공개하지 않으므로(theme-sub 줄 제거),
    // 다음에 뭐가 있는지 미리 알 수 없게 함.
    const visibleThemes = BATTLE_THEMES
      .filter((t) => (t.section || "dispatch") === currentSection)
      .filter((t) => t.battles.some(isBattleUnlocked));
    document.getElementById("sectionDesc").textContent = currentSection === "dispatch"
      ? "파견 수주권의 턴 예산으로 반복해서 돌 수 있는 구획이에요. 빠르고 안정적으로 이길수록 같은 예산으로 더 많이 돌 수 있어요."
      : "직접 도전해야 하는 특수 의뢰예요. 파견 대상이 아니라 턴 예산을 쓰지 않지만, 입장 조건과 재도전 대기시간이 붙어요. 대신 여기서만 나오는 보상이 있어요.";
    if (visibleThemes.length === 0) {
      el.innerHTML = `<div class="battle-empty">아직 열린 의뢰가 없어요.</div>`;
      return;
    }
    el.innerHTML = visibleThemes.map((theme) => {
      const visibleBattles = theme.battles.filter(isBattleUnlocked);
      return `
      <div class="theme-card" data-theme="${theme.id}">
        <div class="theme-head">
          <div class="theme-head-left">
            <div class="theme-icon">${theme.icon}</div>
            <div>
              <div class="theme-name">${theme.name}</div>
            </div>
          </div>
          <div class="theme-chevron">▶</div>
        </div>
        <div class="battle-list">
          ${visibleBattles.map((b) => {
            const consumes = (b.requirements || []).some(r => r.type === "consumesItem");
            const attemptCd = (b.requirements || []).some(r => r.type === "attemptCooldownHours");
            const coolMs = battleCooldownRemaining(b);
            // 쿨다운 중이면 목록에서 숨기지 않고 남은 시간을 보여줌 — 언제
            // 다시 올 수 있는지 알 수 있어야 접속을 강요받는 느낌이 덜함.
            if (coolMs > 0) return `
            <div class="battle-item" style="opacity:0.55; cursor:not-allowed;">
              <span class="battle-item-name">${b.name}</span>
              <span class="battle-item-hint">⏳ ${formatDuration(coolMs)} 후 재도전</span>
            </div>`;
            // 파견 — 이미 클리어한 파견의뢰 구획 전투에만. 아직 못 뚫은 곳에
            // 용병단을 장기 파견 보낼 수는 없다는 의미이기도 하고, "공략은
            // 직접, 파밍은 파견"이라는 역할 분담을 자연스럽게 만들기도 함.
            const canDispatch = (theme.section || "dispatch") === "dispatch"
              && getClearedBattles().includes(b.id);
            return `
            <div class="battle-item-row">
              <a class="battle-item" href="roster-select.html?theme=${theme.id}&battle=${b.id}"
                 data-battle-id="${b.id}" ${consumes ? 'data-consumes="1"' : ""} ${attemptCd ? 'data-attempt-cd="1"' : ""}>
                <span class="battle-item-name">${b.name}</span>
                <span class="battle-item-hint">${consumes ? "소모 입장 →" : "입장하기 →"}</span>
              </a>
              ${canDispatch ? `<a class="dispatch-btn" href="dispatch.html?theme=${theme.id}&battle=${b.id}" title="파견 의뢰권을 사용해 여러 차례 전투를 자동으로 치릅니다">📜 파견</a>` : ""}
            </div>
          `; }).join("")}
        </div>
      </div>
    `;
    }).join("");

    document.querySelectorAll(".section-tab").forEach((t) => {
      t.onclick = () => {
        currentSection = t.dataset.section;
        document.querySelectorAll(".section-tab").forEach((x) => x.classList.toggle("active", x === t));
        render();
      };
    });

    el.querySelectorAll(".theme-head").forEach((head) => {
      head.addEventListener("click", () => {
        head.closest(".theme-card").classList.toggle("expanded");
      });
    });

    // consumesItem 조건이 붙은 전투는 링크 이동 전에 아이템을 실제로 차감함.
    // 차감에 실패하면(그 사이 아이템이 없어졌다면) 이동 자체를 막음.
    el.querySelectorAll(".battle-item[data-consumes], .battle-item[data-attempt-cd]").forEach((link) => {
      link.addEventListener("click", (e) => {
        const battleId = link.dataset.battleId;
        const battle = findBattleById(battleId);
        if (!battle) return;
        const names = (battle.requirements || []).filter(r => r.type === "consumesItem").map(r => r.value);
        const attemptReq = (battle.requirements || []).find(r => r.type === "attemptCooldownHours");
        const lines = [];
        if (names.length) lines.push(`${names.map(n => `"${n}"`).join(", ")} 1개가 소모돼요.`);
        if (attemptReq) lines.push(`성패와 관계없이 ${formatHours(attemptReq.value)} 동안 재도전할 수 없어요.`);
        if (lines.length && !confirm(`이 전투에 입장합니다.\n\n${lines.join("\n")}\n\n진행할까요?`)) {
          e.preventDefault();
          return;
        }
        if (!consumeEntryItems(battle)) {
          e.preventDefault();
          alert("필요한 아이템이 부족해요.");
          render();
          return;
        }
        // 소모재 차감에 성공했으면 이 시점이 곧 "도전 시작" — 성패를 기다리지
        // 않고 여기서 시계를 돌림(실패해도 대가를 치르게 하기 위함).
        if ((battle.requirements || []).some((r) => r.type === "attemptCooldownHours")) markAttempt(battleId);
      });
    });
  }

  render();

  document.getElementById("devClearPlayBtn").addEventListener("click", () => { markBattleCleared("goblin-play"); render(); });
  document.getElementById("devClearStrongBtn").addEventListener("click", () => { markBattleCleared("slightly-strong-goblin"); render(); });
  document.getElementById("devClearWarriorsBtn").addEventListener("click", () => { markBattleCleared("goblin-warriors"); render(); });
  document.getElementById("devClearNobleBtn").addEventListener("click", () => { markBattleCleared("noble-goblins"); render(); });

  document.getElementById("devGrantPassBtn").addEventListener("click", () => {
    addToWarehouse("고블린 왕국 통행증", "keyItem", 1, "고블린 왕국 진입에 필요한 열쇠 아이템");
    render();
  });

  document.getElementById("devResetClearedBtn").addEventListener("click", () => {
    localStorage.removeItem("battleSim_clearedBattles");
    render();
  });
</script>

</body>
</html>
