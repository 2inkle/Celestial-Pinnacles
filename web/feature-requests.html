<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>요청 목록 · Feature Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item { font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim); text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }

  header { padding:24px 40px 16px; border-bottom:1px solid var(--line); }
  .back-link { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); text-decoration:none; }
  .back-link:hover { color:var(--gold); }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  h1 { font-family:'Cinzel',serif; font-weight:700; font-size:24px; margin:6px 0 0; color:#f2efe8; }
  .header-actions { display:flex; gap:10px; }
  .action-btn {
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:9px 16px; border-radius:8px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--mist-dim);
  }
  .action-btn:hover { color:var(--mist); border-color:var(--mist-dim); }
  .action-btn.primary { background:var(--ember); border:none; color:#1a1108; font-weight:600; }
  .action-btn.primary:hover { opacity:0.9; }
  .mock-badge { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); border:1px dashed var(--line); border-radius:20px; padding:5px 12px; display:inline-block; margin-top:12px; }

  main { flex:1; padding:24px 40px 60px; max-width:820px; margin:0 auto; width:100%; }

  .req-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .req-card.done { opacity:0.55; }
  .req-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .req-head .status-toggle { flex-shrink:0; width:20px; height:20px; accent-color:var(--gold); cursor:pointer; }
  .req-head .title-input {
    flex:1; font-family:'Cinzel',serif; font-size:14px; background:transparent; border:none;
    border-bottom:1px solid var(--line); color:#f2efe8; padding:4px 0;
  }
  .req-head .title-input:focus { outline:none; border-color:var(--gold); }
  .remove-btn { font-family:'JetBrains Mono',monospace; font-size:10px; background:transparent; border:1px solid var(--line); color:var(--mist-dim); padding:5px 9px; border-radius:5px; cursor:pointer; flex-shrink:0; }
  .remove-btn:hover { color:var(--danger); border-color:var(--danger-dim); }
  .desc-textarea {
    width:100%; font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--panel-raised); color:var(--mist);
    border:1px solid var(--line); border-radius:6px; padding:9px 11px; min-height:64px; resize:vertical;
  }
  .desc-textarea:focus { outline:none; border-color:var(--gold); }

  .add-btn {
    font-family:'JetBrains Mono',monospace; font-size:12px; background:transparent; border:1px dashed var(--line);
    color:var(--mist-dim); padding:10px 16px; border-radius:8px; cursor:pointer; width:100%;
  }
  .add-btn:hover { color:var(--gold); border-color:var(--gold-dim); }

  .save-bar { position:sticky; bottom:0; background:var(--ink); padding:14px 0; text-align:center; }
  .save-flag { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-top:6px; }
  .save-flag.dirty { color:var(--gold); }

  .empty-wrap { text-align:center; padding:60px 20px; color:var(--mist-dim); font-family:'JetBrains Mono',monospace; font-size:12px; }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <script src="nav.js"></script>
  


<header>
  <a class="back-link" href="dev-tools.html">← 개발자 도구로</a>
  <div class="header-top">
    <div>
      <div class="eyebrow">Feature Requests</div>
      <h1>요청 목록</h1>
    </div>
    <div class="header-actions">
      <button class="action-btn" id="uploadBtn">⬆ 업로드</button>
      <input type="file" id="uploadInput" accept="application/json" style="display:none;" />
      <button class="action-btn" id="downloadBtn">⬇ 다운로드</button>
      <button class="action-btn primary" id="saveBtn">저장</button>
    </div>
  </div>
  <div class="mock-badge">⚠ 여기 적어두고 다운로드해서 대화에 올리면, 하나씩 구현해서 답변드림</div>
</header>

<main id="mainArea"></main>

<script>
  // 개발자 도구 전용 페이지 — 2inkle 계정이 아니면 접근 자체를 막음.
  if ((localStorage.getItem("battleSim_username") || "2inkle") !== "2inkle") {
    document.body.innerHTML = `
      <div style="padding:80px 20px;text-align:center;font-family:'JetBrains Mono',monospace;color:#726d87;">
        🔒 개발자 도구 전용 페이지입니다.<br/><a href="roster-index.html" style="color:#d9b45c;">← 홈으로</a>
      </div>
    `;
    throw new Error("access-denied");
  }

  // ============================================================================
  // 요청 목록 — [{title, description, done}] 배열. 순수하게 "적어두고 파일로
  // 빼내기" 용도라 다른 테이블처럼 게임에서 직접 읽어가는 데이터는 아님.
  // ============================================================================
  function getRequests() {
    try { return JSON.parse(localStorage.getItem("battleSim_featureRequests")) || []; }
    catch { return []; }
  }
  function saveRequests(list) {
    localStorage.setItem("battleSim_featureRequests", JSON.stringify(list));
  }
  function downloadJSON(filename, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  let requests = getRequests();
  let isDirty = false;
  function markDirty() { isDirty = true; renderSaveFlag(); }
  function renderSaveFlag() {
    const el = document.getElementById("saveFlag");
    if (el) { el.textContent = isDirty ? "저장 안 된 변경사항 있음" : "저장됨"; el.className = "save-flag" + (isDirty ? " dirty" : ""); }
  }

  function render() {
    const el = document.getElementById("mainArea");
    if (requests.length === 0) {
      el.innerHTML = `<div class="empty-wrap">아직 적어둔 요청이 없어요. 아래 버튼으로 추가해보세요.</div><button class="add-btn" id="addBtn" style="margin-top:12px;">+ 요청 추가</button>`;
      document.getElementById("addBtn").addEventListener("click", addRequest);
      return;
    }
    el.innerHTML = requests.map((r, i) => `
      <div class="req-card ${r.done ? "done" : ""}" data-idx="${i}">
        <div class="req-head">
          <input type="checkbox" class="status-toggle" title="완료 표시" ${r.done ? "checked" : ""} />
          <input type="text" class="title-input" value="${r.title || ""}" placeholder="제목" />
          <button class="remove-btn">✕</button>
        </div>
        <textarea class="desc-textarea" placeholder="원하는 걸 자유롭게 적어두세요">${r.description || ""}</textarea>
      </div>
    `).join("") + `<button class="add-btn" id="addBtn">+ 요청 추가</button>`;

    el.querySelectorAll(".req-card").forEach((card) => {
      const idx = Number(card.dataset.idx);
      const r = requests[idx];
      card.querySelector(".status-toggle").addEventListener("change", e => { r.done = e.target.checked; markDirty(); render(); });
      card.querySelector(".title-input").addEventListener("input", e => { r.title = e.target.value; markDirty(); });
      card.querySelector(".desc-textarea").addEventListener("input", e => { r.description = e.target.value; markDirty(); });
      card.querySelector(".remove-btn").addEventListener("click", () => { requests.splice(idx, 1); markDirty(); render(); });
    });
    document.getElementById("addBtn").addEventListener("click", addRequest);
  }

  function addRequest() {
    requests.push({ title: "", description: "", done: false });
    markDirty();
    render();
    // 방금 추가한 카드의 제목 입력칸에 포커스
    const cards = document.querySelectorAll(".req-card");
    const last = cards[cards.length - 1];
    if (last) last.querySelector(".title-input").focus();
  }

  document.getElementById("saveBtn").addEventListener("click", () => {
    saveRequests(requests);
    isDirty = false; renderSaveFlag();
  });
  document.getElementById("downloadBtn").addEventListener("click", () => {
    downloadJSON("feature-requests.json", requests);
  });
  document.getElementById("uploadBtn").addEventListener("click", () => {
    document.getElementById("uploadInput").click();
  });
  document.getElementById("uploadInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch { alert("올바른 JSON 파일이 아니에요."); return; }
      if (!Array.isArray(parsed)) { alert("요청 목록 형식이 아니에요(배열이어야 함)."); return; }
      if (!confirm("지금 이 브라우저에 저장된 요청 목록을 파일 내용으로 완전히 덮어쓸까요?")) return;
      saveRequests(parsed);
      location.reload();
    };
    reader.readAsText(file);
  });

  render();
  document.querySelector("main").insertAdjacentHTML("afterend", `<div class="save-bar"><div class="save-flag" id="saveFlag">저장됨</div></div>`);
</script>
</body>
</html>
