<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>캐릭터 정보창 · Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; }
  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim);
    text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; transition:color 0.15s ease;
  }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  header { padding:20px 32px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .back-link { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); text-decoration:none; }
  .back-link:hover { color:var(--cyan); }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  .mock-badge { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--mist-dim); border:1px dashed var(--line); border-radius:20px; padding:5px 12px; }
  .spectate-banner {
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--danger);
    background:rgba(217,97,92,0.1); border:1px solid var(--danger-dim); border-radius:8px;
    padding:12px 16px; margin-bottom:16px;
  }

  main { flex:1; display:grid; grid-template-columns:280px 1fr 420px; gap:1px; background:var(--line); }
  @media (max-width:1200px) { main { grid-template-columns:1fr; } }
  section { background:var(--ink); padding:20px; min-width:0; }
  /* #spectateBanner도 <main>의 grid item이라, 비어있어도(관전 모드가 아니면
     항상 빈 채로 있음) 1번 칸(280px)을 차지해서 profileSection/statSection/
     patternSection이 전부 한 칸씩 밀리는 버그가 있었음(2026-08-14 발견) —
     3칼럼 전체 폭으로 지정해서 grid 흐름에서 완전히 분리함. */
  #spectateBanner:empty { display:none; }
  #spectateBanner { grid-column:1/-1; }

  h2.section-title { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--mist-dim); margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; }
  h2.section-title .hint { color:var(--gold); font-size:10px; letter-spacing:0.04em; text-transform:none; }
  .block { margin-bottom:26px; }
  .block:last-child { margin-bottom:0; }

  /* 프로필 */
  .portrait { width:100%; aspect-ratio:3/4; border-radius:10px; border:1px solid var(--line);
    background: repeating-linear-gradient(135deg, var(--panel) 0 10px, var(--panel-raised) 10px 20px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:40px; }
  .char-title { font-family:'Cinzel',serif; font-size:20px; color:#f2efe8; margin:14px 0 2px; }
  .char-sub { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); }
  .level-row { display:flex; align-items:baseline; gap:8px; margin-top:14px; }
  .level-row .lv-num { font-family:'Cinzel',serif; font-size:16px; color:var(--gold); }
  .level-row .lv-label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); letter-spacing:0.08em; }
  .exp-bar { height:6px; border-radius:3px; background:var(--panel-raised); border:1px solid var(--line); overflow:hidden; margin-top:8px; }
  .exp-bar > i { display:block; height:100%; background:linear-gradient(90deg, var(--cyan-dim), var(--cyan)); }
  .exp-caption { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); margin-top:5px; text-align:right; }
  .row-toggle { display:flex; gap:6px; margin-top:12px; }
  .row-btn { flex:1; font-family:'JetBrains Mono',monospace; font-size:11px; padding:7px 0; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--mist-dim); cursor:pointer; }
  .row-btn:hover { border-color:var(--mist-dim); color:var(--mist); }
  .row-btn.active { border-color:var(--gold); color:var(--gold); background:#d9b45c14; }
  .guard-toggle { display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:12px; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--mist-dim); cursor:pointer; text-align:left; }
  .guard-toggle:hover { border-color:var(--mist-dim); }
  .guard-toggle.active { border-color:var(--cyan); color:var(--cyan); background:#5fd3c414; }
  .guard-toggle.armed { border-color:var(--gold-dim); color:var(--gold); border-style:dashed; }
  .guard-toggle .guard-hint { font-size:9.5px; color:var(--mist-dim); font-weight:normal; }

  /* 스탯/장비 (가운데) */
  .points-banner { display:flex; align-items:center; justify-content:space-between; background:var(--panel-raised); border:1px solid var(--gold-dim); border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  .points-banner .p-label { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); }
  .points-banner .p-value { font-family:'Cinzel',serif; font-size:18px; color:var(--gold); margin-left:6px; }

  .max-row { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim); padding:5px 4px; }
  .max-row span:last-child { color:#f2efe8; }

  .stat-row { display:grid; grid-template-columns:82px 1fr auto; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .stat-row:last-child { border-bottom:none; }
  .stat-row .s-name { font-family:'Cinzel',serif; font-size:13px; color:#f2efe8; }
  .stat-row .s-bars { display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .stat-row .s-bonus { color:var(--cyan); font-size:11px; }
  .stat-row .s-real-gear { color:var(--gold); font-size:10px; margin-left:2px; }
  .stepper { display:flex; align-items:center; gap:5px; }
  .stepper button { min-width:30px; height:22px; padding:0 6px; border-radius:5px; border:1px solid var(--line); background:var(--panel); color:var(--mist); font-family:'JetBrains Mono',monospace; font-size:11px; cursor:pointer; line-height:1; }
  .stepper button:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
  .stepper button:disabled { opacity:0.3; cursor:not-allowed; }

  .resource-bar-row { margin-bottom:10px; }
  .resource-bar-row .rb-label { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11px; margin-bottom:4px; color:var(--mist-dim); }
  .resource-bar { height:8px; border-radius:4px; background:var(--panel-raised); overflow:hidden; border:1px solid var(--line); }
  .resource-bar > i { display:block; height:100%; border-radius:4px; }
  .resource-bar.hp > i { background:var(--ember); } .resource-bar.sp > i { background:var(--cyan); }
  .resource-bar.weight > i { background:var(--gold); } .resource-bar.weight.over > i { background:var(--danger); }
  .weight-warning { display:flex; align-items:center; gap:6px; margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--danger); }
  .set-bonus-note { margin-top:8px; padding:8px 10px; border-radius:6px; border:1px solid var(--gold-dim); background:#d9b45c14; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--gold); line-height:1.6; }

  .equip-slots { display:grid; grid-template-columns:1fr; gap:8px; margin-top:4px; }
  .equip-slot { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); }
  .equip-slot .e-icon { width:28px; height:28px; border-radius:5px; background:var(--panel-raised); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .equip-slot .e-body { flex:1; min-width:0; }
  .equip-slot .e-type { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; color:var(--mist-dim); text-transform:uppercase; }
  .equip-slot .e-name { font-size:12px; color:#f2efe8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .equip-slot .e-bonus { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--cyan); }
  .equip-slot.empty { border-style:dashed; color:var(--mist-dim); }
  .equip-slot.empty .e-name { color:var(--mist-dim); font-family:'JetBrains Mono',monospace; font-size:11px; }
  .unequip-x { background:none; border:none; color:var(--mist-dim); cursor:pointer; font-size:13px; padding:2px 4px; }
  .unequip-x:hover { color:var(--danger); }

  .equip-filter-input { width:100%; box-sizing:border-box; margin-top:10px; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel-sunken); color:var(--mist); font-family:'Inter',sans-serif; font-size:12.5px; }
  .equip-filter-input:focus { outline:none; border-color:var(--gold); }
  .inv-empty { padding:14px 4px; color:var(--mist-dim); font-size:12px; text-align:center; }
  .inv-list { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .inv-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel-sunken); }
  .inv-item .i-name { font-size:13px; color:var(--mist); }
  .inv-item .i-slot-tag { font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--mist-dim); margin-left:6px; }
  .inv-item .i-bonus { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--cyan); margin-left:8px; }
  .equip-btn { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.05em; background:transparent; border:1px solid var(--cyan-dim); color:var(--cyan); padding:5px 10px; border-radius:5px; cursor:pointer; white-space:nowrap; }
  .equip-btn:hover { border-color:var(--cyan); background:#5fd3c414; }

  /* 패턴 빌더 (오른쪽, 핵심) */
  .preset-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .preset-tab { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.04em; background:var(--panel); border:1px solid var(--line); color:var(--mist-dim); padding:7px 12px; border-radius:6px; cursor:pointer; }
  .preset-tab.active { border-color:var(--gold); color:var(--gold); background:var(--panel-raised); }
  .preset-tab.add { color:var(--mist-dim); border-style:dashed; }

  .pattern-list { display:flex; flex-direction:column; gap:10px; }
  .pattern-row { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:10px 12px; }
  .pattern-row.locked { opacity:0.5; }
  .pattern-row.active { border-color:var(--gold-dim); box-shadow:0 0 12px -6px var(--gold); }

  .row-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .row-head .idx { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); }
  .pattern-row.locked .row-head .idx { color:var(--mist-dim); }
  .row-actions { display:flex; gap:4px; }
  .mini-btn { width:20px; height:20px; border-radius:4px; border:1px solid var(--line); background:var(--panel-raised); color:var(--mist-dim); font-size:10px; cursor:pointer; line-height:1; }
  .mini-btn:hover { color:var(--mist); border-color:var(--mist-dim); }
  .mini-btn.danger:hover { color:var(--danger); border-color:var(--danger-dim); }

  .builder-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .builder-line:last-child { margin-bottom:0; }
  .cb-tag { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.08em; color:var(--mist-dim); width:34px; flex-shrink:0; }
  select, input[type=number] {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel-sunken); color:var(--mist);
    border:1px solid var(--line); border-radius:5px; padding:5px 7px;
  }
  select:hover, input[type=number]:hover { border-color:var(--mist-dim); }
  select:focus, input[type=number]:focus { outline:none; border-color:var(--gold); }
  input[type=number] { width:58px; }
  select.cb-action { color:#f2efe8; }

  .lock-note { margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mist-dim); display:flex; gap:5px; align-items:center; }

  .add-row-btn { width:100%; margin-top:4px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.05em; background:transparent; border:1px dashed var(--line); color:var(--mist-dim); padding:9px; border-radius:8px; cursor:pointer; }
  .add-row-btn:hover { border-color:var(--gold); color:var(--gold); }

  .save-row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .unsaved-flag { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ember); display:flex; align-items:center; gap:6px; }
  .unsaved-flag.clean { color:var(--mist-dim); }
  .unsaved-flag .dot { width:6px; height:6px; border-radius:50%; background:var(--ember); }
  .unsaved-flag.clean .dot { background:var(--mist-dim); }
  .save-btn { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em; background:var(--ember); color:#1a1108; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; text-transform:uppercase; }
  .save-btn:disabled { background:var(--panel-raised); color:var(--mist-dim); cursor:not-allowed; }
  .section-save-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .section-save-flag { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ember); display:flex; align-items:center; gap:6px; }
  .section-save-flag.clean { color:var(--mist-dim); }
  .section-save-flag .dot { width:6px; height:6px; border-radius:50%; background:var(--ember); }
  .section-save-flag.clean .dot { background:var(--mist-dim); }
  .section-save-row .save-btn { padding:6px 12px; font-size:10px; }

  .skill-list { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .skill-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); }
  .skill-item .sk-main { display:flex; flex-direction:column; gap:3px; }
  .skill-item .sk-name { font-size:13.5px; color:#f2efe8; }
  .skill-item .sk-meta { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist-dim); letter-spacing:0.02em; }
  /* 스킬 카드(습득한/습득 가능 스킬) 전용 — 정보가 많아 세로로 쌓음. 전직/테스트
     도구 등 기존의 단순 이름+버튼 한 줄짜리 .skill-item에는 영향 없음. */
  .skill-item.skill-card { flex-direction:column; align-items:stretch; gap:7px; padding:11px 13px; }
  .skill-item.skill-card .sk-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  /* 스펙 한 줄(칩 나열) — "Break Down / 5pt / enemy · individual / 35sp /
     570%×1 / Physical / Atk-30% / (0:10)" 식으로, 예전에 대상/코스트/딜레이가
     각각 세로로 쌓이던 걸 flex-wrap 한 줄로 압축(사용자 피드백 반영). */
  .sk-spec-line { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
  .sk-chip { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.02em; padding:3px 8px; border-radius:5px; background:var(--panel-raised); border:1px solid var(--line); color:var(--mist-dim); white-space:nowrap; }
  .sk-chip.physical { color:var(--ember); border-color:var(--ember-dim); }
  .sk-chip.magic    { color:var(--cyan);  border-color:var(--cyan-dim); }
  .sk-chip.support  { color:var(--gold);  border-color:var(--gold-dim); }
  .sk-chip.invalid  { color:var(--danger); border-color:var(--danger-dim); }
  .sk-chip.sk-effect.buff { color:var(--cyan); border-color:var(--cyan-dim); }
  .sk-chip.sk-effect.debuff { color:var(--danger); border-color:var(--danger-dim); }
  .sk-chip.sk-effect.neutral { color:var(--mist); }
  .skill-item.skill-card .sk-footer { display:flex; justify-content:flex-end; margin-top:2px; }
  .assign-btn { font-family:'JetBrains Mono',monospace; font-size:10px; background:transparent; border:1px solid var(--gold-dim); color:var(--gold); padding:4px 9px; border-radius:5px; cursor:pointer; white-space:nowrap; }
  .assign-btn:hover { border-color:var(--gold); background:#d9b45c14; }
  .assign-btn:disabled { opacity:0.35; border-color:var(--line); color:var(--mist-dim); cursor:not-allowed; background:transparent; }

  .empty-wrap { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:100px 20px; text-align:center; }
  .empty-wrap .e-icon { font-size:34px; }
  .empty-wrap .e-title { font-family:'Cinzel',serif; font-size:18px; color:#f2efe8; }
  .empty-wrap .e-desc { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim); max-width:340px; line-height:1.6; }
  .empty-wrap a { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); text-decoration:none; border:1px solid var(--gold-dim); padding:8px 16px; border-radius:6px; margin-top:4px; }
  .empty-wrap a:hover { border-color:var(--gold); background:#d9b45c14; }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <script src="nav.js"></script>
  <script src="exp-table.js"></script>
  



<header>
  <a class="back-link" href="roster-index.html">← 용병단으로</a>
  <span class="eyebrow">Character Sheet</span>
  <span class="mock-badge">⚠ 테스트 빌드 — 섹션별 저장 버튼을 누르면 계정에 저장됩니다</span>
</header>

<main>
  <div id="spectateBanner"></div>
  <section id="profileSection"></section>
  <section id="statSection"></section>
  <section id="patternSection"></section>
  <section id="advancementSection" style="grid-column:1/-1;"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
<script>
  // 개발자도구 네비게이션 노출은 nav.js가 profiles.is_admin으로 직접 판정함 —
  // 예전엔 이 페이지가 localStorage("battleSim_username")를 읽어 같은 일을
  // 중복으로 했었는데(그 키를 set하는 흐름이 아예 없어서 사실상 항상 노출),
  // 페이지별 사본을 없애고 nav.js 한 곳으로 일원화함.

// ============================================================================
// 목업 데이터 (mockDb 시드와 동일 인물 기준으로 확장)
// ============================================================================
// 조건 타입 레지스트리 — 조건 종류는 계속 늘어날 예정이므로, 새 조건을 추가할 때
// 이 객체에 항목 하나만 더하면 됨(라벨/비교연산자 필요 여부/단위). 빌더의 드롭다운과
// 상세 입력칸 표시 여부는 전부 이 메타데이터를 읽어서 자동으로 그려짐.
const CONDITION_TYPES = {
  always:   { label:"조건 없음(항상)", needsDetail:false },
  hp:       { label:"HP",           needsDetail:true, unit:"%" },
  sp:       { label:"SP",           needsDetail:true, unit:"%" },
  resource: { label:"자원 개수",      needsDetail:true, unit:"개" },
  notGuarding: { label:"Guard 중이 아닐 때", needsDetail:false }
  // 새 조건 예시: turnCount: { label:"경과 턴 수", needsDetail:true, unit:"턴" }
};

  // 이미 한도에 도달했으면 완전히 무효. 실제 판정은 src/prepState.js의

  actionDelay:    { label:"행동 지연",   polarity:"debuff", requiresPreDelayType:"action", valueUnit:"%" },

// ============================================================================
// 선딜레이 종류 레지스트리 — 스킬 발동 전 준비 동작이 어떤 성격인지에 따라
// 어떤 지연 효과가 먹히는지가 달라짐. Action 속성은 EFFECT_TYPES.actionDelay로,
// Casting 속성은 EFFECT_TYPES.castDelay로만 늦출 수 있음(완전 취소는 없음 — 위
// EFFECT_TYPES 설명 참고) — 이 매칭은 각 효과의 requiresPreDelayType 필드로
// 데이터화되어 있어서, 전투 엔진은 "타겟이 현재 선딜레이 중이고, preDelayType이
// 맞는 효과의 requiresPreDelayType과 같은지"만 확인하면 되도록 설계함. 새
// 선딜레이 종류가 필요하면 이 객체에 { label } 한 줄만 추가하면 스킬 표시에
// 자동 반영됨.
// ============================================================================
const PRE_DELAY_TYPES = {
  action:  { label:"행위(Action)" },
  casting: { label:"주문 읊기(Casting)" }
  // 새 선딜레이 종류 예시: channel: { label:"채널링" }

// ============================================================================
// 스킬 하나의 전체 필드 형태(공통 스킬 "공격"이 견본):
//   name, requiredLevel, skillPointCost,
//   stat, coefficient        — 기본 위력 계산(피해/회복 등 스킬의 1차 수치)
//   costs[]                  — 사용 코스트(SP/HP/팀 자원 등 자유 조합)
//   skillType                — SKILL_TYPES 키(physical/magic/support)
//   targetFaction, targetCount — TARGET_FACTION_TYPES / TARGET_COUNT_TYPES 키
//   preDelay, preDelayType, postDelay — 딜레이(선제:후속)
//   effects[]                — 부가효과 배열(EFFECT_TYPES 키 기반, 여러 개 동시 가능)
//   invalid                  — true면 "차단 불가": 상대 진영의 "아군 보호"(전열
//                              taunt) 규칙을 무시하고 원래 대상 풀에서 그대로
//                              선택함. 힐이 탱커한테만 쏠리는 걸 뚫거나, 요주의
//                              대상·선딜레이 준비 중인 캐릭터를 직접 노릴 단일/
//                              다수기에 붙이는 용도(생략하면 기본 false).
// 전부 선택 필드라 값을 아직 안 정한 스킬은 필드 자체를 생략해도 되고, 그 항목은
// Sheet 화면에서 조용히 생략됨.
// ============================================================================
// 스킬 테이블은 이제 game_content 테이블(key='skillTable')에서 읽어옴 —
// character-sheet.html/monster-sheet.html 둘 다 같은 데이터를 봄(예전엔 각자
// 하드코딩된 사본이 있어서 "마도사"/"마법사"처럼 이름이 어긋나는 실수가 실제로
// 있었음). 값이 비동기로 도착하므로 const가 아니라 let — 아래 부트스트랩
// IIFE가 첫 렌더 전에 채워 넣는다(렌더 함수들은 클로저로 이 변수를 봄).
let COMMON_SKILLS = [];
let SKILL_TABLE = {};

// ============================================================================
// 전직(승급) 요구조건 레지스트리 — COST_TYPES와 동일한 설계 언어.
// 새 조건 종류(예: 특정 스킬 습득 여부, 퀘스트 완료 등)가 필요하면 이 객체에
// { label, describe, check } 한 줄만 추가하면 JOB_ADVANCEMENT_TABLE의 requirements
// 배열에서 바로 쓸 수 있음.
// ============================================================================
const ADVANCEMENT_REQUIREMENT_TYPES = {
  level: {
    label: "레벨",
    describe: (value) => `Lv.${value}`,
    check: (data, value) => data.level >= value
  },
  item: {
    label: "아이템 보유",
    describe: (value) => `"${value}" 보유`,
    check: (data, value) => hasItem(data, value)
  }
  // 새 조건 예시: quest: { label:"퀘스트 완료", describe:v=>`퀘스트 "${v}" 완료`, check:(data,v)=>data.completedQuests?.includes(v) }
};

function hasItem(data, itemName) {
  const inKeyItems = (data.keyItems || []).some((name) => name === itemName);
  const inEquipment = Object.values(data.equipment || {}).some((it) => it && it.name === itemName);
  return inKeyItems || inEquipment;
}

// ============================================================================
// 직업별 전직(승급) 테이블 — 현재 직업(data.job)을 키로, 전직 가능한 상위 직업
// 목록을 관리. 각 항목: toJob(전직할 직업명), portrait(전직 후 초상화),
// requirements(레벨/아이템 등 조건 배열, 전부 만족해야 전직 가능).
// 조건을 만족하지 못한 전직 선택지는 화면에 아예 표시되지 않음(스킬과 동일한 방식).
//
// 승급한 직업도 그대로 SKILL_TABLE의 키가 되므로, 비숍/드루이드 등의 전용 스킬을
// 만들고 싶으면 SKILL_TABLE에 "비숍": [...] 식으로 배열을 추가하면 됨(지금은
// 비어있어 전직 직후엔 습득 가능한 스킬이 없이 시작함 — 다음 작업으로 채우면 됨).
// ============================================================================
// 승급 트리 — 이제 game_content 테이블(key='jobTable')에서 읽어옴(예전엔 여기
// 하드코딩 → localStorage였음). COMMON_SKILLS와 같은 이유로 let.
let JOB_ADVANCEMENT_TABLE = {};

function getAvailableAdvancements(data) {
  return (JOB_ADVANCEMENT_TABLE[data.job] || []).filter((adv) =>
    adv.requirements.every((r) => ADVANCEMENT_REQUIREMENT_TYPES[r.type].check(data, r.value))
  );
}

function describeRequirements(adv) {
  return adv.requirements.map((r) => ADVANCEMENT_REQUIREMENT_TYPES[r.type].describe(r.value)).join(" · ");
}

// job이 ancestorJob 본인이거나, ancestorJob으로부터 전직(승급)을 거쳐 도달 가능한
// 직업인지 판정. J.Item 착용 규칙("하위 직업 아이템은 상위 직업도 착용 가능,
// 그 반대는 불가")에 씀 — JOB_ADVANCEMENT_TABLE의 전직 트리를 그대로 타고 내려감.
function isJobOrDescendantOf(job, ancestorJob) {
  if (job === ancestorJob) return true;
  return (JOB_ADVANCEMENT_TABLE[ancestorJob] || []).some((adv) => isJobOrDescendantOf(job, adv.toJob));
}

// ============================================================================
// Supabase 연동 — 캐릭터는 characters 테이블, 장비는 warehouse_items 테이블.
// 예전엔 battleSim_roster/battleSim_warehouse(localStorage)를 통째로 읽고 통째로

//   - 장착/해제는 warehouse_items.held_by를 직접 갱신(= 유일한 진실 공급원,

let equipFilterQuery = ""; // 창고 장비 목록 이름 검색어 — 렌더마다 초기화되면 안 되므로 모듈 상태로 유지

// ============================================================================
// DB 행(snake_case) → 기존 렌더 코드가 기대하는 camelCase 모양으로 변환.
// roster-index.html/hire.html과 같은 어댑터 컨벤션 — 렌더 함수 자체는 안 건드림.

function mapCharacterRow(row) {

function mapItemRow(row) {

// DB/네트워크 오류는 조용히 삼키지 않음 — 창고 거래가 절반만 반영되는 상황을
// 사용자가 모르고 지나가면 안 되므로 콘솔 + 알림 양쪽에 남김.
function reportError(where, err) {
  console.error(`[character-sheet] ${where}`, err);
  alert(`저장/갱신에 실패했습니다 (${where}): ${err?.message || err}`);
}

// ============================================================================
// 섹션별 저장 — 버튼마다 "이 필드들만" 커밋하도록 매핑. 예를 들어 패턴을
// 편집하다가 스탯 섹션의 저장 버튼을 눌러도 real_stats만 반영되고 presets(패턴)는
// 여전히 미저장 상태로 남음. 값은 "메모리 필드명 → DB 컬럼명".
//
// ⚠ equipment 섹션에서 "equipment"가 빠졌음 — characters 테이블에 equipment
// 컬럼이 없다(warehouse_items.held_by가 유일한 진실 공급원). 장착/해제는 저장
// 버튼과 무관하게 즉시 warehouse_items에 반영되고, 이 섹션 버튼은 이제
// personal_resources만 커밋함.
// ============================================================================
const SAVE_SECTIONS = {
  profile:   { fields: { row:"row_position", guardAllies:"guard_allies", job:"job", level:"level", portrait:"portrait", keyItems:"key_items" } },
  stat:      { fields: { realStats:"real_stats" } },
  equipment: { fields: { personalResources:"personal_resources" } },
  skill:     { fields: { learnedSkillNames:"learned_skill_names" } },
  pattern:   { fields: { presets:"presets" } },
};
const dirtyFlags = { profile:false, stat:false, equipment:false, skill:false, pattern:false };

function markDirty(section) {
  dirtyFlags[section] = true;
}

// 이 섹션에 속한 컬럼만 골라서 characters 행에 update. 다른 섹션의 컬럼은
// 아예 payload에 안 들어가므로, 다른 곳에서 이미 반영된 내용을 덮어쓰지 않음
// (예전에 "로스터 전체를 다시 읽어서 그 위에 얹던" 이유가 여기선 자연히 해결됨).
async function saveSection(section) {
  // 소유자가 아니면(=URL의 id를 바꿔서 남의 캐릭터에 들어온 경우) 절대 저장 안 함.
  // RLS가 서버에서 한 번 더 막지만, 화면 흐름상으로도 여기서 끊음.
  if (!isOwner) return;

  // ⚠ 무게 초과를 여기서 막으면 안 됨(예전 주석 그대로 유효) — 무게 제한은
  // (1) 장착 시점 차단(isItemEquippableBy) (2) 저장 버튼 비활성화
  // (renderSectionSaveButton) 두 곳에서 거름.
  const payload = {};
  Object.entries(SAVE_SECTIONS[section].fields).forEach(([field, column]) => {
    payload[column] = data[field];
  });
  const { error } = await window.sbClient
    .from("characters")
    .update(payload)
    .eq("id", charId)
    .eq("user_id", session.user.id);
  if (error) { reportError(`${section} 저장`, error); return; }
  dirtyFlags[section] = false;
}

// 섹션 저장 버튼 HTML — "N건" 같은 카운트 없이 "저장 안 된 변경사항 있음/저장됨"
// 정도로만 표시(자잘한 조작을 반복하다 보면 숫자가 커져서 오히려 부담스러워
// 보인다는 이유로 카운트 표시는 뺌).
function renderSectionSaveButton(section) {
  const isDirty = dirtyFlags[section];
  if (!isOwner) {
    return `
      <div class="section-save-row">
        <span class="section-save-flag clean"><span class="dot"></span>관전 모드 — 저장 불가</span>
        <button class="save-btn" data-save-section="${section}" disabled>저장</button>
      </div>
    `;
  }
  // 장비 섹션은 무게 초과 상태로는 저장할 수 없음. 해제/장착을 이리저리
  // 바꾸는 편집 도중에는 초과 상태를 오가도 되지만(그래야 "무거운 걸 빼고
  // 다른 걸 끼는" 순서 조작이 가능함), 확정하는 순간에는 반드시 용량 안에
  // 들어와 있어야 함 — DEX를 올려주는 장비를 뺐을 때 나머지가 초과로 남는
  // 구멍을 여기서 막음.
  if (section === "equipment") {
    const cap = computeWeightCapacity();
    const used = computeWeightUsed();
    if (used > cap) {
      return `
        <div class="section-save-row">
          <span class="section-save-flag" style="color:var(--danger);"><span class="dot"></span>무게 초과 (${used}/${cap}) — 저장할 수 없어요</span>
          <button class="save-btn" data-save-section="${section}" disabled title="무게 초과 상태로는 저장할 수 없습니다">저장</button>
        </div>
      `;
    }
  }
  return `
    <div class="section-save-row">
      <span class="section-save-flag ${isDirty ? "" : "clean"}"><span class="dot"></span>${isDirty ? "저장 안 된 변경사항 있음" : "저장됨"}</span>
      <button class="save-btn" data-save-section="${section}" ${isDirty ? "" : "disabled"}>저장</button>
    </div>
  `;
}

// 섹션 저장 버튼은 여러 렌더 함수에 걸쳐 반복 등장하므로, 매번 다시 바인딩하는
// 대신 문서 레벨에서 한 번만 위임 등록(버튼이 재렌더로 새로 생겨도 버블링으로
// 그대로 잡힘).
document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-save-section]");
  if (!btn || btn.disabled) return;
  const section = btn.dataset.saveSection;
  await saveSection(section);
  if (section === "profile") renderProfile();
  else if (section === "stat" || section === "equipment" || section === "skill") renderStatSection();
  else if (section === "pattern") renderPatternSection();
});

// ============================================================================
// 스탯 + 장비 (가운데)
// ============================================================================
const STAT_META = [
  { key:"str", label:"STR 힘" },
  { key:"int", label:"INT 지능" },
  { key:"dex", label:"DEX 민첩" },
  { key:"spd", label:"SPD 속도" },
  { key:"luk", label:"LUK 행운" }
];

// ============================================================================
// 스탯 포인트 / 스킬 포인트 획득 공식
// 초기치 없음 — 레벨 1은 기본 스탯(각 10)과 무료 시작 스킬만 갖고, 레벨업당
// 아래 수치만큼 포인트가 늘어남. unassignedPoints/skillPoints는 더 이상 캐릭터
// 데이터에 저장하지 않고, 매번 (레벨로 얻은 총량 - 이미 투자한 양)으로 계산함
// — 장비 무게/보너스 스탯과 같은 방식이라 저장값이 실제 상태와 어긋날 일이 없음.
// ============================================================================
const STAT_POINTS_PER_LEVEL = 5;
const SKILL_POINTS_PER_LEVEL = 2;
const BASE_STAT_VALUE = 10; // hire.html의 BASE_STATS와 동일한 기준치
const JOB_BASE_HP = 200; // src/character.js의 BaseJob.baseHp와 동일
const JOB_BASE_SP = 50;  // src/character.js의 BaseJob.baseSp와 동일

function allSkillsFlat() {
  return [...COMMON_SKILLS, ...Object.values(SKILL_TABLE).flat()];
}
function computeUnassignedPoints(d) {
  const earned = Math.max(0, d.level - 1) * STAT_POINTS_PER_LEVEL;
  const spent = STAT_META.reduce((sum, m) => sum + (d.realStats[m.key] - BASE_STAT_VALUE), 0);
  return earned - spent;
}
function computeSkillPoints(d) {
  const earned = Math.max(0, d.level - 1) * SKILL_POINTS_PER_LEVEL;
  const spent = allSkillsFlat()
    .filter(s => d.learnedSkillNames.includes(s.name))
    .reduce((sum, s) => sum + s.skillPointCost, 0);
  return earned - spent;
}

// ============================================================================
// 스탯 real/bonus/effective 클램프 공식 — BattleCharacter(src/character.js)의
// calculateEffectiveStat와 동일한 공식. 장비의 공격력/방어력/마법공격력도 이제
// 이 공식을 그대로 씀: effective = clamp(real+bonus, real×0.5, real×5).
// "낮은 Real + 버프 의존형" vs "높은 Real + 버프 덜 필요형"은 별도 공식이 아니라,
// 아이템마다 real 수치를 다르게 설계하는 것만으로 이 공식 위에서 자연히 갈림
// (real이 낮으면 5배를 해도 절대값이 작아서 "버프 없인 약함"이 성립).
// 2026-08-15: 상한을 2000%(×20)에서 500%(×5)로 축소 — src/character.js와 동일.
// ============================================================================
function calcEffective(real, bonus) {
  const maxCap = real * 5;   // 버프로도 real의 500%를 못 넘음
  const minFloor = real * 0.5;
  return Math.max(minFloor, Math.min(maxCap, real + bonus));
}

// ============================================================================
// 스탯 표기 용어 통일 규칙 (앞으로 추가되는 모든 표시 문구에 적용):
//   - real형 수치에 영향 → "real" + 스탯명 접두사 (예: realSTR, realATK, realMATK)
//   - bonus형 수치에 영향 → 스탯명만, "real" 접두사 없음 (예: STR, ATK)
// describeItem()/ITEM_SET_TABLE의 description 문구는 전부 이 규칙을 따름.
// ============================================================================

// 아이템의 옵션 필드들을 사람이 읽을 표시 문구로 자동 생성(고정 bonus 문자열을
// 따로 저장하지 않아도 필드만 채우면 화면에 정확히 반영되도록).
function describeItem(item) {
  const parts = [];
  if (item.equipmentType) parts.push(item.equipmentType);
  const combatReal = item.combatReal || {};
  const combatBonus = item.combatBonus || {};
  [["ATK", "atk"], ["MATK", "matk"], ["DEF", "def"], ["MDEF", "mdef"]].forEach(([label, key]) => {
    if (combatReal[key] || combatBonus[key]) parts.push(`${label} ${combatReal[key] || 0}+${combatBonus[key] || 0}`);
  });
  if (item.statRealBonus) {
    STAT_META.forEach((m) => { if (item.statRealBonus[m.key]) parts.push(`real${m.label.split(" ")[0]} +${item.statRealBonus[m.key]}`); });
  }
  if (item.statBonus) {
    STAT_META.forEach((m) => { if (item.statBonus[m.key]) parts.push(`${m.label.split(" ")[0]} +${item.statBonus[m.key]}`); });
  }
  if (item.patternSlotBonus) parts.push(`패턴 슬롯 +${item.patternSlotBonus}`);
  if (item.weight) parts.push(`무게 ${item.weight}`);
  if (item.requiredJob) parts.push(`"${item.requiredJob}" 계열 전용`);
  if (item.twoHanded) parts.push(`양손 무기`);
  if (item.avatarPortrait) parts.push(`외형 ${item.avatarPortrait}로 변경`);
  if (item.grantsSkill) parts.push(`"${item.grantsSkill}" 사용 가능`);
  if (item.consumable) parts.push(`소모품 · 전투당 ${item.usesPerBattle || 1}회`);
  if (item.setId && ITEM_SET_TABLE[item.setId]) parts.push(`[${ITEM_SET_TABLE[item.setId].name}]`);
  return parts.join(" · ") || "옵션 없음";
}

// ============================================================================
// 장비 슬롯 종류 레지스트리 — 캐릭터가 동시에 착용할 수 있는 슬롯 12종.

// equipment 객체에도 키를 추가해야 신규 캐릭터가 그 슬롯을 갖고 시작함).
// ============================================================================

// needsEquipmentType — 이 슬롯의 아이템에 equipmentType(dagger/sword/greatsword/
// staff/bow/gun/robe/armor/plate/sandal/shoes/greave 등, 직업별 착용 가능
// 여부를 가릴 무게/숙련 등급 분류)이 필요한지. 무기·방어구 계열(mainhand/
// subhand/armor/shoes/head)만 true — 나머지는 각자 다른 이유로 false:
//   jItem   — 이미 requiredJob(아이템 쪽에 직접 붙는 단일 직업 지정, job→type
//             목록이 아니라 item→job 단방향)으로 착용 가능 여부가 갈림.
//             equipmentType과는 완전히 다른 메커니즘이라 겹쳐 쓸 필요 없음.
//   uItem   — 소모형이라 모든 캐릭터가 동일하게 사용 가능(직업 제한 자체가 없음).
//   cloak/accessory/item — 직업 제한을 둘 필요가 없는 범용 슬롯으로 정함.
//   avatar/skillSeal — 무기·방어구가 아니라 외형/스킬 부여용이라 해당 없음.
// equipmentType은 "직업이 어떤 타입들을 허용하는지" 목록을 직업 테이블 쪽에
// 따로 둘 예정(아이템 쪽에서 직업을 지정하는 requiredJob과는 반대 방향) — 지금
// 당장은 아이템에 값만 붙여두고, 직업 테이블 연동은 필요할 때 별도로 진행함.
// ============================================================================

  skillSeal: { label: "SkillSeal", order: 11, description: "원래 못 쓰는 스킬을 쓸 수 있게 해줌", needsEquipmentType: false },

// 아이템이 이 캐릭터에게 착용 가능한지. requiredJob이 없으면 전 직업 공용.
// requiredJob이 있으면 J.Item 규칙(isJobOrDescendantOf) 적용.
// ============================================================================
// 장비 소유 모델 — 캐릭터 개인 인벤토리(data.inventory)는 더 이상 안 씀.
// warehouse_items 테이블 안에서 장비 항목을 두 가지 상태로 다룸:
//   풀(pool)   — held_by IS NULL. quantity로 뭉쳐서 관리(같은 이름+분류는 병합).
//                누구나 장착 후보로 가져갈 수 있음.
//   보유(held) — held_by: 캐릭터 uuid. quantity 항상 1(개별 인스턴스). 그
//                캐릭터가 장착 중인 바로 그 장비 — 다른 캐릭터에겐 안 보임.
// 장착: 풀 행의 quantity가 1이면 그 행에 held_by만 붙임(행 이동 없음). 2 이상이면
//   quantity를 1 줄이고 같은 스펙의 새 행을 quantity:1 + held_by로 insert.
// 해제: 같은 스펙의 풀 행이 있으면 그 행 quantity +1 하고 held 행을 삭제,
//   없으면 held 행의 held_by만 NULL로 되돌림(행을 지웠다 만들 필요 없음).
// data.equipment는 이제 저장되는 필드가 아니라 held_by 조회 결과로 매번
// 조립되는 파생값 — characters 테이블에 equipment 컬럼 자체가 없음.
// ============================================================================

// 풀 행에서 "held 인스턴스" insert payload(snake_case)를 만듦. 이미 DB 행이라
// 컬럼명은 그대로 두고 id/quantity/held_by/created_at만 갈아끼움.
function buildHeldInsertPayload(poolRow) {
  const { id, quantity, held_by, created_at, ...rest } = poolRow;
  return { ...rest, user_id: session.user.id, quantity: 1, held_by: charId };
}

// 풀 아이템 하나를 이 캐릭터의 held 인스턴스로 전환하고, 그 인스턴스를 반환.
async function equipFromWarehouse(poolItem) {
  const raw = poolItem._raw;
  if ((raw.quantity || 0) <= 1) {
    const { data: updated, error } = await window.sbClient
      .from("warehouse_items")
      .update({ held_by: charId })
      .eq("id", raw.id)
      .select()
      .single();
    if (error) { reportError("장착", error); return null; }
    return mapItemRow(updated);
  }
  const { error: decError } = await window.sbClient
    .from("warehouse_items")
    .update({ quantity: raw.quantity - 1 })
    .eq("id", raw.id);
  if (decError) { reportError("장착(재고 차감)", decError); return null; }
  const { data: inserted, error: insError } = await window.sbClient
    .from("warehouse_items")
    .insert(buildHeldInsertPayload(raw))
    .select()
    .single();
  if (insError) { reportError("장착(개체 생성)", insError); return null; }
  return mapItemRow(inserted);
}

// held 인스턴스를 창고 풀로 되돌림. enhanceLevel/craftMaterial까지 같이 봐야 함 —
// 강화된 장비(예: 대검+10)나 소재가 다른 개조품은 기본형과 스펙이 다른 별개
// 아이템이라 절대 같이 뭉치면 안 됨.
async function returnToWarehousePool(item) {
  if (!item || !item.id) return;
  let query = window.sbClient
    .from("warehouse_items")
    .select("*")
    .eq("user_id", session.user.id)
    .is("held_by", null)
    .eq("name", item.name)
    .eq("category", item.category);
  query = item.enhanceLevel == null ? query.is("enhance_level", null) : query.eq("enhance_level", item.enhanceLevel);
  query = item.craftMaterial == null ? query.is("craft_material", null) : query.eq("craft_material", item.craftMaterial);
  const { data: poolRow, error } = await query.limit(1).maybeSingle();
  if (error) { reportError("해제(풀 조회)", error); return; }

  if (poolRow) {
    const { error: incError } = await window.sbClient
      .from("warehouse_items")
      .update({ quantity: (poolRow.quantity || 0) + 1 })
      .eq("id", poolRow.id);
    if (incError) { reportError("해제(재고 병합)", incError); return; }
    const { error: delError } = await window.sbClient
      .from("warehouse_items")
      .delete()
      .eq("id", item.id);
    if (delError) { reportError("해제(개체 삭제)", delError); return; }
  } else {
    const { error: relError } = await window.sbClient
      .from("warehouse_items")
      .update({ held_by: null })
      .eq("id", item.id);
    if (relError) { reportError("해제", relError); return; }
  }
}

// 창고 풀(장비 카테고리) 갱신 — 장착/해제 직후 목록을 다시 읽어옴.
async function refreshEquipPool() {
  const { data: rows, error } = await window.sbClient
    .from("warehouse_items")
    .select("*")
    .eq("user_id", session.user.id)
    .is("held_by", null)
    .eq("category", "equipment");
  if (error) { reportError("창고 조회", error); return; }
  equipPool = (rows || []).map(mapItemRow);
}
// ============================================================================
// 양손무기(twoHanded) 예외 규칙 저장소 — 원칙은 "mainhand에 양손무기가 장착돼
// 있으면 subhand엔 아무것도 못 낌"이지만, 여기 등록된 {mainhand, subhand}
// 이름 조합만 예외로 함께 장착을 허용함. 새 예외가 필요해지면(예: 활+화살통처럼
// mainhand가 양손 취급이면서도 특정 subhand와는 같이 쓰는 무기 종류가 생기면)
// 이 배열에 한 줄만 추가하면 됨 — 다른 코드는 안 건드려도 됨.
// ============================================================================
const TWO_HANDED_EXCEPTIONS = [
  { mainhand: "활", subhand: "화살통" },
  // 새 예외 예시: { mainhand: "석궁", subhand: "볼트 주머니" }
];
function isTwoHandedExceptionAllowed(mainhandName, subhandName) {
  return TWO_HANDED_EXCEPTIONS.some((ex) => ex.mainhand === mainhandName && ex.subhand === subhandName);
}

// ============================================================================
// 직업별 착용 가능 equipmentType 목록 — job→허용 타입 목록(다대다) 방향.
// 여기 항목이 아예 없는 직업은 제한 없음(모든 타입 착용 가능)으로 취급함 —
// 안 그러면 아직 등록 안 된 다른 모든 직업이 장비를 하나도 못 끼는 상태가
// 돼버림(직업 테이블은 필요할 때마다 하나씩 채워나가는 방식이라). 이제
// game_content(key='jobTable')의 allowedEquipmentTypes에서 읽어옴.
// ============================================================================
let JOB_ALLOWED_EQUIPMENT_TYPES = {};

function isItemEquippableBy(item, job, currentEquipment) {
  if (item.requiredJob && !isJobOrDescendantOf(job, item.requiredJob)) {
    return { ok: false, reason: `"${item.requiredJob}" 계열 전용 (현재 직업: ${job})` };
  }
  // 이 슬롯이 equipmentType 제한 대상이고, 이 직업에 허용 목록이 등록돼
  // 있으면 그 목록에 있는 타입만 착용 가능.
  const slotMeta = EQUIPMENT_SLOT_TYPES[item.slot];
  if (slotMeta && slotMeta.needsEquipmentType && item.equipmentType) {
    const allowed = JOB_ALLOWED_EQUIPMENT_TYPES[job];
    if (allowed && !allowed.includes(item.equipmentType)) {
      return { ok: false, reason: `"${item.equipmentType}" 타입은 "${job}" 착용 불가` };
    }
  }
  // subhand에 뭔가 장착하려는데, 지금 mainhand가 양손무기고 예외 조합도
  // 아니면 불가 — mainhand를 양손무기로 새로 장착하는 쪽(반대 방향)은 여기가
  // 아니라 장착 처리 함수에서 subhand를 자동 해제하는 식으로 따로 처리함.
  if (item.slot === "subhand" && currentEquipment) {
    const mh = currentEquipment.mainhand;
    if (mh && mh.twoHanded && !isTwoHandedExceptionAllowed(mh.name, item.name)) {
      return { ok: false, reason: `"${mh.name}"은(는) 양손무기라 Subhand 장착 불가` };
    }
  }

  // 무게(handle) 제한 — 초과하면 아예 장착 불가. 예전엔 "초과 시 행동속도
  // 페널티"라는 UI 문구만 있었고 실제 페널티는 구현된 적이 없었는데,
  // "수용치를 못 맞추면 장착 승인 자체가 안 된다"는 규칙으로 확정함.
  // 이 슬롯에 이미 뭔가 끼고 있으면 교체이므로 그 무게는 빼고 계산함.
  if (currentEquipment) {
    const capacity = computeWeightCapacity();
    const replacing = currentEquipment[item.slot];
    const projected = computeWeightUsed() - (replacing?.weight || 0) + (item.weight || 0);
    if (projected > capacity) {
      return { ok: false, reason: `무게 초과 (${projected}/${capacity}) — 이 장비를 들 수 없음` };
    }
  }

  return { ok: true };
}

// ============================================================================
// 아이템 시리즈(세트) 테이블 — 같은 setId 장비를 몇 개 장착했는지에 따라 문턱값
// (thresholds)마다 추가 보너스가 붙음. 아이템 하나의 속성이 아니라 "장착 조합"에
// 대한 규칙이라 개별 아이템 데이터(상점/창고)와는 별개로 관리함.
// ============================================================================
const ITEM_SET_TABLE = {
  sage_series: {
    name: "현자의 시리즈",
    thresholds: [
      { count: 2, statBonus: { int: 5 }, description: "INT +5" },
      { count: 4, combatReal: { matk: 6 }, patternSlotBonus: 1, description: "realMATK +6, 패턴 슬롯 +1" }
    ]
  },
  // 왕관 조각을 소재로 넣어 제작/개조한 장비에 자동으로 붙는 세트.
  // 소재 하나로 세트가 결정되므로, 여러 부위를 왕관 조각으로 맞추면
  // 자연스럽게 세트가 완성됨 — 다만 왕관 조각은 왕/섭정에게서만 나오고
  // 부위마다 무게 +1이 붙어서, 전부 맞추려면 DEX 투자가 필요함.
  goblin_crown_series: {
    name: "고블린 왕관 시리즈",
    thresholds: [
      { count: 2, combatReal: { atk: 4, matk: 4 }, description: "realATK +4, realMATK +4" },
      { count: 3, maxHpBonus: 150, description: "MaxHP +150" },
      // 세트 완성 보상 — 잡졸(normal)과 소환체(creature)에게 받는 피해 15% 감소.
      // 소환된 개체는 creatureTier가 creature로 강제 변환되므로, 둘 다 넣어야
      // "잡졸은 함부로 덤비지 못한다"가 실제로 성립함(마차가 뱉는 물량이
      // 정확히 creature라, normal만 걸면 정작 수송대에서 안 통했음).
      { count: 4, statBonus: { str: 4, int: 4 }, patternSlotBonus: 1,
        passiveBonus: {
          damageTakenFrom_normalPct: 10, damageTakenFrom_creaturePct: 10,
          damageDealtTo_normalPct: 10, damageDealtTo_creaturePct: 10,
        },
        description: "STR +4, INT +4, 패턴 슬롯 +1, 일반·소환체에게 주는 피해 +10% / 받는 피해 -10%" }
    ]
  }
  // 새 세트 예시: knight_series: { name:"기사단 시리즈", thresholds:[{count:2, combatReal:{def:5}, description:"realDEF +5"}] }
};

function getSetBonusesForEquipped() {
  const counts = {};
  equippedItems().forEach((it) => {
    if (!it.setId) return;
    counts[it.setId] = (counts[it.setId] || 0) + 1;
  });

  const active = [];
  Object.entries(counts).forEach(([setId, count]) => {
    const set = ITEM_SET_TABLE[setId];
    if (!set) return;
    set.thresholds.forEach((tier) => {
      if (count >= tier.count) active.push({ setId, setName: set.name, ...tier });
    });
  });
  return active;
}

// 장비 무게/스탯 보너스는 더 이상 캐릭터 객체에 고정된 숫자로 저장하지 않고,
// 실제로 장착 중인 아이템(+ 세트 보너스)에서 매번 계산함(장착/해제 즉시 반영).
// 아이템 자체는 마스터 테이블 없이(상점/창고 각자의 데이터로) 흘러들어옴 —
// character.js의 combatReal/combatBonus/statBonus 등 필드를 그대로 씀.
function equippedItems() {
  return Object.values(data.equipment).filter(Boolean);
}
function computeWeightUsed() {
  return equippedItems().reduce((sum, it) => sum + (it.weight || 0), 0);
}
function computeBonusStats() {
  const bonus = { str:0, int:0, dex:0, spd:0, luk:0 };
  equippedItems().forEach((it) => {
    if (it.statBonus) STAT_META.forEach((m) => { bonus[m.key] += it.statBonus[m.key] || 0; });
  });
  getSetBonusesForEquipped().forEach((tier) => {
    if (tier.statBonus) STAT_META.forEach((m) => { bonus[m.key] += tier.statBonus[m.key] || 0; });
  });
  return bonus;
}
// 장비가 주는 "real형" 스탯 보너스 — statBonus(bonus형)와 별개. real형은 캐릭터의
// 잠재치 자체를 올려서 Max HP/SP·패턴 슬롯·무게 제한의 "기본치" 계산에도 반영됨.
// 아이템 하나가 real형/bonus형을 동시에 줄 수도 있음(예: 잠재력도 올리고 즉시
// 성능도 올리는 장비).
function computeEquipmentRealStatBonus() {
  const bonus = { str:0, int:0, dex:0, spd:0, luk:0 };
  equippedItems().forEach((it) => {
    if (it.statRealBonus) STAT_META.forEach((m) => { bonus[m.key] += it.statRealBonus[m.key] || 0; });
  });
  getSetBonusesForEquipped().forEach((tier) => {
    if (tier.statRealBonus) STAT_META.forEach((m) => { bonus[m.key] += tier.statRealBonus[m.key] || 0; });
  });
  return bonus;
}
// 투자한 real 스탯(data.realStats) + 장비의 real형 보너스를 합친 "결합 real".
// Max HP/SP, 패턴 슬롯, 무게 제한의 기본치는 전부 이 결합 real을 기준으로 계산됨
// — bonus형 스탯(장비의 statBonus, 전투 중 버프)은 여기 안 들어감(잠재치 자체를
// 안 올리고 당장의 성능만 끌어올리는 성격이라서).
function computeCombinedRealStats() {
  const equipReal = computeEquipmentRealStatBonus();
  const combined = {};
  STAT_META.forEach((m) => { combined[m.key] = data.realStats[m.key] + equipReal[m.key]; });
  return combined;
}
function computeMaxHp() {
  return JOB_BASE_HP + Math.floor(computeCombinedRealStats().str * 20);
}
function computeMaxSp() {
  return JOB_BASE_SP + Math.floor(computeCombinedRealStats().int * 10);
}
// 크리티컬 — src/character.js의 critRate/critMultiplier 게터와 반드시 같은
// 공식이어야 함(시트 표시값과 실제 전투값이 어긋나면 안 되므로).
//   확률 = min(100, realLUK×0.5 + 장비/패시브 critChancePct 합산)
//   배율 = max(1.5, 장비/패시브 critMultiplier 중 최댓값)  ← 합산 아님
function computeCritStats() {
  const items = equippedItems();
  const passives = learnedSkillObjs().filter(s => s.passive);
  const chanceSum =
    items.reduce((sum, it) => sum + (it.passiveBonus?.critChancePct || 0), 0) +
    passives.reduce((sum, s) => sum + (s.passiveMods?.critChancePct || 0), 0);
  const multiplier = Math.max(
    1.5,
    ...items.map(it => it.critMultiplier || 0),
    ...passives.map(s => s.critMultiplier || 0)
  );
  return {
    rate: Math.min(100, computeCombinedRealStats().luk * 0.5 + chanceSum),
    multiplier,
  };
}

function computeMaxPatternSlots() {
  const base = 1 + Math.floor(computeCombinedRealStats().int / 10);
  const itemBonus = equippedItems().reduce((sum, it) => sum + (it.patternSlotBonus || 0), 0);
  const setBonus = getSetBonusesForEquipped().reduce((sum, t) => sum + (t.patternSlotBonus || 0), 0);
  const passiveBonus = learnedSkillObjs().filter(s => s.passive).reduce((sum, s) => sum + (s.patternSlotBonus || 0), 0);
  return base + itemBonus + setBonus + passiveBonus;
}
function computeWeightCapacity() {
  const base = 5 + Math.floor(computeCombinedRealStats().dex / 5); // src/character.js의 weightCapacity와 동일 공식
  // handle(무게)은 순수 코스트 — 장비가 용량을 "늘려주는" 개념은 없앰.
  // 예전엔 handleReduction이라는 필드가 용량을 더해줘서, 무거운 장비를 낄수록
  // 오히려 용량이 늘어나 무게 제한이 아무 의미가 없었음. weight(소모) 하나로 통일.
  // 용량을 늘려주는 효과가 필요하면 그건 별도 옵션으로 다루기로 함.
  const itemBonus = 0;
  const setBonus = 0;
  return base + itemBonus + setBonus;
}

// 전투 스탯(공격력/방어력/마법공격력/마법방어력) — STR/INT 등 실제 스탯과 완전히
// 무관하게, 오직 착용 중인 장비(+ 세트 보너스)의 combatReal 합산이 real이 됨.
// 기본 real은 0(맨몸이면 다 0)이라 STAT_META 같은 "기본치+투자" 개념이 없음 —
// 스탯 포인트로 못 올리고 오직 장비로만 바뀜.
function computeRealCombatStats() {
  const real = { atk:0, def:0, matk:0, mdef:0 };
  equippedItems().forEach((it) => {
    if (it.combatReal) {
      real.atk += it.combatReal.atk || 0;
      real.def += it.combatReal.def || 0;
      real.matk += it.combatReal.matk || 0;
      real.mdef += it.combatReal.mdef || 0;
    }
  });
  getSetBonusesForEquipped().forEach((tier) => {
    if (tier.combatReal) {
      real.atk += tier.combatReal.atk || 0;
      real.def += tier.combatReal.def || 0;
      real.matk += tier.combatReal.matk || 0;
      real.mdef += tier.combatReal.mdef || 0;
    }
  });
  return real;
}
// 장비가 주는 combatBonus(버프 취급 수치) 합산 — 실제 전투 중 버프와는 별개로,
// 장비 자체가 항상 주는 값이라 Sheet(전투 밖)에서도 그대로 보여야 함. 실제
// 전투에선 여기에 전투 중 버프가 "더" 얹혀서 계속 변할 수 있지만, Sheet는
// 정적 조회라 장비발 몫만 보여줌.
function computeEquipmentBonusCombatStats() {
  const bonus = { atk:0, def:0, matk:0, mdef:0 };
  equippedItems().forEach((it) => {
    if (it.combatBonus) {
      bonus.atk += it.combatBonus.atk || 0;
      bonus.def += it.combatBonus.def || 0;
      bonus.matk += it.combatBonus.matk || 0;
      bonus.mdef += it.combatBonus.mdef || 0;
    }
  });
  return bonus;
}
function computeCombatStats() {
  const real = computeRealCombatStats();
  const bonus = computeEquipmentBonusCombatStats();
  return {
    real,
    bonus,
    effective: {
      atk: calcEffective(real.atk, bonus.atk),
      def: calcEffective(real.def, bonus.def),
      matk: calcEffective(real.matk, bonus.matk),
      mdef: calcEffective(real.mdef, bonus.mdef),
    },
  };
}

  // 페이지의 기존 렌더 방식 그대로) innerHTML 교체 직후 포커스/커서 위치가
  // 풀려버림. 새로 그려진 input을 즉시 다시 찾아 focus+커서 위치를
  // 복원해서, 타이핑 중간에 포커스가 빠지는 것처럼 보이지 않게 함.
  const filterInput = el.querySelector("#equipFilterInput");
  if (filterInput) filterInput.addEventListener("input", (e) => {
    equipFilterQuery = e.target.value;
    const cursorPos = e.target.selectionStart;
    renderStatSection();
    const newInput = document.getElementById("equipFilterInput");
    if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
  });

  // 장착: 창고 풀에서 개체를 하나 꺼내 이 캐릭터 전용(heldBy)으로 전환하고,
  // 그 슬롯에 이미 있던 장비는 다시 풀로 돌려보냄. 관전 모드(남의 캐릭터)면
  // 창고를 건드릴 수 없게 맨 위에서 막음 — 안 그러면 실제로 소유하지도 않을
  // 캐릭터에게 창고 아이템이 잘못 배정되는 구멍이 생김.
  el.querySelectorAll(".equip-btn").forEach(btn => btn.addEventListener("click", async (e) => {
    if (!isOwner) return;
    const idx = Number(e.target.closest(".inv-item").dataset.idx);
    const poolItem = equipPool[idx];
    if (!poolItem) return;
    const eligibility = isItemEquippableBy(poolItem, data.job, data.equipment);
    if (!eligibility.ok) return; // 버튼이 disabled라 보통 여기 안 옴 — 방어적 처리

    const prev = data.equipment[poolItem.slot];
    const heldInstance = await equipFromWarehouse(poolItem);
    if (!heldInstance) return;
    if (prev) await returnToWarehousePool(prev);
    data.equipment[poolItem.slot] = heldInstance;

    // mainhand에 "새로" 양손무기를 장착하는 경우 — 예외 조합이 아니면 subhand를
    // 강제로 해제함("장착 요청이 들어왔을 때 강제로 장착 해제됨" 규칙).
    if (poolItem.slot === "mainhand" && poolItem.twoHanded) {
      const sub = data.equipment.subhand;
      if (sub && !isTwoHandedExceptionAllowed(poolItem.name, sub.name)) {
        data.equipment.subhand = null;
        await returnToWarehousePool(sub);
      }
    }

    // 예전엔 여기서 saveSection("equipment")를 불러 character.equipment를 즉시
    // 커밋했음(창고엔 반영됐는데 캐릭터엔 저장 안 되는 불일치 방지). 이제
    // warehouse_items.held_by가 유일한 진실 공급원이라 위 DB 갱신 자체가 곧
    // 확정이고, 애초에 동기화할 미러 필드가 없어서 호출이 불필요해짐.
    await refreshEquipPool();
    renderStatSection();
  }));

  // 해제: 슬롯을 비우고 창고 풀로 되돌림(해제하는 즉시 다른 캐릭터도 다시
  // 가져갈 수 있는 공용 재고가 됨 — 캐릭터가 아이템을 독점하지 않음).
  el.querySelectorAll(".unequip-x").forEach(btn => btn.addEventListener("click", async (e) => {
    if (!isOwner) return;
    const type = e.target.closest(".equip-slot").dataset.type;
    const item = data.equipment[type];
    if (!item) return;
    data.equipment[type] = null;
    await returnToWarehousePool(item);
    await refreshEquipPool();
    renderStatSection();
  }));

  // devGrantWeaponBtn / devGrantSetPieceBtn / devGrantJItemBtn / devGrantSkillSealBtn은
  // ITEM_TABLE(마스터 테이블) 제거에 맞춰 일시 비활성화함(버튼 자체는 disabled).
  // 나중에 각자 필요한 아이템 데이터를 직접 들고 있는 형태로 갱신할 예정.
  const arrowsBtn = document.getElementById("devGrantArrowsBtn");
  if (arrowsBtn) arrowsBtn.addEventListener("click", () => {
    data.personalResources.arrows = { current: 20, max: 20 };
    markDirty("equipment"); renderStatSection();
  });

  bindSkillEvents();
}

// ============================================================================
// 패턴 빌더 (오른쪽, 핵심 기능)
// ============================================================================
// job이 어떤 전직 경로를 거쳐 지금 직업에 도달했는지 — isJobOrDescendantOf와
// 반대 방향 탐색(그건 "job이 ancestorJob의 하위인가"만 판정하지 실제 경로
// 목록은 안 만들어줌). JOB_ADVANCEMENT_TABLE을 훑어서 toJob이 target인
// 항목의 키(=한 단계 전 직업)를 찾고 재귀적으로 더 거슬러 올라감.
// 2026-08-15: 전직하면 하위 직업 스킬을 영영 못 배우던 버그를 고치며 추가
// (아래 jobSkillTable() 참조) — 실측으로 확인: 비숍(전직 후) 자체 스킬은
// 3개뿐인데 사제(기본) 스킬은 20개라, 전직 직전에 다 못 배운 사제 스킬
// 17개가 전직하는 순간 습득 불가능해지고 있었음.
function jobAncestryChain(job) {
  const chain = [job];
  Object.entries(JOB_ADVANCEMENT_TABLE).forEach(([fromJob, advs]) => {
    if ((advs || []).some((adv) => adv.toJob === job)) {
      jobAncestryChain(fromJob).forEach((j) => { if (!chain.includes(j)) chain.push(j); });
    }
  });
  return chain;
}
// 지금 직업 + 그 직업에 도달하기까지 거쳐온 모든 하위 직업의 스킬을 전부
// 합쳐서 돌려줌 — 전직해도 이전 단계에서 못 배운 스킬을 계속 배울 수 있어야
// 하므로. 같은 이름의 스킬이 여러 단계에 중복 정의돼 있으면 한 번만 포함.
function jobSkillTable() {
  const seen = new Set();
  const skills = [...COMMON_SKILLS];
  jobAncestryChain(data.job).forEach((job) => {
    (SKILL_TABLE[job] || []).forEach((s) => {
      if (seen.has(s.name)) return;
      seen.add(s.name);
      skills.push(s);
    });
  });
  return skills;
}
function formatCosts(costs) {
  return costs.map(c => {
    if (c.type === "teamResource") {
      const meta = TEAM_RESOURCE_TYPES[c.resource];
      return `${meta ? `${meta.icon} ${meta.label}` : `팀 자원(${c.resource || "?"})`} ${c.amount}`;
    }
    if (c.type === "personalResource") {
      const meta = PERSONAL_RESOURCE_TYPES[c.resource];
      return `${meta ? `${meta.icon} ${meta.label}` : `개인 자원(${c.resource || "?"})`} ${c.amount}`;
    }
    return `${COST_TYPES[c.type].label} ${c.amount}`;
  }).join(" · ");
}
function formatDelay(s) {
  if (s.preDelay === undefined && s.postDelay === undefined) return "";
  // 예전엔 "선제:후속 0(행위) : 10"처럼 풀어 썼는데, 한 줄 스펙 표기(칩 나열)로
  // 바꾸면서 "(0:10)" 압축형으로 통일 — preDelayType은 툴팁으로만 남김.
  const preTypeLabel = s.preDelayType && PRE_DELAY_TYPES[s.preDelayType] ? PRE_DELAY_TYPES[s.preDelayType].label : "";
  const pre = s.preDelay !== undefined ? `${s.preDelay}` : "?";
  const post = s.postDelay !== undefined ? `${s.postDelay}` : "?";
  return `<span title="선딜레이 유형: ${preTypeLabel || "?"}">(${pre}:${post})</span>`;
}
function formatTarget(s) {
  if (!s.targetFaction && !s.targetCount) return "";
  const faction = s.targetFaction && TARGET_FACTION_TYPES[s.targetFaction] ? TARGET_FACTION_TYPES[s.targetFaction].label : "?";
  const count = s.targetCount && TARGET_COUNT_TYPES[s.targetCount] ? TARGET_COUNT_TYPES[s.targetCount].label : "?";
  return `${faction} · ${count}`;
}
// 스킬명 뒤에 붙은 "(직업명)" 접미사(예: "MagicCircle (Druid)")는 데이터상
// 이름 충돌 회피용일 뿐이라 플레이어에게 보일 필요가 없음 — 화면 표시에서만
// 잘라냄(실제 skill.name/learnedSkillNames/pattern.action 등 내부 값은
// 그대로 둬서 저장·조회 로직에 영향 없음). 화이트리스트 방식으로만 지움 —
// "Eagle Eye (Passive)"/"(Active)"나 "Elemental Shield(Red)"처럼 괄호가
// 실제로 서로 다른 스킬을 구분하는 의미일 때는 절대 지우면 안 되므로,
// "무조건 끝 괄호 제거" 대신 알려진 직업 소속 표시 접미사만 정확히 매칭.
const JOB_DISAMBIGUATION_SUFFIXES = [" (Priest)", " (Druid)", " (WH)"];
function displaySkillName(name) {
  if (!name) return name;
  if (name.startsWith("Job Master:")) return name;
  const suffix = JOB_DISAMBIGUATION_SUFFIXES.find((sfx) => name.endsWith(sfx));
  return suffix ? name.slice(0, -suffix.length) : name;
}
// 습득한 스킬 / 습득 가능 스킬 카드 렌더링(공용). learnBtnState가 있으면 "배우기"
// 버튼을 붙임(습득 가능 목록용), 없으면 순수 조회용(습득한 스킬 목록용).
// 스킬 한 장의 스펙을 "Break Down / 5pt / enemy - individual / 35sp /
// 570%x1 / Physical / Atk-30% / Def-30% / (0:10)" 식 한 줄(요소별로 칩
// 하나씩, flex-wrap으로 감싸는) 표기로 압축 — 예전엔 대상/스탯·계수/코스트가
// 각각 별도 줄로 세로로 쌓여서 좁은 칼럼에서 낭비가 컸음(사용자 피드백).
// 요소 순서: pt · 대상 · 코스트 · 계수×히트 · 유형 · 이펙트들 · 선딜:후딜.
function renderSkillCard(s, { learnBtnState } = {}) {
  const invalidBadge = s.invalid ? `<span class="sk-chip invalid" title="상대의 아군 보호(전열) 규칙을 무시함">차단 불가</span>` : "";
  const target = formatTarget(s);
  const delay = formatDelay(s);
  const costLabel = s.costs && s.costs.length ? formatCosts(s.costs) : "코스트 없음";
  // 힐/버프 등 스탯×계수 공식이 아예 적용 안 되는 스킬은 stat/coefficient
  // 필드 자체가 없음(예: Healing의 scaledHeal 효과) — 전체 스킬의 약 26%가
  // 이 경우라 "undefined%x1" 같은 깨진 표시를 막으려면 칩 자체를 생략해야 함.
  const powerChip = s.stat !== undefined
    ? `<span class="sk-chip">${Math.round(s.coefficient * 100)}%×${s.hits || 1}</span>` : "";
  const typeChip = s.skillType && SKILL_TYPES[s.skillType]
    ? `<span class="sk-chip ${SKILL_TYPES[s.skillType].cls}">${SKILL_TYPES[s.skillType].label}</span>` : "";
  const effectChips = (s.effects || []).map(e => {
    const meta = EFFECT_TYPES[e.type];
    if (!meta) return "";
    const unit = meta.valueUnit || "";
    const valueLabel = e.value !== undefined ? ` ${e.value > 0 ? "+" : ""}${e.value}${unit}` : "";
    const resourceMeta = e.resource ? (TEAM_RESOURCE_TYPES[e.resource] || PERSONAL_RESOURCE_TYPES[e.resource]) : null;
    const resourceLabel = resourceMeta ? `(${resourceMeta.icon} ${resourceMeta.label})` : "";
    // guard는 팀/개인 자원 효과가 resource로 종류를 구분하는 것과 같은 방식으로
    // guardType 하위 필드로 물리/마법/전체를 구분함(생략 시 전체로 취급).
    const guardTypeLabel = e.type === "guard"
      ? `(${e.guardType === "physical" ? "물리" : e.guardType === "magic" ? "마법" : "전체"})`
      : "";
    return `<span class="sk-chip sk-effect ${meta.polarity || "neutral"}">${meta.label}${resourceLabel}${guardTypeLabel}${valueLabel}</span>`;
  }).join("");

  const chips = [
    `<span class="sk-chip">${s.skillPointCost}pt</span>`,
    target ? `<span class="sk-chip">${target}</span>` : "",
    `<span class="sk-chip">${costLabel}</span>`,
    powerChip,
    typeChip,
    invalidBadge,
    effectChips,
    delay ? `<span class="sk-chip">${delay}</span>` : "",
  ].filter(Boolean).join("");

  return `
    <div class="skill-item skill-card" ${learnBtnState ? `data-skill="${s.name}"` : ""}>
      <div class="sk-head">
        <span class="sk-name">${displaySkillName(s.name)}${learnBtnState ? ` <span class="sk-meta">Lv.${s.requiredLevel}</span>` : ""}</span>
      </div>
      <div class="sk-spec-line">${chips}</div>
      ${learnBtnState ? `<div class="sk-footer"><button class="assign-btn learn-btn" ${learnBtnState.disabled ? "disabled" : ""}>포인트 ${s.skillPointCost} · 배우기</button></div>` : ""}
    </div>
  `;
}
function learnedSkillObjs() {
  return jobSkillTable().filter(s => data.learnedSkillNames.includes(s.name));
}
// 선행 스킬 조건 — s.requiredSkills(배열)가 있으면 그중 최소 한 개(mode:"any",
// 기본값) 또는 전부(mode:"all")를 이미 배웠어야 함. requiredSkills가 없거나
// 빈 배열이면 조건 자체가 없는 것으로 취급(true). 레벨 조건(requiredLevel)과는
// 완전히 별개 — 둘 다 만족해야 배울 수 있음.
function meetsSkillPrereq(skill) {
  if (!skill.requiredSkills || skill.requiredSkills.length === 0) return true;
  const mode = skill.requiredSkillMode === "all" ? "all" : "any";
  return mode === "all"
    ? skill.requiredSkills.every(name => data.learnedSkillNames.includes(name))
    : skill.requiredSkills.some(name => data.learnedSkillNames.includes(name));
}
// 상호배타(택일) — s.excludesSkills(배열)에 있는 스킬 중 하나라도 이미
// 배웠으면 이 스킬은 배울 수 없음. requiredSkills("배웠어야 함")와 정반대
// 방향. ⚠ 판정 자체는 "이 스킬" 쪽 excludesSkills만 보므로, 진짜 상호배타로
// 만들려면 A/B 양쪽 스킬 데이터에 각각 서로를 excludesSkills로 적어둬야 함
// (한쪽에만 적으면 어느 걸 먼저 배우느냐에 따라 막히는 방향이 달라지는
// 비대칭 버그가 생김).
function violatesExclusion(skill) {
  if (!skill.excludesSkills || skill.excludesSkills.length === 0) return false;
  return skill.excludesSkills.some(name => data.learnedSkillNames.includes(name));
}
function learnableSkillObjs() {
  return jobSkillTable().filter(s => s.requiredLevel <= data.level && !data.learnedSkillNames.includes(s.name));
}
// SkillSeal 장비가 부여하는 스킬 — SKILL_TABLE 습득 여부와 무관하게 장착 중엔 씀.
// 자기 직업 스킬이 아닐 수도 있어서 jobSkillTable()이 아니라 전체에서 찾음.
function equipmentGrantedSkillObjs() {
  const seal = data.equipment.skillSeal;
  if (!seal || !seal.grantsSkill) return [];
  return allSkillsFlat().filter(s => s.name === seal.grantsSkill);
}
function actionOptionsFor() {
  const names = new Set([
    ...ACTION_OPTIONS,
    ...learnedSkillObjs().map(s => s.name),
    ...equipmentGrantedSkillObjs().map(s => s.name),
  ]);
  if (data.equipment.uItem) names.add("아이템 사용"); // U.Item 장착 중일 때만 후보로 노출
  return [...names];
}

function renderPatternSection() {
  const el = document.getElementById("patternSection");
  const preset = data.presets[activePresetIdx];
  const maxPatternSlots = computeMaxPatternSlots();
  el.innerHTML = `
    <div class="block">
      <h2 class="section-title">패턴 프리셋 <span class="hint">조건 → 행동을 자유롭게 설계</span></h2>
      <div class="preset-tabs" id="presetTabs">
        ${data.presets.map((p, i) => `<button class="preset-tab ${i===activePresetIdx?"active":""}" data-i="${i}">${p.name}</button>`).join("")}
        <button class="preset-tab add" id="addPresetBtn">+ 새 프리셋</button>
      </div>
      <div class="pattern-list" id="patternList">
        ${preset.rows.map((row, i) => buildRowHTML(row, i, i < maxPatternSlots)).join("")}
      </div>
      <button class="add-row-btn" id="addRowBtn">+ 패턴 줄 추가</button>
      ${renderSectionSaveButton("pattern")}
    </div>
  `;

  bindPatternEvents();
}

function bindSkillEvents() {
  document.querySelectorAll(".learn-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const skillName = e.target.closest(".skill-item").dataset.skill;
      const skill = jobSkillTable().find(s => s.name === skillName);
      if (!skill || computeSkillPoints(data) < skill.skillPointCost) return;
      if (!meetsSkillPrereq(skill)) return; // UI가 어긋나도 여기서 한 번 더 막음
      if (violatesExclusion(skill)) return; // 상호배타도 동일하게 안전장치
      data.learnedSkillNames.push(skillName);
      markDirty("skill");
      renderStatSection();   // 습득한/습득 가능 스킬 목록 · 스킬 포인트가 여기 있음
      renderPatternSection(); // 새로 배운 스킬이 THEN 드롭다운 후보에 추가되도록
    });
  });
}

function bindPatternEvents() {
  const preset = data.presets[activePresetIdx];

  document.querySelectorAll(".preset-tab[data-i]").forEach(tab => {
    tab.addEventListener("click", () => { activePresetIdx = Number(tab.dataset.i); renderPatternSection(); });
  });
  document.getElementById("addPresetBtn").addEventListener("click", () => {
    const name = prompt("새 프리셋 이름을 입력하세요", "새 프리셋");
    if (!name) return;
    data.presets.push({ name, rows:[ {subject:"self", metric:"always", action:"공격"} ] });
    activePresetIdx = data.presets.length - 1;
    markDirty("pattern"); renderPatternSection();
  });
  document.getElementById("addRowBtn").addEventListener("click", () => {
    preset.rows.push({ subject:"self", metric:"always", action:"공격" });
    markDirty("pattern"); renderPatternSection();
  });

  document.querySelectorAll(".pattern-row").forEach(rowEl => {
    const idx = Number(rowEl.dataset.idx);
    const row = preset.rows[idx];

    rowEl.querySelector(".remove-row").addEventListener("click", () => {
      preset.rows.splice(idx, 1); markDirty("pattern"); renderPatternSection();
    });
    rowEl.querySelector(".move-up").addEventListener("click", () => {
      if (idx === 0) return;
      [preset.rows[idx-1], preset.rows[idx]] = [preset.rows[idx], preset.rows[idx-1]];
      markDirty("pattern"); renderPatternSection();
    });
    rowEl.querySelector(".move-down").addEventListener("click", () => {
      if (idx === preset.rows.length - 1) return;
      [preset.rows[idx+1], preset.rows[idx]] = [preset.rows[idx], preset.rows[idx+1]];
      markDirty("pattern"); renderPatternSection();
    });
    rowEl.querySelector(".cb-subject").addEventListener("change", e => { row.subject = e.target.value; markDirty("pattern"); updateSectionSaveIndicator("pattern"); });
    rowEl.querySelector(".cb-metric").addEventListener("change", e => {
      row.metric = e.target.value;
      const type = CONDITION_TYPES[row.metric];
      if (type.needsDetail) {
        row.comparator = row.comparator || "gte";
        row.value = row.value ?? 0;
        row.unit = row.unit || type.unit;
      }
      markDirty("pattern");
      renderPatternSection(); // 조건 종류별 상세 입력칸 표시 여부가 다르므로 재렌더
    });
    const cmp = rowEl.querySelector(".cb-comparator");
    if (cmp) cmp.addEventListener("change", e => { row.comparator = e.target.value; markDirty("pattern"); updateSectionSaveIndicator("pattern"); });
    const val = rowEl.querySelector(".cb-value");
    if (val) val.addEventListener("input", e => { row.value = Number(e.target.value); markDirty("pattern"); updateSectionSaveIndicator("pattern"); });
    const unit = rowEl.querySelector(".cb-unit");
    if (unit) unit.addEventListener("change", e => { row.unit = e.target.value; markDirty("pattern"); updateSectionSaveIndicator("pattern"); });
    rowEl.querySelector(".cb-action").addEventListener("change", e => { row.action = e.target.value; markDirty("pattern"); updateSectionSaveIndicator("pattern"); });
    rowEl.querySelector(".cb-and-next").addEventListener("change", e => {
      row.andNext = e.target.checked;
      markDirty("pattern");
      renderPatternSection(); // THEN/최대발동횟수 표시 여부가 바뀌므로 재렌더
    });
    rowEl.querySelector(".cb-max-uses-toggle").addEventListener("change", e => {
      row.maxUses = e.target.checked ? (row.maxUses ?? 1) : null;
      markDirty("pattern");
      renderPatternSection(); // 입력칸 표시 여부가 바뀌므로 재렌더
    });
    const maxUsesInput = rowEl.querySelector(".cb-max-uses");
    if (maxUsesInput) maxUsesInput.addEventListener("input", e => {
      row.maxUses = Math.max(1, Number(e.target.value) || 1);
      markDirty("pattern"); updateSectionSaveIndicator("pattern");
    });
  });
}

// 텍스트/숫자 입력처럼 매 키 입력마다 전체 재렌더를 하면 포커스를 잃어버리는
// 곳에서 씀 — 전체를 다시 그리지 않고 그 섹션의 저장 버튼/표시만 살짝 갱신.
function updateSectionSaveIndicator(section) {
  const btn = document.querySelector(`[data-save-section="${section}"]`);
  if (!btn) return;
  const isDirty = dirtyFlags[section];
  btn.disabled = !isDirty;
  const flag = btn.parentElement.querySelector(".section-save-flag");
  if (flag) {
    flag.className = "section-save-flag" + (isDirty ? "" : " clean");
    flag.innerHTML = `<span class="dot"></span>${isDirty ? "저장 안 된 변경사항 있음" : "저장됨"}`;
  }
}
function renderNotFound() {
  document.querySelector("main").innerHTML = `
    <div class="empty-wrap">
      <div class="e-icon">❓</div>
      <div class="e-title">캐릭터를 찾을 수 없습니다</div>
      <div class="e-desc">삭제되었거나 잘못된 링크예요. 용병단 목록에서 다시 확인해주세요.</div>
      <a href="roster-index.html">← 용병단으로 돌아가기</a>
    </div>
  `;
}

// ============================================================================
// 부트스트랩 — 로그인 확인 → 전역 콘텐츠(스킬/직업 테이블) + 캐릭터 + 장착 장비 +
// 창고 풀을 전부 받아온 뒤에야 첫 렌더를 돌림. 예전엔 이 모든 게 localStorage
// 동기 읽기라 파싱 시점에 그냥 끝났지만, 이제 값이 비동기로 도착하므로 렌더
// 호출을 여기로 모았음(렌더 함수 자체는 그대로).
// ============================================================================
(async () => {
  session = await window.AuthGuard.requireSession();

  if (!charId) { renderNotFound(); return; }

  let skillContent, jobContent, charRow, heldRows;
  try {
    const [skillRes, jobRes, charRes, adminFlag] = await Promise.all([
      window.sbClient.from("game_content").select("data").eq("key", "skillTable").single(),
      window.sbClient.from("game_content").select("data").eq("key", "jobTable").single(),
      window.sbClient.from("characters").select("*").eq("id", charId).maybeSingle(),
      window.AuthGuard.isAdmin(session),
    ]);
    if (skillRes.error) throw skillRes.error;
    if (jobRes.error) throw jobRes.error;
    if (charRes.error) throw charRes.error;
    skillContent = skillRes.data?.data || {};
    jobContent = jobRes.data?.data || {};
    charRow = charRes.data;
    isAdmin = adminFlag;
  } catch (err) {
    reportError("초기 데이터 로드", err);
    renderNotFound();
    return;
  }

  COMMON_SKILLS = skillContent.commonSkills || [];
  SKILL_TABLE = skillContent.jobSkills || {};
  JOB_ADVANCEMENT_TABLE = jobContent.advancement || {};
  JOB_ALLOWED_EQUIPMENT_TYPES = jobContent.allowedEquipmentTypes || {};

  // 캐릭터가 없거나(삭제/오타) 남의 것이면(RLS가 애초에 행을 안 내려줌) 똑같이
  // "찾을 수 없음"으로 처리함 — 클라이언트 입장에서 둘은 구분 불가능하고,
  // 구분해서 알려줄 이유도 없음.
  if (!charRow) { renderNotFound(); return; }
  isOwner = charRow.user_id === session.user.id;
  if (!isOwner) { renderNotFound(); return; }

  data = mapCharacterRow(charRow);

  // 기본값 보정 — 예전 로스터 시절의 마이그레이션 코드 중 슬롯 4종→12종 변환은
  // 사라졌음(장비 슬롯은 이제 warehouse_items.slot 컬럼이라 변환할 옛 모양이
  // 존재하지 않음). 나머지 기본값 보정만 남김.
  const defaults = {};
  if (data.row !== "front" && data.row !== "back") { data.row = "front"; defaults.row_position = "front"; }
  if (typeof data.guardAllies !== "boolean") { data.guardAllies = false; defaults.guard_allies = false; }
  // "공격"이 COMMON_SKILLS로 전환되기 전에 만들어진 캐릭터도 계속 쓸 수 있도록 보정
  if (!data.learnedSkillNames.includes("공격")) {
    data.learnedSkillNames.unshift("공격");
    defaults.learned_skill_names = data.learnedSkillNames;
  }
  // 이 보정은 "사용자 편집"이 아니라 데이터 정합성 문제라 섹션별 저장 버튼을
  // 기다리지 않고 즉시 반영해둠(다음에 열었을 때 또 보정할 필요 없도록).
  if (Object.keys(defaults).length) {
    const { error } = await window.sbClient
      .from("characters").update(defaults).eq("id", charId).eq("user_id", session.user.id);
    if (error) reportError("기본값 보정 저장", error);
  }

  // data.equipment는 저장된 필드가 아니라 held_by 조회 결과로 조립하는 파생값.
  // 슬롯당 아이템 하나뿐이므로 slot 컬럼으로 그대로 꽂으면 예전 12슬롯 객체와
  // 정확히 같은 모양이 됨.
  data.equipment = {};
  EQUIPMENT_SLOT_KEYS.forEach((k) => { data.equipment[k] = null; });
  const { data: itemRows, error: itemError } = await window.sbClient
    .from("warehouse_items").select("*").eq("held_by", charId);
  if (itemError) { reportError("장착 장비 조회", itemError); }
  (itemRows || []).forEach((row) => {
    const item = mapItemRow(row);
    if (item.slot && item.slot in data.equipment) data.equipment[item.slot] = item;
  });

  await refreshEquipPool();

  renderProfile();
  renderStatSection();
  renderPatternSection();
  renderAdvancementSection();
})();
</script>
