<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>파견 의뢰</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  header { max-width:1000px; width:100%; margin:0 auto; padding:26px 20px 0; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  h1 { font-family:'Cinzel',serif; font-weight:700; font-size:25px; margin:8px 0 4px; color:#f2efe8; }
  .desc { font-size:13px; color:var(--mist-dim); line-height:1.7; margin-top:6px; }

  main { max-width:1000px; width:100%; margin:0 auto; padding:20px 20px 60px; flex:1; }
  .block { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .section-title { font-family:'Cinzel',serif; font-size:16px; color:#f2efe8; margin:0 0 12px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .hint { font-family:'Inter',sans-serif; font-size:11.5px; color:var(--mist-dim); font-weight:400; }

  /* 2026-08-21: Home 카드(roster-index.html)와 동일한 큰 3:4 초상화 스타일로 통일. */
  .member-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:14px; }
  .member {
    position:relative; background:var(--panel-raised); border:2px solid var(--line); border-radius:10px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    transition:border-color 0.12s ease, transform 0.1s ease;
  }
  .member:hover { transform:translateY(-2px); }
  .member.on { border-color:var(--gold); background:#2b2740; }
  .member .m-portrait {
    width:100%; aspect-ratio:3/4; background:var(--panel-sunken); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:48px; overflow:hidden;
  }
  .member .m-portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .member .m-body { padding:8px 10px 10px; }
  .member .m-check {
    position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel-raised); display:flex; align-items:center; justify-content:center;
    font-size:11px; color:transparent; z-index:1;
  }
  .member.on .m-check { background:var(--gold); border-color:var(--gold); color:var(--ink); }
  .member-name { font-size:13px; color:#e8e4f0; font-weight:600; }
  .member-sub { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist-dim); margin-top:2px; }

  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat-card { background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .stat-label { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--mist-dim); text-transform:uppercase; }
  .stat-value { font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; color:#f2efe8; margin-top:5px; }
  .stat-value.gold { color:var(--gold); } .stat-value.cyan { color:var(--cyan); } .stat-value.danger { color:var(--danger); }

  button.go { font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--panel-raised); color:var(--gold); border:1px solid var(--gold-dim); border-radius:8px; padding:12px 28px; cursor:pointer; }
  button.go:hover:not(:disabled) { background:var(--gold-dim); color:#f2efe8; }
  button.go:disabled { opacity:0.35; cursor:not-allowed; color:var(--mist-dim); border-color:var(--line); }
  .go-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:14px; }
  .warn { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--danger); }

  .loot { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; }
  .loot-name { font-size:13px; color:#e8e4f0; }
  .loot-qty { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--gold); font-weight:700; }
  .raw { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist-dim); }
  .empty { font-size:12.5px; color:var(--mist-dim); text-align:center; padding:22px; }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <script src="nav.js"></script>

<header>
  <div class="eyebrow">Dispatch</div>
  <h1 id="title">파견 의뢰</h1>
  <div class="desc">
    의뢰권 한 장으로 <b style="color:var(--gold);">2,000턴</b> 분량의 장기 파견을 보냅니다.
    용병단이 현지에서 전투를 반복하며, 빠르고 안정적으로 이길수록 같은 예산으로 더 많이 돌아요.<br />
    파견 보상은 직접 다녀온 것의 <b style="color:var(--gold);">1/100</b>로 정산됩니다.
  </div>
</header>

<main>
  <div class="block">
    <h2 class="section-title">파견할 용병 <span class="hint">최대 5명</span></h2>
    <div id="memberList" class="member-grid"></div>
  </div>

  <div class="block">
    <h2 class="section-title">파견 지시</h2>
    <div class="stat-grid" id="preGrid"></div>
    <div class="go-row">
      <div class="warn" id="warn"></div>
      <button class="go" id="goBtn" disabled>파견 보내기</button>
    </div>
  </div>

  <div id="resultArea"></div>
</main>

<script src="../src/resourceTypes.js"></script>
<script src="../src/resourceManager.js"></script>
<script src="../src/skillRegistry.js"></script>

<script src="../src/registries.js"></script>

<script src="../src/prepState.js"></script>
<script src="../src/skillResolution.js"></script>
<script src="../src/importer.js"></script>
<script src="../src/engine.js"></script>
<script src="battle-encounters.js"></script>
<script src="battle-themes.js"></script>
<script src="exp-table.js"></script>
<script src="battle-adapter.js"></script>

<script src="item-sets.js"></script>

<script src="auth-guard.js"></script>
<script>
// ============================================================================
// 파견 실행
//
// 의뢰권 1장 = TURN_BUDGET(2000)턴. 이 예산이 바닥날 때까지 같은 전투를
// 반복 시뮬레이션하고, 그동안 쌓인 보상을 나눠서 지급함(경험치 1/8, 전리품 1/100).
//
// 왜 나누는가: 예산이 2000턴이면 짧은 전투를 수백 회 돌 수 있어서, 직접
// 한 판 뛴 것과 보상 규모가 자릿수로 벌어짐. 나눠주면 "직접 도전은 온전히,
// 파견은 축약해서"라는 규칙이 경험치·아이템·골드 전부에 일관되게 적용되고,
// 희귀 아이템은 직접 도전이 유리하다는 역할 분담도 유지됨.
//
// 다만 "유리하다"이지 "독점한다"가 아님 — 파견은 게임에 시간을 많이 쓰기
// 어려운 사람도 한 번 성취한 구간에서는 주기적으로 보상을 얻어, 액티브 유저와의
// 격차가 지나치게 벌어지지 않게 하려고 만든 구획이다.
//
// ⚠ 전리품 정산 방식(2026-08-31 재설계, "[P0] 파견 전리품 정산" CLAUDE.md 참고):
// 예전엔 "누적 드랍 수량을 LOOT_DIVISOR로 나눠 반올림"했는데, 이러면 몬스터가
// 파견 안에서 몇 번이든 잡힐 수 있다는 전제가 깨져서 — 직접 도전에선 "만나기도
// 어렵고 나오기도 어려운" 희귀 아이템이, 파견에서 그 몬스터가 300번 넘게
// 반복 조우되면 원본 누적량이 100을 훌쩍 넘어 사실상 확정 획득이 됐다(고블린의
// 왕 실측: 340회 조우 → "왕의 대검" 15% 드랍의 파견 1회당 획득 확률 ≈51%).
// 그렇다고 raw가 낮은 아이템도 결국 "0 또는 1개"로 상한이 걸려, 51개어치
// 파밍한 성과와 1개어치 파밍한 성과가 똑같이 동전 던지기 하나로 뭉개지는
// 역전 구조였음.
//
// 지금은 "킬 횟수 자체를 먼저 압축하고, 그 압축된 횟수만큼만 독립적으로
// 드랍을 재판정"하는 방식(아래 finalLoot 계산 참조) — 몬스터가 파견에서
// 아무리 자주 잡혀도 각 드랍 판정은 "직접 도전과 완전히 같은 확률"을 유지한다.
// 기댓값(장기 평균 획득량)은 예전과 동일하게 보존됨(선형성 — 압축된 시행
// 횟수의 기댓값이 raw/LOOT_DIVISOR이므로).
//
// 8이라는 값의 근거: 파견 1장으로 "Lv10 → Lv15"가 대략 1.4장에 도달하도록
// 역산한 값(실측 기준 2000턴 파견의 현지 경험치 약 76,000 ÷ 8 ≈ 9,500,
// Lv10→15 필요량 13,210). 예전엔 100이었는데 그건 예산이 1만턴이던 시절의
// 값이라, 2000턴으로 줄이면서 같이 조정함.
// ============================================================================
(async function () {
  const TURN_BUDGET = 2000;
  // 경험치·골드와 아이템의 나눗값을 따로 둠.
  //   EXP: 성장 속도 목표(파견 1.4장으로 Lv10→15)에 맞춘 값.
  //   LOOT: 희귀 아이템은 직접 도전이 유리해야 한다는 역할 분담을 지키는 값.
  // 같은 값을 쓰면 둘 중 하나가 반드시 어긋남 — 경험치에 맞추면 왕관 조각이
  // 1장에 60개씩 쏟아지고(4세트가 20개), 아이템에 맞추면 레벨이 안 오름.
  // 참고: LOOT 쪽 100은 EXP의 8과 달리 실측 역산이 아니라 위 역할 분담 의도만
  // 보고 정한 값임(근거 강도가 다름 — CLAUDE.md의 API 검증 항목에도 적어둠).
  // ⚠ 2026-08-31부터 이 값의 역할이 바뀜 — 더 이상 "드랍 수량을 나누는" 값이
  // 아니라 "몬스터를 잡은 횟수를 압축하는" 값. 100번 잡을 때마다 압축된
  // 시행 1회로 취급한다(아래 finalLoot 계산 참조).
  const EXP_DIVISOR = 8;
  const LOOT_DIVISOR = 100;
  const TICKET_NAME = "파견 의뢰권";
  const MAX_PARTY = 5;

  const $ = (s) => document.querySelector(s);

  // roster-index.html/character-sheet.html/roster-select.html과 동일한 이중 모드
  // 초상화 렌더링(URL이면 <img>, 아니면 이모지 텍스트) — 로직이 짧아 공용 파일로
  // 안 빼고 파일마다 인라인(이 프로젝트의 기존 컨벤션).
  function isImagePortrait(p) { return /^(https?:|data:)/i.test(p || ""); }
  function renderPortrait(p) {
    return isImagePortrait(p) ? `<img src="${p}" alt="" />` : (p || "❓");
  }
  const params = new URLSearchParams(location.search);
  const battleId = params.get("battle") || "";
  const themeId = params.get("theme") || "";

  // 배열로 저장된 로스터를 id 키 객체로 바꿔주는 공용 헬퍼(battle-encounters.js).
  // 예전엔 여기서 배열을 그대로 넘겨 파견의 모든 몬스터 조회가 실패했음.
  // 이제 몬스터 로스터 자체는 아래 부트스트랩이 game_content에서 한 번 받아와
  // setMonsterRoster()로 주입함(시뮬 루프가 동기로 수백 번 조회하므로 필수).
  const getMonsterTable = () => window.BattleEncounters.getMonsterTable();

  // ── 부트스트랩이 채우는 캐시들 ─────────────────────────────────────────
  // 렌더/시뮬 루프가 동기로 여러 번 읽는 값이라 매번 DB를 묻지 않고 여기서 읽음
  // (roster-index.html/shop.html/refinery.html과 같은 컨벤션).
  let session = null;
  let roster = [];       // characters 행 → camelCase, equipment(held_by 조회분) 첨부
  let currentGold = 0;   // profiles.gold
  let ticketQty = 0;     // warehouse_items의 파견 의뢰권 수량
  const selected = new Set();

  // DB 행(snake_case) → battle-adapter/렌더 코드가 기대하는 camelCase.
  // roster-index.html/character-sheet.html의 mapCharacterRow와 동일한 컨벤션.
  function mapCharacterRow(row) {
    return {
      id: row.id,
      name: row.name,
      job: row.job,
      level: row.level,
      exp: row.exp,
      expToNext: row.exp_to_next,
      portrait: row.portrait,
      realStats: row.real_stats || {},
      learnedSkillNames: row.learned_skill_names || [],
      personalResources: row.personal_resources || {},
      row: row.row_position,
      guardAllies: row.guard_allies,
      presets: row.presets || [],
      activePresetIdx: row.battle_preset_idx ?? 0,
      keyItems: row.key_items || [],
    };
  }

  // character-sheet.html의 mapItemRow와 동일(장비 스펙 필드 전량).
  function mapItemRow(row) {
    return {
      id: row.id, name: row.name, category: row.category, quantity: row.quantity,
      description: row.description, slot: row.slot, heldBy: row.held_by,
      enhanceLevel: row.enhance_level, craftMaterial: row.craft_material, appraised: row.appraised,
      combatReal: row.combat_real, combatBonus: row.combat_bonus, statBonus: row.stat_bonus,
      passiveBonus: row.passive_bonus, maxHpBonus: row.max_hp_bonus, maxSpBonus: row.max_sp_bonus,
      weight: row.weight, twoHanded: row.two_handed, setId: row.set_id, requiredJob: row.required_job,
      statRealBonus: row.stat_real_bonus, patternSlotBonus: row.pattern_slot_bonus,
      critMultiplier: row.crit_multiplier, conditionalPassiveMods: row.conditional_passive_mods,
      grantsResource: row.grants_resource, equipmentType: row.equipment_type,
      avatarPortrait: row.avatar_portrait, grantsSkill: row.grants_skill,
      consumable: row.consumable, usesPerBattle: row.uses_per_battle, enhanceable: row.enhanceable,
      modifiable: row.modifiable,
    };
  }

  // camelCase 전리품 스펙 → warehouse_items insert payload(snake_case).
  // shop.html의 buildWarehouseInsertFromShopItem / refinery.html의
  // buildEnhancedInsertPayload와 같은 필드 목록.
  function buildWarehouseInsertFromLoot(loot, quantity) {
    return {
      user_id: session.user.id,
      name: loot.name,
      category: loot.category,
      quantity,
      description: loot.description ?? null,
      slot: loot.slot ?? null,
      combat_real: loot.combatReal ?? null,
      combat_bonus: loot.combatBonus ?? null,
      stat_bonus: loot.statBonus ?? null,
      passive_bonus: loot.passiveBonus ?? null,
      max_hp_bonus: loot.maxHpBonus ?? null,
      max_sp_bonus: loot.maxSpBonus ?? null,
      weight: loot.weight ?? null,
      two_handed: loot.twoHanded ?? null,
      set_id: loot.setId ?? null,
      required_job: loot.requiredJob ?? null,
      stat_real_bonus: loot.statRealBonus ?? null,
      pattern_slot_bonus: loot.patternSlotBonus ?? null,
      crit_multiplier: loot.critMultiplier ?? null,
      conditional_passive_mods: loot.conditionalPassiveMods ?? null,
      grants_resource: loot.grantsResource ?? null,
      equipment_type: loot.equipmentType ?? null,
      avatar_portrait: loot.avatarPortrait ?? null,
      grants_skill: loot.grantsSkill ?? null,
      consumable: loot.consumable ?? null,
      uses_per_battle: loot.usesPerBattle ?? null,
      enhanceable: loot.enhanceable ?? null,
      modifiable: loot.modifiable ?? null,
      craft_material: null, // 드랍 전리품은 항상 미개조(위 병합 필터와 짝을 이룸)
    };
  }

  function ticketCount() {
    return ticketQty;
  }
  // 티켓 차감은 캐시를 믿지 않고 매번 DB에서 다시 읽음 — 캐시가 낡아 있으면
  // 없는 의뢰권으로 파견을 보내게 됨(보상이 공짜로 나옴).
  async function consumeTicket() {
    const { data: row, error } = await window.sbClient
      .from("warehouse_items").select("id,quantity")
      .eq("user_id", session.user.id).eq("name", TICKET_NAME).maybeSingle();
    if (error) { alert(`의뢰권 조회 실패: ${error.message}`); return false; }
    if (!row || row.quantity <= 0) { ticketQty = 0; renderPre(); return false; }

    if (row.quantity <= 1) {
      const { error: delError } = await window.sbClient.from("warehouse_items").delete().eq("id", row.id);
      if (delError) { alert(`의뢰권 차감 실패: ${delError.message}`); return false; }
      ticketQty = 0;
    } else {
      const { error: updError } = await window.sbClient.from("warehouse_items")
        .update({ quantity: row.quantity - 1 }).eq("id", row.id);
      if (updError) { alert(`의뢰권 차감 실패: ${updError.message}`); return false; }
      ticketQty = row.quantity - 1;
    }
    renderPre();
    return true;
  }

  function renderMembers() {
    $("#memberList").innerHTML = roster.length ? roster.map((c) => `
      <div class="member ${selected.has(c.id) ? "on" : ""}" data-id="${c.id}">
        <div class="m-check">✓</div>
        <div class="m-portrait">${renderPortrait(c.portrait)}</div>
        <div class="m-body">
          <div class="member-name">${c.name}</div>
          <div class="member-sub">${c.job || "-"} · Lv.${c.level || 1}</div>
        </div>
      </div>`).join("") : `<div class="empty">파견 보낼 용병이 없어요.</div>`;
    document.querySelectorAll(".member").forEach((el) => el.onclick = () => {
      const id = el.dataset.id;
      if (selected.has(id)) selected.delete(id);
      else if (selected.size < MAX_PARTY) selected.add(id);
      renderMembers(); renderPre();
    });
  }

  function renderPre() {
    const tickets = ticketCount();
    $("#preGrid").innerHTML = `
      <div class="stat-card"><div class="stat-label">보유 의뢰권</div>
        <div class="stat-value ${tickets > 0 ? "gold" : "danger"}">${tickets}</div></div>
      <div class="stat-card"><div class="stat-label">턴 예산</div>
        <div class="stat-value">${TURN_BUDGET.toLocaleString()}</div></div>
      <div class="stat-card"><div class="stat-label">보상 정산</div>
        <div class="stat-value cyan" style="font-size:15px;">경험치 1/${EXP_DIVISOR}<br/>전리품 1/${LOOT_DIVISOR}</div></div>
      <div class="stat-card"><div class="stat-label">파견 인원</div>
        <div class="stat-value">${selected.size}<span style="font-size:12px;color:var(--mist-dim);"> / ${MAX_PARTY}</span></div></div>`;
    const problems = [];
    if (tickets <= 0) problems.push("⚠ 파견 의뢰권이 없어요. 모험가 길드에서 수주해 오세요.");
    if (selected.size === 0) problems.push("⚠ 파견할 용병을 1명 이상 선택해 주세요.");
    $("#warn").textContent = problems.join("  ");
    $("#goBtn").disabled = problems.length > 0;
  }

  $("#goBtn").addEventListener("click", async () => {
    if (!await consumeTicket()) { renderPre(); return; }
    const btn = $("#goBtn");
    btn.disabled = true; btn.textContent = "파견 중…";

    // 예산이 바닥날 때까지 반복. 각 판은 실제 전투 엔진을 그대로 태우므로
    // 직접 도전과 완전히 같은 규칙으로 계산됨(별도 근사 공식 없음).
    setTimeout(async () => {
      const monsterTable = getMonsterTable();
      const party = roster.filter((c) => selected.has(c.id));
      let spent = 0, runs = 0, wins = 0;
      let exp = 0, gold = 0;
      // 몬스터별 실제 조우(=격파) 횟수 — engine.js의 드랍 롤(r.lootGained)은
      // 이제 안 씀. 대신 이 킬 카운트를 압축해서 우리가 직접 재판정한다
      // (아래 finalLoot 계산). allyWin이면 그 판의 enemyKeys 전원이
      // 격파된 것이 보장됨(전멸승 조건과 동일 — 소환된 잡몹은 enemyKeys에
      // 안 잡히므로 이 카운트에서 자연히 제외됨, 원래도 그랬음).
      const killCounts = new Map();

      while (spent < TURN_BUDGET) {
        const enemyKeys = window.BattleEncounters.spawnEnemies(battleId).map((e) => e.monsterId);
        const r = window.BattleAdapter.runBattle({
          allyRosterChars: party, monsterTable, enemySpawnKeys: enemyKeys,
          maxTurns: 100, username: "파견", logger: () => {},
        });
        spent += r.turnsElapsed; runs += 1;
        if (r.outcome === "allyWin") {
          wins += 1;
          exp += r.expGained || 0;
          gold += r.goldGained || 0;
          enemyKeys.forEach((id) => { killCounts.set(id, (killCounts.get(id) || 0) + 1); });
        }
      }

      // 경험치/골드는 원본 누적량이 커서(수만 단위) 내림 손실이 무시할 수준이라
      // 그냥 버림.
      const finalExp = Math.floor(exp / EXP_DIVISOR);
      const finalGold = Math.floor(gold / EXP_DIVISOR);

      // 전리품 — "킬 카운트 압축 후 독립 재판정" (2026-08-31 재설계).
      // 몬스터별 raw 킬 횟수를 LOOT_DIVISOR로 확률적 반올림해 "압축된 시행
      // 횟수"를 구하고(예: 340킬 → 압축 3~4회), 그 횟수만큼만 실제
      // monsterTable의 dropTable을 engine.js의 grantKillReward와 동일한
      // 방식(개별 확률 판정 + [min,max] 수량 굴림)으로 다시 돌린다.
      // → 몬스터가 파견에서 아무리 자주 잡혀도 아이템 하나하나는 "직접
      // 도전과 완전히 같은 확률"을 유지함(자주 마주친다고 희귀도가
      // 무력화되지 않음). 기댓값은 예전과 동일(선형성 — 압축 시행 횟수의
      // 기댓값이 정확히 raw/LOOT_DIVISOR).
      // attempts는 화면 표시용 — 이 아이템이 몇 번의 압축 시행 중 나왔는지
      // (여러 몬스터가 같은 이름을 드랍하면 합산됨, 진짜 판정 근거는 이미
      // 위에서 다 끝났고 이건 참고용 숫자일 뿐).
      const loot = new Map();
      killCounts.forEach((rawKills, monsterId) => {
        const dropTable = monsterTable[monsterId]?.dropTable;
        if (!dropTable || !dropTable.length) return;

        const exactKills = rawKills / LOOT_DIVISOR;
        let compressedKills = Math.floor(exactKills);
        if (Math.random() < exactKills - compressedKills) compressedKills += 1;

        for (let i = 0; i < compressedKills; i++) {
          dropTable.forEach((drop) => {
            const cur = loot.get(drop.name) || { ...drop, quantity: 0, attempts: 0 };
            cur.attempts += 1;
            if (Math.random() <= drop.chance) {
              const [min, max] = drop.quantity;
              cur.quantity += min + Math.floor(Math.random() * (max - min + 1));
            }
            loot.set(drop.name, cur);
          });
        }
      });
      const finalLoot = [...loot.values()].filter((l) => l.quantity > 0);

      await applyRewards(party, finalExp, finalGold, finalLoot);
      renderResult({ runs, wins, spent, exp, gold, finalExp, finalGold, finalLoot, killCounts: [...killCounts.entries()] });

      btn.textContent = "파견 보내기";
      renderPre(); renderMembers();
    }, 30);
  });

  async function applyRewards(party, exp, gold, lootList) {
    // 경험치 — 파견에 나간 용병 전원에게 동일 지급(전투 결과와 같은 규칙).
    // exp-table.js의 grantExp를 거쳐야 레벨업까지 반영됨 — 예전엔 여기서 exp만
    // 더하고 레벨업 판정을 안 해서, 파견으로 쌓은 경험치가 레벨로 전환되지
    // 않고 숫자만 계속 불어났음.
    //
    // 예전엔 로스터 전체를 다시 읽어 통째로 저장했지만(부분 저장이 불가능한
    // localStorage 구조 탓), 이제는 캐릭터별로 exp/level/exp_to_next 세 컬럼만
    // update함 — 파티는 최대 5명이라 한 명씩 도는 걸로 충분(배치 RPC 불필요).
    for (const p of party) {
      window.ExpTable.grantExp(p, exp);
      const { error } = await window.sbClient.from("characters")
        .update({ exp: p.exp, level: p.level, exp_to_next: p.expToNext })
        .eq("id", p.id);
      if (error) alert(`경험치 저장 실패(${p.name}): ${error.message}`);
    }

    if (gold) {
      const next = currentGold + gold;
      const { error } = await window.sbClient.from("profiles")
        .update({ gold: next }).eq("user_id", session.user.id);
      if (error) alert(`골드 저장 실패: ${error.message}`);
      else currentGold = next;
    }

    // 전리품 병합 — 병합 조건은 상점 구매/직접 전투와 동일. held_by(누군가
    // 장착 중인 개별 인스턴스)나 enhance_level(강화품), craft_material(개조품)
    // 과는 절대 안 섞임(2026-08-22, craft_material 필터 추가 — shop.html/
    // battle-view.html과 동일한 버그가 이 파일에도 있었음).
    for (const l of lootList) {
      const { data: existing, error: findError } = await window.sbClient
        .from("warehouse_items").select("id,quantity")
        .eq("user_id", session.user.id).eq("name", l.name).eq("category", l.category)
        .is("held_by", null).is("enhance_level", null).is("craft_material", null).maybeSingle();
      if (findError) { alert(`전리품 저장 실패(${l.name}): ${findError.message}`); continue; }

      if (existing) {
        const { error } = await window.sbClient.from("warehouse_items")
          .update({ quantity: existing.quantity + l.quantity }).eq("id", existing.id);
        if (error) alert(`전리품 저장 실패(${l.name}): ${error.message}`);
      } else {
        // 장비 스펙(combatReal/weight/twoHanded 등)을 그대로 실어서 저장 —
        // 이게 없으면 드랍 장비를 장착해도 스탯이 0이 됨.
        const { error } = await window.sbClient.from("warehouse_items")
          .insert(buildWarehouseInsertFromLoot(l, l.quantity));
        if (error) alert(`전리품 저장 실패(${l.name}): ${error.message}`);
      }
    }
  }

  function renderResult(r) {
    $("#resultArea").innerHTML = `
      <div class="block">
        <h2 class="section-title">파견 결과 <span class="hint">${r.runs}회 전투 · ${r.spent.toLocaleString()}턴 소모</span></h2>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-label">전투 횟수</div><div class="stat-value">${r.runs}</div></div>
          <div class="stat-card"><div class="stat-label">승률</div>
            <div class="stat-value ${r.wins/r.runs >= 0.7 ? "cyan" : "danger"}">${(r.wins/r.runs*100).toFixed(1)}%</div></div>
          <div class="stat-card"><div class="stat-label">획득 경험치</div>
            <div class="stat-value gold">${r.finalExp.toLocaleString()}</div>
            <div class="raw">현지 ${r.exp.toLocaleString()} ÷ ${EXP_DIVISOR}</div></div>
          <div class="stat-card"><div class="stat-label">획득 골드</div>
            <div class="stat-value gold">${r.finalGold.toLocaleString()}</div>
            <div class="raw">현지 ${r.gold.toLocaleString()} ÷ ${EXP_DIVISOR}</div></div>
        </div>
      </div>
      <div class="block">
        <h2 class="section-title">전리품 <span class="hint">몬스터 조우 ${LOOT_DIVISOR}회당 압축 시행 1회로 재판정했어요</span></h2>
        ${r.finalLoot.length ? r.finalLoot.map((l) => `
          <div class="loot">
            <span class="loot-name">${l.name}</span>
            <span><span class="raw">압축 시행 ${l.attempts}회 → </span><span class="loot-qty">×${l.quantity}</span></span>
          </div>`).join("")
        : `<div class="empty">이번엔 가져온 전리품이 없어요.<br />
             희귀한 물건은 직접 다녀오시는 편이 확실합니다.</div>`}
      </div>`;
  }

  // ==========================================================================
  // 부트스트랩 — 로그인 확인 → 캐릭터(+장착 장비) · 몬스터 로스터 · 골드 ·
  // 의뢰권을 한 번에 받아온 뒤 첫 렌더. 렌더/시뮬 코드는 전부 위 캐시 변수를
  // 동기로 읽으므로, 이게 끝나기 전에는 아무것도 그리지 않음.
  // ==========================================================================
  session = await window.AuthGuard.requireSession();

  const [charRes, monsterRes, skillRes, profileRes, ticketRes] = await Promise.all([
    window.sbClient.from("characters").select("*").eq("user_id", session.user.id),
    window.sbClient.from("game_content").select("data").eq("key", "monsterRoster").single(),
    window.sbClient.from("game_content").select("data").eq("key", "skillTable").single(),
    window.sbClient.from("profiles").select("gold").eq("user_id", session.user.id).single(),
    window.sbClient.from("warehouse_items").select("id,quantity")
      .eq("user_id", session.user.id).eq("name", TICKET_NAME).maybeSingle(),
  ]);
  if (charRes.error) { alert(`용병 목록을 불러오지 못했습니다: ${charRes.error.message}`); return; }
  if (monsterRes.error) { alert(`몬스터 정보를 불러오지 못했습니다: ${monsterRes.error.message}`); return; }
  if (skillRes.error) { alert(`스킬 정보를 불러오지 못했습니다: ${skillRes.error.message}`); return; }
  if (profileRes.error) { alert(`골드 정보를 불러오지 못했습니다: ${profileRes.error.message}`); return; }
  if (ticketRes.error) { alert(`의뢰권 정보를 불러오지 못했습니다: ${ticketRes.error.message}`); return; }

  roster = (charRes.data || []).map(mapCharacterRow);
  window.BattleEncounters.setMonsterRoster(monsterRes.data?.data || []);
  // battle-adapter.js의 registerKnownSkills()가 매 전투 시작마다 동기로
  // 읽으므로(파견은 이 함수가 수백 번 호출됨) 여기서 미리 주입해둠 —
  // battle-encounters.js의 setMonsterRoster와 동일한 이유.
  window.BattleAdapter.setSkillTable(skillRes.data?.data || { commonSkills: [], jobSkills: {} });
  currentGold = profileRes.data?.gold ?? 0;
  ticketQty = ticketRes.data?.quantity ?? 0;

  // 장착 장비 — characters 테이블엔 equipment 컬럼이 없고(held_by가 유일한
  // 진실 공급원), battle-adapter는 rosterChar.equipment(슬롯 키 객체)를 직접
  // 읽는다(sumEquipmentCombatStats / 맨주먹 보정의 equipment?.mainhand). 그래서
  // 여기서 held_by로 조회해 슬롯별로 꽂아준다 — 이게 없으면 파견 전투가
  // 전원 맨주먹(ATK 5)으로 계산됨.
  roster.forEach((c) => { c.equipment = {}; });
  if (roster.length) {
    const byId = {};
    roster.forEach((c) => { byId[c.id] = c; });
    const { data: itemRows, error: itemError } = await window.sbClient
      .from("warehouse_items").select("*").in("held_by", roster.map((c) => c.id));
    if (itemError) { alert(`장착 장비를 불러오지 못했습니다: ${itemError.message}`); return; }
    (itemRows || []).forEach((row) => {
      const owner = byId[row.held_by];
      if (owner && row.slot) owner.equipment[row.slot] = mapItemRow(row);
    });
  }

  $("#title").textContent = `파견 의뢰 — ${window.BattleThemes.battleNameById(battleId)}`;

  renderMembers(); renderPre();
})();
</script>
</body>
</html>
