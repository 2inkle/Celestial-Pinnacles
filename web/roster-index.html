<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>용병단 · Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim);
    text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; transition:color 0.15s ease;
  }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  header { padding:32px 40px 22px; border-bottom:1px solid var(--line); }
  header .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  header h1 { font-family:'Cinzel',serif; font-weight:700; font-size:30px; margin:8px 0 4px; color:#f2efe8; }
  header .desc { font-size:13px; color:var(--mist-dim); max-width:560px; line-height:1.6; margin-top:10px; }

  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .header-actions { display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .gold-display { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); white-space:nowrap; }
  .village-link {
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.04em; color:var(--mist-dim);
    text-decoration:none; border:1px solid var(--line); padding:7px 14px; border-radius:20px; white-space:nowrap;
  }
  .village-link:hover { border-color:var(--gold); color:var(--gold); }

  main { flex:1; padding:24px 40px 48px; }
  /* 2026-08-21: 카드를 이미지·이름·직업·레벨만 남기는 걸로 슬림화하고
     이미지를 크게 키움(300×400과 같은 3:4 비율) — Max HP/SP·패턴 활성
     줄 수는 정보량이 과하다는 판단으로 뺌(정확한 값은 정보창에서 확인).
     카드 폭은 아래 .thumb width 하나만 바꾸면 같이 조정됨. */
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:16px;
  }

  a.card { text-decoration:none; color:inherit; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column;
    transition:border-color 0.15s ease, transform 0.1s ease;
  }
  .card:hover { border-color:var(--gold); transform:translateY(-2px); }

  .thumb {
    width:100%; aspect-ratio:3/4;
    background:var(--panel-raised); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:64px;
    overflow:hidden;
  }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-body { padding:12px 14px 14px; }
  .card-name { font-family:'Cinzel',serif; font-size:15px; color:#f2efe8; line-height:1.3; }
  .card-job { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist-dim); margin-top:2px; }

  .lv-row { display:flex; align-items:baseline; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-top:8px; }
  .lv-row .lv { color:var(--gold); }

  .mock-badge {
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; color:var(--mist-dim);
    border:1px dashed var(--line); border-radius:20px; padding:5px 12px; display:inline-block; margin-top:14px;
  }

  .empty-state {
    grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:90px 20px; text-align:center; border:1px dashed var(--line); border-radius:12px;
  }
  .empty-state .e-icon { font-size:32px; }
  .empty-state .e-title { font-family:'Cinzel',serif; font-size:17px; color:#f2efe8; }
  .empty-state .e-desc { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim); max-width:320px; line-height:1.6; }
  .empty-state .e-cta {
    margin-top:6px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold);
    text-decoration:none; border:1px solid var(--gold-dim); padding:8px 18px; border-radius:6px;
  }
  .empty-state .e-cta:hover { border-color:var(--gold); background:#d9b45c14; }

  /* ── 튜토리얼 패널 (온보딩) ───────────────────────────────────────────── */
  .tut-panel {
    background:var(--panel); border:1px solid var(--gold-dim); border-radius:12px;
    padding:18px 20px; margin-bottom:20px;
  }
  .tut-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .tut-title { font-family:'Cinzel',serif; font-size:16px; color:var(--gold); }
  .tut-sub { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--mist-dim); line-height:1.6; margin-bottom:14px; }
  .tut-dismiss {
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim);
    background:none; border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; white-space:nowrap;
  }
  .tut-dismiss:hover { color:var(--mist); border-color:var(--mist-dim); }
  .tut-steps { display:grid; gap:10px; }
  .tut-step {
    display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:8px;
  }
  .tut-step.done { opacity:0.55; }
  .tut-step.ready { border-color:var(--gold-dim); }
  .tut-icon { font-size:18px; line-height:1.3; }
  .tut-body { flex:1; min-width:0; }
  .tut-step-title { font-size:13.5px; color:#f2efe8; }
  .tut-step-desc { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--mist-dim); line-height:1.6; margin-top:3px; }
  .tut-reward { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); margin-top:5px; }
  .tut-actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .tut-badge {
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
    padding:3px 8px; border-radius:5px; border:1px solid var(--line); color:var(--mist-dim); white-space:nowrap;
  }
  .tut-badge.ready { color:var(--gold); border-color:var(--gold-dim); }
  .tut-badge.done { color:var(--cyan); border-color:var(--cyan); }
  .tut-link { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--cyan); text-decoration:none; white-space:nowrap; }
  .tut-claim {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel);
    color:var(--gold); border:1px solid var(--gold-dim); border-radius:6px; padding:6px 14px; cursor:pointer; white-space:nowrap;
  }
  .tut-claim:hover:not(:disabled) { background:var(--gold-dim); color:#f2efe8; }
  .tut-claim:disabled { opacity:0.4; cursor:not-allowed; }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <script src="nav.js"></script>
  



<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">Mercenary Guild · Index</div>
      <h1>용병단</h1>
    </div>
    <div class="header-actions">
      <div class="gold-display">💰 <span id="goldVal">0</span> G</div>
      <a class="village-link" href="village.html">마을로 이동 →</a>
    </div>
  </div>
  <div class="desc">보유한 모든 용병을 한눈에 확인하세요. 카드를 클릭하면 해당 캐릭터의 정보창(Sheet)으로 이동해서 스탯을 배분하고, 장비를 갈아입히고, 패턴을 짤 수 있습니다.</div>
  <div class="mock-badge">⚠ 테스트 빌드 — 계정에 저장된 용병만 표시됩니다</div>
</header>

<main>
  <div id="tutorialPanel" style="display:none;"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="item-sets.js"></script>
<script src="tutorial-table.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
<script>
  // 초상화 이중 모드 렌더링 — character-sheet.html과 동일한 로직(공용
  // 파일로 안 빼는 이유도 거기 주석 참고).
  function isImagePortrait(p) {
    return /^(https?:|data:)/i.test(p || "");
  }
  function renderPortrait(p) {
    return isImagePortrait(p) ? `<img src="${p}" alt="" />` : (p || "❓");
  }

  // DB 행(snake_case)을 기존 렌더링 코드가 기대하는 camelCase 모양으로 매핑.
  // 렌더링/추정 함수 자체는 최대한 안 건드리고 이 어댑터에서만 흡수함.
  function mapCharacterRow(row) {
    return {
      id: row.id,
      name: row.name,
      job: row.job,
      level: row.level,
      exp: row.exp,
      expToNext: row.exp_to_next,
      portrait: row.portrait,
      realStats: row.real_stats || {},
      learnedSkillNames: row.learned_skill_names || [],
      personalResources: row.personal_resources || {},
      row: row.row_position,
      guardAllies: row.guard_allies,
      presets: row.presets || [],
    };
  }

  const grid = document.getElementById("grid");
  let roster = [];
  let equippedByCharacter = {}; // characterId -> warehouse_items 행 배열(held_by로 장착된 것들)

  function render() {
    if (roster.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="e-icon">🏕️</div>
          <div class="e-title">보유한 용병이 없습니다</div>
          <div class="e-desc">마을의 고용소에서 첫 용병을 영입해보세요.</div>
          <a class="e-cta" href="village.html">마을로 이동 →</a>
        </div>
      `;
      return;
    }
    grid.innerHTML = "";

    // 2026-08-21: 카드는 이미지·이름·직업·레벨만 보여줌(Max HP/SP·패턴 활성
    // 줄 수 추정 로직은 정보 과다 판단으로 제거 — 정확한 값은 정보창에서
    // 확인). equippedByCharacter는 카드 표시엔 더 이상 안 쓰이지만 fetch
    // 자체는 유지함 — 아래 튜토리얼 조건 판정(tutorialCtx.equippedCount)이
    // 여전히 그 데이터를 씀.
    roster.forEach(r => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = `character-sheet.html?id=${encodeURIComponent(r.id)}`;
      a.innerHTML = `
        <div class="thumb">${renderPortrait(r.portrait)}</div>
        <div class="card-body">
          <div class="card-name">${r.name}</div>
          <div class="card-job">${r.job}</div>
          <div class="lv-row"><span>레벨</span><span class="lv">Lv. ${r.level}</span></div>
        </div>
      `;
      grid.appendChild(a);
    });
  }

  // ==========================================================================
  // 튜토리얼 패널 (온보딩) — 2026-08-20 신설.
  //
  // 신규 유저가 계정을 만들면 "보유한 용병이 없습니다" 한 줄만 보고 무엇부터
  // 해야 할지 알 수 없다는 피드백에서 출발함. 단계 정의는 web/tutorial-table.js에
  // 있고(내용은 그쪽에서 채움), 여기서는 판정·렌더링·보상 지급만 담당한다.
  //
  // 조건은 별도 추적 없이 기존 데이터에서 즉석 계산(quest_progress와 같은 방침).
  // 저장하는 건 "보상을 받았는가"뿐 — profiles.tutorial_state(0022).
  // ==========================================================================
  let tutorialState = {};   // { "<stepId>": { claimedAt }, dismissed: true }
  let tutorialCtx = null;   // 조건 판정에 쓰는 스냅샷

  function evaluateStep(step) {
    const c = step.condition || {};
    const need = c.count ?? 1;
    switch (c.type) {
      case "hasCharacter":     return tutorialCtx.characterCount >= need;
      case "hasEquippedItem":  return tutorialCtx.equippedCount >= need;
      case "hasPatternRows":   return tutorialCtx.maxPatternRows >= need;
      case "hasClearedBattle": return tutorialCtx.clearedCount >= need;
      default:
        console.warn("[tutorial] 알 수 없는 조건 타입:", c.type, step);
        return false;
    }
  }

  function describeRewards(rewards) {
    return (rewards || []).map((r) =>
      r.type === "gold" ? `골드 ${r.amount}` : `${r.name}${(r.quantity || 1) > 1 ? ` ×${r.quantity}` : ""}`
    ).join(" · ");
  }

  async function claimStepRewards(step) {
    for (const reward of (step.rewards || [])) {
      if (reward.type === "gold") {
        if (!reward.amount) continue;
        const { data: profile, error: readErr } = await window.sbClient
          .from("profiles").select("gold").eq("user_id", tutorialCtx.userId).single();
        if (readErr) throw readErr;
        const { error } = await window.sbClient.from("profiles")
          .update({ gold: (profile.gold || 0) + reward.amount }).eq("user_id", tutorialCtx.userId);
        if (error) throw error;
      } else if (reward.type === "item") {
        // quest-table.js의 보상 지급과 같은 "카탈로그 필드 spread" 방식.
        const { type, name, category, quantity, ...spec } = reward;
        const { error } = await window.sbClient.from("warehouse_items").insert({
          user_id: tutorialCtx.userId,
          name, category, quantity: quantity || 1,
          slot: spec.slot ?? null,
          equipment_type: spec.equipmentType ?? null,
          set_id: spec.setId ?? null,
          combat_real: spec.combatReal ?? null,
          combat_bonus: spec.combatBonus ?? null,
          stat_bonus: spec.statBonus ?? null,
          stat_real_bonus: spec.statRealBonus ?? null,
          passive_bonus: spec.passiveBonus ?? null,
          max_hp_bonus: spec.maxHpBonus ?? null,
          max_sp_bonus: spec.maxSpBonus ?? null,
          weight: spec.weight ?? null,
          two_handed: spec.twoHanded ?? null,
          required_job: spec.requiredJob ?? null,
          enhanceable: spec.enhanceable ?? null,
          modifiable: spec.modifiable ?? null,
          description: spec.description ?? null,
        });
        if (error) throw error;
      }
    }

    tutorialState[step.id] = { claimedAt: new Date().toISOString() };
    const { error } = await window.sbClient.from("profiles")
      .update({ tutorial_state: tutorialState }).eq("user_id", tutorialCtx.userId);
    if (error) throw error;
  }

  function renderTutorial() {
    const panel = document.getElementById("tutorialPanel");
    const steps = (window.TutorialTable?.TUTORIAL_STEPS) || [];
    // 닫았거나, 모든 단계를 수령했으면 더 보여주지 않음.
    const allClaimed = steps.length > 0 && steps.every((s) => tutorialState[s.id]);
    if (!steps.length || tutorialState.dismissed || allClaimed) { panel.style.display = "none"; return; }

    panel.style.display = "";
    const claimedCount = steps.filter((s) => tutorialState[s.id]).length;
    panel.innerHTML = `
      <div class="tut-panel">
        <div class="tut-head">
          <span class="tut-title">📖 처음이신가요?</span>
          <button class="tut-dismiss" id="tutDismissBtn">다시 보지 않기</button>
        </div>
        <div class="tut-sub">아래 순서대로 따라가면 첫 전투까지 자연스럽게 이어집니다. (${claimedCount}/${steps.length} 완료)</div>
        <div class="tut-steps">
          ${steps.map((step) => {
            const claimed = !!tutorialState[step.id];
            const met = evaluateStep(step);
            const cls = claimed ? "done" : (met ? "ready" : "");
            const badge = claimed
              ? `<span class="tut-badge done">완료</span>`
              : (met ? `<span class="tut-badge ready">보상 대기</span>` : `<span class="tut-badge">진행 중</span>`);
            const action = claimed ? ""
              : (met
                  ? `<button class="tut-claim" data-step="${step.id}">보상 받기</button>`
                  : (step.linkHref ? `<a class="tut-link" href="${step.linkHref}">${step.linkLabel || "이동 →"}</a>` : ""));
            const rewardText = describeRewards(step.rewards);
            return `
              <div class="tut-step ${cls}">
                <span class="tut-icon">${step.icon || "•"}</span>
                <div class="tut-body">
                  <div class="tut-step-title">${step.title}</div>
                  <div class="tut-step-desc">${step.description || ""}</div>
                  ${rewardText ? `<div class="tut-reward">보상: ${rewardText}</div>` : ""}
                </div>
                <div class="tut-actions">${badge}${action}</div>
              </div>`;
          }).join("")}
        </div>
      </div>`;

    document.getElementById("tutDismissBtn").addEventListener("click", async () => {
      tutorialState.dismissed = true;
      await window.sbClient.from("profiles").update({ tutorial_state: tutorialState }).eq("user_id", tutorialCtx.userId);
      renderTutorial();
    });

    panel.querySelectorAll(".tut-claim").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true; // 중복 클릭 방지
        const step = steps.find((s) => s.id === btn.dataset.step);
        if (!step || tutorialState[step.id]) { renderTutorial(); return; }
        try {
          await claimStepRewards(step);
          alert(`보상을 받았습니다: ${describeRewards(step.rewards)}`);
        } catch (err) {
          alert(`보상 지급에 실패했습니다: ${err.message || err}`);
        }
        location.reload(); // 골드/창고 표시를 최신 상태로
      });
    });
  }

  (async () => {
    const session = await window.AuthGuard.requireSession();
    const userId = session.user.id;

    try {
      const [{ data: profile, error: profileError }, { data: charRows, error: charError }] = await Promise.all([
        window.sbClient.from("profiles").select("gold,tutorial_state").eq("user_id", userId).single(),
        window.sbClient.from("characters").select("*").eq("user_id", userId),
      ]);
      if (profileError) throw profileError;
      if (charError) throw charError;

      document.getElementById("goldVal").textContent = (profile?.gold ?? 0).toLocaleString();
      roster = (charRows || []).map(mapCharacterRow);

      if (roster.length > 0) {
        const characterIds = roster.map((r) => r.id);
        const { data: itemRows, error: itemError } = await window.sbClient
          .from("warehouse_items")
          .select("*")
          .in("held_by", characterIds);
        if (itemError) throw itemError;
        equippedByCharacter = {};
        (itemRows || []).forEach((it) => {
          (equippedByCharacter[it.held_by] ||= []).push(it);
        });
      }

      render();

      // 튜토리얼 조건 판정용 스냅샷 — 전투 클리어 기록만 추가로 조회.
      const { data: progressRows } = await window.sbClient
        .from("battle_progress").select("cleared").eq("user_id", userId).eq("cleared", true);
      tutorialState = profile?.tutorial_state || {};
      tutorialCtx = {
        userId,
        characterCount: roster.length,
        equippedCount: Object.values(equippedByCharacter).reduce((n, arr) => n + arr.length, 0),
        // "어느 캐릭터의 어느 프리셋이든" 가장 많은 행 수 — 패턴을 짜봤는지
        // 판정용이라 전투용 프리셋(battle_preset_idx)만 보지 않고 전부 훑음
        // (연습 삼아 다른 프리셋에 짜봤어도 인정).
        maxPatternRows: roster.reduce((max, c) =>
          (c.presets || []).reduce((m, p) => Math.max(m, (p?.rows || []).length), max), 0),
        clearedCount: (progressRows || []).length,
      };
      renderTutorial();
    } catch (err) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="e-icon">⚠️</div>
          <div class="e-title">불러오기 실패</div>
          <div class="e-desc">${err.message || "알 수 없는 오류"}</div>
        </div>
      `;
    }
  })();
</script>

</body>
