<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제작공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  header { max-width:1100px; width:100%; margin:0 auto; padding:26px 20px 0; }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  h1 { font-family:'Cinzel',serif; font-weight:700; font-size:26px; margin:8px 0 4px; color:#f2efe8; }
  .desc { font-size:13px; color:var(--mist-dim); line-height:1.6; margin-top:6px; }
  .gold-badge { font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--gold); font-weight:600; background:var(--panel); border:1px solid var(--gold-dim); border-radius:20px; padding:8px 16px; white-space:nowrap; }

  main { max-width:1100px; width:100%; margin:0 auto; padding:22px 20px 60px; flex:1; }

  .tabs { display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .tab { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim); background:none; border:none; border-bottom:2px solid transparent; padding:10px 18px; cursor:pointer; }
  .tab:hover { color:var(--mist); }
  .tab.active { color:var(--gold); border-bottom-color:var(--gold); }

  .block { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .section-title { font-family:'Cinzel',serif; font-size:16px; color:#f2efe8; margin:0 0 4px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .hint { font-family:'Inter',sans-serif; font-size:11.5px; color:var(--mist-dim); font-weight:400; }

  .list { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .row { display:flex; align-items:center; gap:12px; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:11px 14px; }
  .row.selected { border-color:var(--gold); background:#2b2740; }
  .row-main { flex:1; min-width:0; }
  .row-name { font-size:13.5px; color:#e8e4f0; font-weight:600; }
  .row-sub { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-top:3px; line-height:1.5; }
  .row-sub .pos { color:var(--cyan); }
  .row-sub .neg { color:var(--danger); }
  .tag { font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--mist-dim); }
  .tag.gold { color:var(--gold); border-color:var(--gold-dim); }
  .tag.cyan { color:var(--cyan); border-color:var(--cyan-dim); }

  button.act { font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel); color:var(--mist); border:1px solid var(--line); border-radius:6px; padding:7px 14px; cursor:pointer; white-space:nowrap; }
  button.act:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
  button.act:disabled { opacity:0.35; cursor:not-allowed; }
  button.act.primary { border-color:var(--gold-dim); color:var(--gold); }
  button.act.primary:hover:not(:disabled) { background:var(--gold-dim); color:#f2efe8; }

  .empty { font-size:12.5px; color:var(--mist-dim); text-align:center; padding:26px 10px; }
  .preview { margin-top:14px; padding:14px; border:1px dashed var(--gold-dim); border-radius:8px; background:#221f30; }
  .preview-title { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); letter-spacing:0.08em; margin-bottom:8px; }
  .arrow { color:var(--mist-dim); margin:0 6px; }
  .flavor { font-size:12px; color:var(--mist-dim); font-style:italic; margin-top:6px; line-height:1.6; }
  .warn { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--danger); margin-top:10px; }
</style>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <script src="nav.js"></script>

<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">Workshop</div>
      <h1>제작공방</h1>
      <div class="desc">
        장비에 소재를 하나 넣어 성격을 바꿉니다. 소재는 넣는 순간 사라지고, 한 번 넣은 장비는 되돌릴 수 없어요.<br />
        어떤 소재가 무슨 효과를 주는지 모르겠다면 감정을 맡겨보세요 — 감정하지 않아도 제작은 가능합니다.
      </div>
    </div>
    <div class="gold-badge" id="goldBadge">💰 0 G</div>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="craft">🔨 개조</button>
    <button class="tab" data-tab="appraise">🔍 감정</button>
  </div>
  <div id="view"></div>
</main>

<script src="craft-materials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
<script>
// ============================================================================
// 제작공방
//
// 이번 단계에서 만드는 건 "개조"와 "감정" 두 가지.
//   개조 — 창고의 바닐라 장비(강화 안 됨 + 소재 안 넣음 + 미장착) 하나를 고르고
//          소재 하나를 넣어 결과물을 만듦. 소재 슬롯은 언제나 1개.
//   감정 — 소재가 어떤 효과를 주는지 골드를 내고 미리 확인. 개별 인스턴스
//          단위이고, 감정 없이도 개조에 넣을 수 있음(강제 아님).
//
// "신규 제작"(기본 소재로 장비를 처음부터 만드는 것)은 레시피 테이블이 정해진
// 뒤에 붙일 자리만 비워둠 — 지금은 드랍 장비를 개조하는 흐름만으로도
// "기약 없는 파밍"을 완화한다는 목적이 충족되기 때문.
//
// 저장 형식: 개조 결과물은 원본 이름을 그대로 쓰고 craftMaterial 필드로만
// 구분됨(유저에게 소재명을 이름으로 노출하지 않는 게 의도). 창고 병합도
// craftMaterial까지 같아야 합쳐지도록 아래 findStackable에서 처리함.
//
// 선택 상태는 예전엔 배열 인덱스(_idx)로 관리했는데(삭제 시 "인덱스가 밀리지
// 않도록 큰 쪽부터 지움" 같은 방어 코드가 필요했음), DB 행은 고유 id를 이미
// 갖고 있어서 그 id를 그대로 선택 키로 씀 — 인덱스 시프트 문제 자체가 사라짐.
// ============================================================================
(async function () {
  const $ = (sel) => document.querySelector(sel);

  const session = await window.AuthGuard.requireSession();
  let currentGold = 0;
  let warehousePool = []; // held_by IS NULL인 내 창고 전체(장비+소재 둘 다 포함)

  // DB 행(snake_case) → camelCase. 다른 페이지들과 동일한 어댑터 컨벤션.
  function mapItemRow(row) {
    return {
      id: row.id, name: row.name, category: row.category, quantity: row.quantity,
      description: row.description, slot: row.slot, heldBy: row.held_by,
      enhanceLevel: row.enhance_level, craftMaterial: row.craft_material, appraised: row.appraised,
      combatReal: row.combat_real, combatBonus: row.combat_bonus, statBonus: row.stat_bonus,
      passiveBonus: row.passive_bonus, maxHpBonus: row.max_hp_bonus, maxSpBonus: row.max_sp_bonus,
      weight: row.weight, twoHanded: row.two_handed, setId: row.set_id, requiredJob: row.required_job,
      statRealBonus: row.stat_real_bonus, patternSlotBonus: row.pattern_slot_bonus,
      critMultiplier: row.crit_multiplier, conditionalPassiveMods: row.conditional_passive_mods,
      grantsResource: row.grants_resource, equipmentType: row.equipment_type,
      avatarPortrait: row.avatar_portrait, grantsSkill: row.grants_skill,
      consumable: row.consumable, usesPerBattle: row.uses_per_battle, enhanceable: row.enhanceable,
    };
  }

  // camelCase 스펙(개조 결과) → warehouse_items insert payload(snake_case).
  function buildCraftedInsertPayload(spec, quantity) {
    return {
      user_id: session.user.id, name: spec.name, category: spec.category, quantity,
      description: spec.description ?? null, slot: spec.slot ?? null,
      craft_material: spec.craftMaterial ?? null,
      combat_real: spec.combatReal ?? null, combat_bonus: spec.combatBonus ?? null,
      stat_bonus: spec.statBonus ?? null, passive_bonus: spec.passiveBonus ?? null,
      max_hp_bonus: spec.maxHpBonus ?? null, max_sp_bonus: spec.maxSpBonus ?? null,
      weight: spec.weight ?? null, two_handed: spec.twoHanded ?? null, set_id: spec.setId ?? null,
      required_job: spec.requiredJob ?? null, stat_real_bonus: spec.statRealBonus ?? null,
      pattern_slot_bonus: spec.patternSlotBonus ?? null, crit_multiplier: spec.critMultiplier ?? null,
      conditional_passive_mods: spec.conditionalPassiveMods ?? null, grants_resource: spec.grantsResource ?? null,
      equipment_type: spec.equipmentType ?? null, avatar_portrait: spec.avatarPortrait ?? null,
      grants_skill: spec.grantsSkill ?? null, consumable: spec.consumable ?? null,
      uses_per_battle: spec.usesPerBattle ?? null, enhanceable: spec.enhanceable ?? null,
    };
  }

  async function refreshWarehousePool() {
    const { data, error } = await window.sbClient.from("warehouse_items").select("*")
      .eq("user_id", session.user.id).is("held_by", null);
    if (error) { alert(`창고 조회 실패: ${error.message}`); return; }
    warehousePool = (data || []).map(mapItemRow);
  }

  function getGold() { return currentGold; }

  let tab = "craft";
  let selectedEquipId = null;
  let selectedMatName = null;

  // 개조 대상 — 강화도 안 됐고 소재도 안 들어간 순정 장비만.
  // 강화품을 제외하는 건 "강화 배율 × 소재 보정"이 겹쳐 계산이 꼬이는 걸
  // 막기 위함이고, 이미 소재가 든 장비를 제외하는 건 소재 슬롯이 1개이기 때문.
  function craftableEquipment() {
    return warehousePool.filter((w) => w.category === "equipment" && !w.enhanceLevel && !w.craftMaterial && (w.quantity || 0) > 0);
  }
  function ownedMaterials() {
    return warehousePool.filter((w) => w.category === "material" && (w.quantity || 0) > 0 && CRAFT_MATERIAL_TABLE[w.name]);
  }

  function describeSpec(item) {
    const parts = [];
    const push = (obj, prefix) => {
      if (!obj) return;
      Object.entries(obj).forEach(([k, v]) => {
        if (!v) return;
        parts.push(`<span class="${v > 0 ? "pos" : "neg"}">${prefix}${k} ${v > 0 ? "+" : ""}${v}</span>`);
      });
    };
    push(item.combatReal, "");
    push(item.combatBonus, "b:");
    push(item.statBonus, "");
    push(item.passiveBonus, "");
    if (item.maxHpBonus) parts.push(`<span class="pos">MaxHP +${item.maxHpBonus}</span>`);
    if (item.maxSpBonus) parts.push(`<span class="pos">MaxSP +${item.maxSpBonus}</span>`);
    if (item.weight != null) parts.push(`무게 ${item.weight}`);
    if (item.twoHanded) parts.push("양손");
    return parts.join(" · ") || "—";
  }

  // 창고 병합 — 이름/카테고리뿐 아니라 craftMaterial과 enhanceLevel까지 같아야
  // ── 개조 탭 ────────────────────────────────────────────────────────────
  function renderCraft() {
    const equips = craftableEquipment();
    const mats = ownedMaterials();
    const eq = selectedEquipId != null ? equips.find((e) => e.id === selectedEquipId) : null;
    const matEntry = selectedMatName ? mats.find((m) => m.name === selectedMatName) : null;
    const matDef = selectedMatName ? CRAFT_MATERIAL_TABLE[selectedMatName] : null;

    let preview = "";
    if (eq && matDef) {
      const result = applyCraftMaterial(eq, selectedMatName);
      preview = `
        <div class="preview">
          <div class="preview-title">결과 미리보기</div>
          <div class="row-name">${eq.name}</div>
          <div class="row-sub">${describeSpec(eq)}</div>
          <div class="row-sub" style="margin-top:6px;">↓</div>
          <div class="row-sub">${describeSpec(result)}</div>
          ${result.setId ? `<div class="row-sub" style="margin-top:6px;"><span class="tag gold">세트: ${result.setId}</span></div>` : ""}
          ${matEntry && !matEntry.appraised ? `<div class="warn">⚠ 감정하지 않은 소재입니다 — 위 결과는 실제 적용값이지만, 감정 전에는 정보를 몰라도 넣을 수 있다는 점만 참고하세요.</div>` : ""}
          <div style="margin-top:12px; text-align:right;">
            <button class="act primary" id="doCraft">이 소재로 개조</button>
          </div>
        </div>`;
    }

    return `
      <div class="block">
        <h2 class="section-title">개조할 장비 <span class="hint">강화하지 않은 순정 장비만 — 이미 소재가 들어갔거나 강화된 장비는 개조할 수 없어요</span></h2>
        <div class="list">
          ${equips.length ? equips.map((e) => `
            <div class="row ${e.id === selectedEquipId ? "selected" : ""}" data-equip="${e.id}">
              <div class="row-main">
                <div class="row-name">${e.name}${e.quantity > 1 ? ` <span class="hint">×${e.quantity}</span>` : ""}</div>
                <div class="row-sub">${describeSpec(e)}</div>
              </div>
              <button class="act" data-equip-pick="${e.id}">${e.id === selectedEquipId ? "선택됨" : "선택"}</button>
            </div>`).join("") : `<div class="empty">개조할 수 있는 장비가 없어요. 전투에서 장비를 얻거나 상점에서 구매해 보세요.</div>`}
        </div>
      </div>

      <div class="block">
        <h2 class="section-title">넣을 소재 <span class="hint">소재 슬롯은 하나뿐이라 되돌릴 수 없어요</span></h2>
        <div class="list">
          ${mats.length ? mats.map((m) => {
            const def = CRAFT_MATERIAL_TABLE[m.name];
            return `
            <div class="row ${m.name === selectedMatName ? "selected" : ""}">
              <div class="row-main">
                <div class="row-name">${m.name} <span class="hint">×${m.quantity}</span>
                  ${m.appraised ? `<span class="tag cyan">감정됨</span>` : `<span class="tag">미감정</span>`}</div>
                <div class="row-sub">${m.appraised ? def.describe : "??? — 감정하면 효과를 알 수 있어요"}</div>
              </div>
              <button class="act" data-mat-pick="${m.name}">${m.name === selectedMatName ? "선택됨" : "선택"}</button>
            </div>`;
          }).join("") : `<div class="empty">가진 소재가 없어요.</div>`}
        </div>
        ${preview}
      </div>`;
  }

  // ── 감정 탭 ────────────────────────────────────────────────────────────
  function renderAppraise() {
    const mats = ownedMaterials();
    const gold = getGold();
    return `
      <div class="block">
        <h2 class="section-title">소재 감정 <span class="hint">감정비는 소재의 희귀도에 따라 달라져요. 감정하지 않아도 개조에는 넣을 수 있어요</span></h2>
        <div class="list">
          ${mats.length ? mats.map((m) => {
            const def = CRAFT_MATERIAL_TABLE[m.name];
            const cant = gold < def.appraisalCost;
            return `
            <div class="row">
              <div class="row-main">
                <div class="row-name">${m.name} <span class="hint">×${m.quantity}</span>
                  ${m.appraised ? `<span class="tag cyan">감정됨</span>` : `<span class="tag gold">${def.appraisalCost} G</span>`}</div>
                <div class="row-sub">${m.appraised ? def.describe : "???"}</div>
                ${m.appraised ? `<div class="flavor">${def.flavor}</div>` : ""}
              </div>
              ${m.appraised
                ? `<button class="act" disabled>완료</button>`
                : `<button class="act primary" data-appraise="${m.id}" ${cant ? "disabled title='골드가 부족해요'" : ""}>감정</button>`}
            </div>`;
          }).join("") : `<div class="empty">감정할 소재가 없어요.</div>`}
        </div>
      </div>`;
  }

  function render() {
    $("#goldBadge").textContent = `💰 ${getGold().toLocaleString()} G`;
    $("#view").innerHTML = tab === "craft" ? renderCraft() : renderAppraise();
    bind();
  }

  function bind() {
    document.querySelectorAll("[data-equip-pick]").forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.equipPick;
      selectedEquipId = selectedEquipId === id ? null : id;
      render();
    }));
    document.querySelectorAll("[data-mat-pick]").forEach((b) => b.addEventListener("click", () => {
      const name = b.dataset.matPick;
      selectedMatName = selectedMatName === name ? null : name;
      render();
    }));

    const craftBtn = $("#doCraft");
    if (craftBtn) craftBtn.addEventListener("click", async () => {
      const base = craftableEquipment().find((e) => e.id === selectedEquipId);
      const matEntry = ownedMaterials().find((m) => m.name === selectedMatName);
      if (!base || !matEntry) return;
      const matName = selectedMatName;
      if (!confirm(`"${base.name}"에 "${matName}"을(를) 넣습니다.\n소재는 사라지고 되돌릴 수 없어요. 진행할까요?`)) return;

      craftBtn.disabled = true;

      // 원본 1개, 소재 1개 소모 — 각각 수량이 1이면 행 삭제, 그 이상이면 감소.
      for (const row of [base, matEntry]) {
        if (row.quantity <= 1) {
          const { error } = await window.sbClient.from("warehouse_items").delete().eq("id", row.id);
          if (error) { alert(`개조 실패: ${error.message}`); craftBtn.disabled = false; return; }
        } else {
          const { error } = await window.sbClient.from("warehouse_items")
            .update({ quantity: row.quantity - 1 }).eq("id", row.id);
          if (error) { alert(`개조 실패: ${error.message}`); craftBtn.disabled = false; return; }
        }
      }

      const crafted = applyCraftMaterial(base, matName);
      delete crafted.id; delete crafted.quantity;
      // 병합 대상(이름+분류+craftMaterial까지 일치, 미장착·미강화)을 DB에서
      // 다시 조회 — 소재가 다르면 이름이 같아도 완전히 다른 물건이라 반드시
      // craft_material까지 봐야 함.
      let stackQuery = window.sbClient.from("warehouse_items").select("id,quantity")
        .eq("user_id", session.user.id).eq("name", crafted.name).eq("category", crafted.category)
        .is("held_by", null).is("enhance_level", null);
      stackQuery = crafted.craftMaterial ? stackQuery.eq("craft_material", crafted.craftMaterial) : stackQuery.is("craft_material", null);
      const { data: stack, error: stackError } = await stackQuery.maybeSingle();
      if (stackError) { alert(`개조 실패: ${stackError.message}`); craftBtn.disabled = false; return; }

      if (stack) {
        const { error } = await window.sbClient.from("warehouse_items")
          .update({ quantity: stack.quantity + 1 }).eq("id", stack.id);
        if (error) { alert(`개조 실패: ${error.message}`); craftBtn.disabled = false; return; }
      } else {
        const { error } = await window.sbClient.from("warehouse_items").insert(buildCraftedInsertPayload(crafted, 1));
        if (error) { alert(`개조 실패: ${error.message}`); craftBtn.disabled = false; return; }
      }

      await refreshWarehousePool();
      selectedEquipId = null; selectedMatName = null;
      alert(`"${base.name}" 개조 완료!`);
      render();
    });

    document.querySelectorAll("[data-appraise]").forEach((b) => b.addEventListener("click", async () => {
      const id = b.dataset.appraise;
      const entry = warehousePool.find((w) => w.id === id);
      if (!entry) return;
      const def = CRAFT_MATERIAL_TABLE[entry.name];
      if (!def || currentGold < def.appraisalCost) return;
      b.disabled = true;

      const { error: goldError } = await window.sbClient.from("profiles")
        .update({ gold: currentGold - def.appraisalCost }).eq("user_id", session.user.id);
      if (goldError) { alert(`감정 실패: ${goldError.message}`); b.disabled = false; return; }
      const { error: itemError } = await window.sbClient.from("warehouse_items")
        .update({ appraised: true }).eq("id", id);
      if (itemError) { alert(`감정 실패: ${itemError.message}`); b.disabled = false; return; }

      currentGold -= def.appraisalCost;
      await refreshWarehousePool();
      render();
    }));

    document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
      tab = t.dataset.tab;
      document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
      selectedEquipId = null; selectedMatName = null;
      render();
    }));
  }

  const { data: profile, error: profileError } = await window.sbClient
    .from("profiles").select("gold").eq("user_id", session.user.id).single();
  if (profileError) { alert(`골드 정보를 불러오지 못했습니다: ${profileError.message}`); return; }
  currentGold = profile?.gold ?? 0;

  await refreshWarehousePool();
  render();
})();
</script>
</body>
</html>
