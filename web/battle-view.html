<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전투 · Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim);
    text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; transition:color 0.15s ease;
  }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  header { padding:28px 40px 18px; border-bottom:1px solid var(--line); }
  header .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  header h1 { font-family:'Cinzel',serif; font-weight:700; font-size:26px; margin:8px 0 4px; color:#f2efe8; }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .nav-link {
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); text-decoration:none;
    border:1px solid var(--line); padding:7px 14px; border-radius:20px; white-space:nowrap;
  }
  .nav-link:hover { border-color:var(--gold); color:var(--gold); }

  main { flex:1; padding:32px 40px 48px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  /* ==========================================================
     전투 배너 — 실제 이미지 대신 CSS로 테마 배경 표현(석양 지는 폐허
     아레나 콘셉트). 나중에 진짜 지역별 배경 이미지로 교체할 자리.
     2026-08-20: 진형 프리뷰(적/아군 토큰)를 없애면서 순수 타이틀
     스트립으로 슬림화(16:5 → 16:3) — "바로 전투" 취지에 맞게 빈
     아레나가 결과 위를 크게 차지하지 않도록.
  ========================================================== */
  .battle-banner {
    position: relative;
    width: 100%;
    max-width: 1120px;
    aspect-ratio: 16 / 3;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background:
      radial-gradient(ellipse 60% 45% at 50% 15%, #4a2e5e55, transparent 70%),
      linear-gradient(180deg, #241a35 0%, #3a2440 32%, #6b3f3a 52%, #8a5535 60%, #2a2118 61%, #171319 100%);
  }
  /* 아득한 산 실루엣 */
  .battle-banner::before {
    content: "";
    position: absolute; left:0; right:0; top:38%; height:24%;
    background: linear-gradient(180deg, transparent, #1c141fcc 90%);
    clip-path: polygon(0% 100%, 0% 40%, 8% 55%, 16% 30%, 26% 58%, 36% 20%, 48% 50%, 58% 15%, 70% 48%, 82% 25%, 92% 52%, 100% 35%, 100% 100%);
    opacity: 0.8;
  }
  /* 전장 바닥(원근감 있는 사다리꼴) */
  .battle-banner::after {
    content: "";
    position: absolute; left:0; right:0; bottom:0; height:42%;
    background: linear-gradient(180deg, #2a211aee, #14111a 95%);
    clip-path: polygon(0% 100%, 0% 30%, 100% 30%, 100% 100%);
  }
  .battle-vignette {
    position: absolute; inset:0;
    box-shadow: inset 0 0 90px 20px #0000009c;
    pointer-events: none;
  }
  .battle-rift {
    position:absolute; left:50%; top:35%; bottom:6%; width:2px; transform:translateX(-50%);
    background: linear-gradient(180deg, transparent, #e8874b55, transparent);
    pointer-events:none;
  }
  .banner-caption {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.06em; color:#f2efe8cc;
    text-shadow:0 2px 6px #000000aa;
  }

  .entry-block {
    max-width:820px; width:100%; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mist-dim);
    border:1px solid var(--line); border-radius:10px; padding:16px 18px; line-height:1.7; text-align:center;
  }
  .entry-block b { color:var(--gold); }
  .entry-block a { color:var(--cyan); }

  .run-btn-row { display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; max-width:820px; }
  .run-btn {
    font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.04em; padding:12px 28px;
    background:var(--ember); color:#1a1108; border:none; border-radius:8px; cursor:pointer; font-weight:600;
  }
  .run-btn:hover:not(:disabled) { opacity:0.9; }
  .run-btn:disabled { background:var(--panel-raised); color:var(--mist-dim); cursor:not-allowed; }

  .battle-log-wrap { max-width:820px; width:100%; }

  .save-log-box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; text-align:center; }
  .save-log-btn { font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--panel-raised); color:var(--gold); border:1px solid var(--gold-dim); border-radius:8px; padding:10px 22px; cursor:pointer; }
  .save-log-btn:hover:not(:disabled) { background:var(--gold-dim); color:#f2efe8; }
  .save-log-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .save-log-hint { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-top:8px; line-height:1.6; }
  .save-log-link-row { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .save-log-link-input { font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel-raised); color:var(--mist); border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:340px; max-width:70vw; }
  .save-log-copy-btn { font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel-raised); color:var(--cyan); border:1px solid var(--cyan-dim); border-radius:6px; padding:8px 14px; cursor:pointer; }
  .raw-log-toggle { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); background:none; border:1px dashed var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; margin-top:14px; }
  .raw-log-box { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--mist); white-space:pre-wrap; word-break:break-word; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:8px; max-height:400px; overflow-y:auto; text-align:left; }
</style>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="battle-log-render.css">
</head>
<body>
  <script src="nav.js"></script>
  



<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">Battle</div>
      <h1>전투</h1>
    </div>
    <a class="nav-link" href="battle-select.html">← 전투 선택으로</a>
  </div>
</header>

<main>
  <div class="battle-banner" id="banner">
    <div class="banner-caption" id="bannerCaption">폐허가 된 협곡 아레나</div>
    <div class="battle-rift"></div>
    <div class="battle-vignette"></div>
  </div>

  <div class="battle-log-wrap" id="entryGateWrap" style="display:none;"></div>
  <div class="battle-log-wrap" id="battleLogWrap"></div>
  <div class="run-btn-row" id="rerunRow" style="display:none;">
    <button class="run-btn" id="runBattleBtn">⚔️ 다시 전투하기</button>
  </div>
  <div class="battle-log-wrap" id="saveLogRow" style="display:none; margin-top:14px;"></div>
</main>

<script src="../src/resourceTypes.js"></script>
<script src="../src/resourceManager.js"></script>
<script src="../src/skillRegistry.js"></script>
<script src="../src/combatFormulas.js"></script>
<script src="../src/registries.js"></script>
<script src="../src/character.js"></script>
<script src="../src/prepState.js"></script>
<script src="../src/skillResolution.js"></script>
<script src="../src/importer.js"></script>
<script src="../src/engine.js"></script>
<script src="battle-encounters.js"></script>
<script src="battle-themes.js"></script>
<script src="battle-entry.js"></script>
<script src="exp-table.js"></script>
<script src="battle-adapter.js"></script>
<script src="battle-log-render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="item-sets.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
<script>
  // ============================================================================
  // Supabase 연동 — 로스터는 characters, 골드는 profiles.gold, 전리품은
  // warehouse_items, 클리어 기록은 battle_progress. 개발자 도구 네비게이션은
  // 이제 nav.js가 profiles.is_admin으로 판별하므로 여기 사본은 제거함.
  //
  // 아래 값들은 전부 부트스트랩 IIFE가 비동기로 채운다. 렌더/전투/보상 함수는
  // 이 캐시를 동기로 읽음(예전 getRoster()가 매번 localStorage를 다시 파싱하던
  // 자리) — 이 페이지는 로스터 배열을 제자리에서 갈아끼우지 않으므로 로드
  // 시점 1회 조회로 충분함(roster-index.html과 같은 패턴).
  // ============================================================================
  let session = null;
  // 전투 로그 저장/공유용 — 직전 전투의 원문 그대로를 들고 있다가 "저장"
  // 클릭 시 그대로 battle_logs에 insert함(재가공 금지, CLAUDE.md 참고).
  // savedLogId는 같은 전투를 또 저장 눌렀을 때 중복 insert 대신 기존
  // 링크를 다시 보여주기 위한 캐시 — 다음 전투를 새로 돌리면 리셋됨.
  let lastBattleLog = null;
  let savedLogId = null;
  let cachedRoster = [];  // characters 행 → camelCase + equipment(held_by 조회분)
  let currentGold = 0;    // profiles.gold
  let username = "플레이어";

  function mapCharacterRow(row) {
    return {
      id: row.id,
      name: row.name,
      job: row.job,
      level: row.level,
      exp: row.exp,
      expToNext: row.exp_to_next,
      portrait: row.portrait,
      realStats: row.real_stats || {},
      learnedSkillNames: row.learned_skill_names || [],
      personalResources: row.personal_resources || {},
      row: row.row_position,
      guardAllies: row.guard_allies,
      presets: row.presets || [],
      activePresetIdx: row.battle_preset_idx ?? 0,
      keyItems: row.key_items || [],
    };
  }

  // character-sheet.html의 mapItemRow와 동일(장비 스펙 필드 전량).
  function mapItemRow(row) {
    return {
      id: row.id, name: row.name, category: row.category, quantity: row.quantity,
      description: row.description, slot: row.slot, heldBy: row.held_by,
      enhanceLevel: row.enhance_level, craftMaterial: row.craft_material, appraised: row.appraised,
      combatReal: row.combat_real, combatBonus: row.combat_bonus, statBonus: row.stat_bonus,
      passiveBonus: row.passive_bonus, maxHpBonus: row.max_hp_bonus, maxSpBonus: row.max_sp_bonus,
      weight: row.weight, twoHanded: row.two_handed, setId: row.set_id, requiredJob: row.required_job,
      statRealBonus: row.stat_real_bonus, patternSlotBonus: row.pattern_slot_bonus,
      critMultiplier: row.crit_multiplier, conditionalPassiveMods: row.conditional_passive_mods,
      grantsResource: row.grants_resource, equipmentType: row.equipment_type,
      avatarPortrait: row.avatar_portrait, grantsSkill: row.grants_skill,
      consumable: row.consumable, usesPerBattle: row.uses_per_battle, enhanceable: row.enhanceable,
      modifiable: row.modifiable,
    };
  }

  // camelCase 전리품 스펙 → warehouse_items insert payload(snake_case).
  // shop.html의 buildWarehouseInsertFromShopItem과 같은 필드 목록.
  function buildWarehouseInsertFromLoot(loot, quantity) {
    return {
      user_id: session.user.id,
      name: loot.name,
      category: loot.category,
      quantity,
      description: loot.description ?? null,
      slot: loot.slot ?? null,
      combat_real: loot.combatReal ?? null,
      combat_bonus: loot.combatBonus ?? null,
      stat_bonus: loot.statBonus ?? null,
      passive_bonus: loot.passiveBonus ?? null,
      max_hp_bonus: loot.maxHpBonus ?? null,
      max_sp_bonus: loot.maxSpBonus ?? null,
      weight: loot.weight ?? null,
      two_handed: loot.twoHanded ?? null,
      set_id: loot.setId ?? null,
      required_job: loot.requiredJob ?? null,
      stat_real_bonus: loot.statRealBonus ?? null,
      pattern_slot_bonus: loot.patternSlotBonus ?? null,
      crit_multiplier: loot.critMultiplier ?? null,
      conditional_passive_mods: loot.conditionalPassiveMods ?? null,
      grants_resource: loot.grantsResource ?? null,
      equipment_type: loot.equipmentType ?? null,
      avatar_portrait: loot.avatarPortrait ?? null,
      grants_skill: loot.grantsSkill ?? null,
      consumable: loot.consumable ?? null,
      uses_per_battle: loot.usesPerBattle ?? null,
      enhanceable: loot.enhanceable ?? null,
      modifiable: loot.modifiable ?? null,
      craft_material: null, // 드랍 전리품은 항상 미개조(위 병합 필터와 짝을 이룸)
    };
  }

  // ============================================================================
  // 레벨업 공식 — 테스트 빌드 한정으로 레벨 상한을 30으로 낮춰서(원래는 60까지
  // 계획) 초반 성장곡선을 먼저 검증함. 1->2레벨(100), 2->3레벨(200)만 고정값을
  // 쓰고, 3레벨부터는 이차함수 곡선(160 + 17×Lv²)으로 자연스럽게 가팔라짐 —
  // 30레벨(2차 전직) 도달까지 누적 필요 경험치가 약 150,000이 되도록 계수를
  // 맞춰둠(초반 성장곡선 검증이 이 테스트 빌드의 목표라, 여기까지만 확정하고
  // 그 이후 — 2차 전직 이후의 곡선 — 는 별도로 다시 고민하기로 함).
  //
  // 공식 자체는 exp-table.js로 분리함 — 예전엔 여기에만 있어서 hire/village가
  // 만드는 신규 캐릭터나 dispatch의 파견 경험치에는 적용되지 않았음.
  // ============================================================================
  const { LEVEL_CAP, EXP_HARD_CAP, expToNextForLevel, grantExp } = window.ExpTable;

  // ============================================================================
  // 몬스터 마스터 테이블 — 이제 monster-sheet.html/monster-roster.html에서
  // 만든 몬스터 로스터(game_content.monsterRoster)에서 읽어옴. 예전엔 여기 직접
  // 하드코딩했었지만, 오타/누락을 검증하기 피곤하고 캐릭터 빌드와 같은 UI로
  // 만들면 어차피 문제가 없어서 로스터 기반으로 전환함. 로스터의 각 몬스터
  // 객체가 곧 이 테이블의 값(하나의 id 키에 대응하는 정의)이 됨.
  //   dropTable: [{ name, category, chance(0~1), quantity:[min,max] }]
  // 새 몬스터가 필요하면 monster-roster.html에서 "+ 새 몬스터"로 만들면 됨.
  // ============================================================================
  // 배열→id 키 객체 변환은 battle-encounters.js의 공용 헬퍼로 일원화함
  // (dispatch.html도 같은 함수를 씀 — 예전엔 이 변환이 여기에만 있어서
  // 파견 쪽 몬스터 조회가 전부 실패했음).
  // 예전엔 파싱 시점에 계산되는 const였지만, 이제 로스터 원본을 부트스트랩이
  // game_content에서 받아와 setMonsterRoster()로 주입하므로 그 직후에 대입함
  // (character-sheet.html의 SKILL_TABLE/COMMON_SKILLS와 같은 처리).
  let MONSTER_TABLE = {};

  // ============================================================================
  // 전투별 몬스터 등장 풀 — 고정 편성이 아니라 "등장 가능성이 있는 몬스터 목록 +
  // 확률 + 상한"으로 정의함. 실제 등장 인원은 매 전투 진입 시 아래 spawnEnemies()가
  // 이 풀을 갖고 그때그때 뽑음.
  //   maxCount   이 전투에 등장할 몬스터의 총 마릿수
  //   pool[]     후보 목록. 각 항목:
  //     monsterId       MONSTER_TABLE 참조
  //     row             등장 시 배치될 진형
  //     weight          가중치(다른 후보 대비 상대값 — 확률 그 자체가 아니라 비율)
  //     maxAppearances  이 몬스터가 한 전투에서 최대 몇 마리까지 나올 수 있는지.
  //                      이 수만큼 이미 뽑혔으면 이후엔 후보에서 완전히 제외됨 —
  //                      그래서 후보가 하나만 남으면 그다음은 확정으로 그게 뽑힘.
  //     guaranteed      true면 확률 없이 무조건 먼저 등장(보스 등). maxCount 안에서
  //                      우선 배치되고, 남은 자리만 가중치 추첨으로 채움.
  // ============================================================================
  // 편성 테이블과 추첨 로직은 battle-encounters.js로 분리됨(파견 페이지와 공용)
  const { spawnEnemies } = window.BattleEncounters;

  // 희귀 등장 표시 기준 — 이 비율 미만이면 이름 앞에 [Rare] 태그가 붙음.
  // guaranteed(보스 등 확정 등장)는 애초에 "희귀"가 아니므로 대상에서 제외.

  // 이 전투의 등장 풀에서, 각 후보가 실제로 뽑힐 확률(가중치 비율)과 희귀 여부를
  // 계산. maxCount가 1일 때는 이 값이 곧 정확한 등장 확률과 같음(추첨이 한 번뿐이라
  // 상한/순차 효과가 끼어들 일이 없음) — maxCount가 여러 번이면 참고용 근사치.


  // 전투 이름은 battle-themes.js(BATTLE_THEMES) 공용 정의를 씀 — 예전엔 이
  // 파일에 따로 사본이 있었는데, 존재하지 않는 "gate-ambush"가 들어있고 실제
  // 전투인 "goblin-cart-raid"(고블린 수송대)는 빠져있는 등 실데이터와 어긋나
  // 있었음(dispatch.html에서 같은 종류의 문제를 고친 것과 동일 사례).
  function applyBattleCaption() {
    const params = new URLSearchParams(location.search);
    const battleId = params.get("battle");
    const name = window.BattleThemes.battleNameById(battleId);
    if (name) document.getElementById("bannerCaption").textContent = name;
  }

  // 2026-08-20: 진형 프리뷰(render(), buildRowGroupHTML())를 제거함 —
  // spawnEnemies()가 캐싱 없는 순수 랜덤이라 프리뷰가 뽑은 적과 실제
  // 전투(runRealBattle)가 뽑는 적이 서로 달랐음(사용자가 "임의의 로스터
  // 프리뷰"라 부른 이유). 어떤 몬스터가 나올 수 있는지는 이미
  // roster-select.html의 renderMonsterPreview()가 등장 확률까지 정확히
  // 보여주므로 정보 손실 없이 제거됨. formatMonsterLabel/weightedPick도
  // 호출부가 없던 battle-encounters.js 로직의 낡은 사본이라 같이 제거.

  // 파서/렌더러(parseBattleLog/renderBattleLog 등)는 battle-log-render.js로
  // 추출됨(2026-08-18) — window.BattleLogRender.* 로 호출.

  // ============================================================================
  // 실제 전투 실행 — BattleAdapter.runBattle()에 지금 화면에 뜬 편성 그대로 넘김.
  // ============================================================================
  // 표시용 이름 — 세션에서 가져옴(login.html/auth-callback.html과 같은 폴백 순서).
  function getUsername() {
    return username;
  }

  // ============================================================================
  // 입장조건 검사·차감 — 2026-08-20 신설. 예전엔 이 비용을 battle-select.html이
  // 페이지를 떠나기 "직전"에 딱 한 번만 부과했는데, battle-view.html은 입장
  // 조건을 한 번도 검사하지 않아서 URL을 직접 열거나 재전투를 반복하면
  // AFTERMATH를 조건 없이 무한 재도전할 수 있었다. 이제 전투를 "실행할 때마다"
  // (최초 자동 실행이든, 새로고침이든, 아래 재전투 버튼이든 전부 이 함수를
  // 거침) 여기서 자격을 확인하고 비용을 차감한다 — "새로고침으로 재도전해도
  // 좋다, 입장조건만 제대로 확인하고 통과시킨다면"이라는 방침 그대로.
  // battle-select.html은 더 이상 비용을 부과하지 않음(이중 차감 방지,
  // web/battle-entry.js 참고) — 배지 표시만 남아있음.
  // ============================================================================
  async function ensureEntryAllowed(battleId, isPractice) {
    if (isPractice) return true; // 연습은 비용 없음(기존 방침 그대로)

    const battle = window.BattleThemes.findBattleById(battleId);
    const costly = (battle?.requirements || []).filter(
      (r) => r.type === "consumesItem" || r.type === "attemptCooldownHours");
    if (costly.length === 0) return true; // 비용 없는 전투 — 마찰 없이 즉시 실행

    window.BattleEntry.setContext({ sbClient: window.sbClient, userId: session.user.id });

    const attemptReq = costly.find((r) => r.type === "attemptCooldownHours");
    if (attemptReq) {
      const progress = await window.BattleEntry.fetchProgress(battleId);
      const remainingMs = window.BattleEntry.remainingAttemptCooldownMs(progress.attemptedAt, attemptReq.value);
      if (remainingMs > 0) {
        renderEntryGate(`아직 재도전할 수 없어요. <b>${window.BattleEntry.formatDuration(remainingMs)}</b> 뒤에 다시 시도해 주세요.`);
        return false;
      }
    }
    if (!(await window.BattleEntry.hasEntryItems(battle))) {
      renderEntryGate(`필요한 아이템이 부족해요.`);
      return false;
    }

    const costLines = window.BattleEntry.describeEntryCost(battle);
    if (!confirm(`이 전투에 입장합니다.\n\n${costLines.join("\n")}\n\n진행할까요?`)) {
      renderEntryGate(`입장을 취소했어요.`);
      return false;
    }

    if (!(await window.BattleEntry.consumeEntryItems(battle))) {
      renderEntryGate(`필요한 아이템이 부족해요.`);
      return false;
    }
    // 소모재 차감에 성공했으면 이 시점이 곧 "도전 시작" — 성패를 기다리지
    // 않고 여기서 시계를 돌림(실패해도 대가를 치르게 하기 위함).
    if (attemptReq) await window.BattleEntry.markAttempt(battleId);
    return true;
  }

  function renderEntryGate(message) {
    const el = document.getElementById("entryGateWrap");
    el.style.display = "";
    el.innerHTML = `<div class="entry-block">${message}<br/><a href="battle-select.html">← 전투 선택으로 돌아가기</a></div>`;
  }

  async function runRealBattle() {
    const rerunRow = document.getElementById("rerunRow");
    const btn = document.getElementById("runBattleBtn");
    rerunRow.style.display = "none";
    document.getElementById("entryGateWrap").style.display = "none";

    const roster = cachedRoster;
    const params = new URLSearchParams(location.search);
    const partyParam = params.get("party");
    const battleId = params.get("battle");
    const isPractice = params.get("practice") === "1";

    if (!(await ensureEntryAllowed(battleId, isPractice))) return;

    // 계산은 동기라 긴 전투에서 화면이 잠깐 멈춘 것처럼 보일 수 있음 —
    // placeholder를 먼저 그리고 한 번 페인트를 양보한 뒤 실제로 돌림.
    document.getElementById("battleLogWrap").innerHTML =
      `<div class="entry-block">⚔️ 전투를 치르는 중…</div>`;
    await new Promise((resolve) => setTimeout(resolve, 0));

    const party = partyParam
      ? roster.filter((r) => partyParam.split(",").includes(String(r.id)))
      : roster;
    party.forEach((p) => { if (p.activePresetIdx === undefined) p.activePresetIdx = 0; });

    const enemies = spawnEnemies(battleId);
    const enemySpawnKeys = enemies.map((e) => e.monsterId);

    const logLines = [];
    const result = window.BattleAdapter.runBattle({
      allyRosterChars: party,
      monsterTable: MONSTER_TABLE,
      enemySpawnKeys,
      maxTurns: 100,
      username: getUsername(),
      logger: (line) => logLines.push(line),
      recordEvents: true, // 전투 로그 저장 기능용 — 서사 로그 문자열과는 별개 통로
    });

    document.getElementById("battleLogWrap").innerHTML = window.BattleLogRender.renderBattleLog(logLines, result);

    lastBattleLog = { lines: logLines, result, battleId, battleName: window.BattleThemes.battleNameById(battleId) };
    savedLogId = null;
    renderSaveLogRow();

    // 연습 모드 — 보상 지급도, 클리어 기록도, 쿨다운 갱신도 하지 않음.
    // 순수하게 "이 빌드가 통하는지"만 확인하는 용도라 아무 흔적을 남기지 않음.
    if (isPractice) {
      const wrap = document.getElementById("battleLogWrap");
      if (!document.getElementById("practiceNotice")) {
        const notice = document.createElement("div");
        notice.id = "practiceNotice"; // 재전투 때마다 안내가 중복으로 쌓이지 않게 함
        notice.style.cssText = "margin:14px auto 0; max-width:900px; padding:12px 16px; border:1px dashed var(--cyan-dim); border-radius:8px; color:var(--cyan); font-family:'JetBrains Mono',monospace; font-size:12px; text-align:center;";
        notice.textContent = "🧪 연습 모드 — 경험치·아이템·골드가 지급되지 않았고, 클리어 기록과 재도전 대기시간에도 영향이 없어요.";
        wrap.parentNode.insertBefore(notice, wrap);
      }
    } else {
      await applyBattleRewards(result, roster);
      if (result.outcome === "allyWin") await markCleared(battleId);
    }

    // AFTERMATH는 "1회 진입 = 1회 전투"라 재전투 버튼을 아예 숨김(위
    // ensureEntryAllowed가 비용을 다시 부과하긴 하지만, 소모재를 쥐고 있는
    // 한 계속 재도전할 수 있는 건 이 구획의 설계 의도와 맞지 않음 — "몇 번이고
    // 다시 도전 가능"이 아니라 "한 번의 시도가 신중해야 한다"가 핵심이므로).
    if (isPractice || !window.BattleThemes.isAftermathBattle(battleId)) {
      btn.textContent = "⚔️ 다시 전투하기";
      btn.disabled = false;
      rerunRow.style.display = "";
    } else {
      renderEntryGate(`이 전투는 한 번의 진입에 한 번만 도전할 수 있어요.`);
    }
  }

  // ============================================================================
  // 전투 로그 저장/공유 — 직전 전투(lastBattleLog)를 원문 그대로 battle_logs에
  // 저장하고 공유 링크(battle-log-view.html?id=<uuid>)를 보여준다. 수동
  // "저장" 버튼(자동 저장 아님) — 연습 모드에서도 가능(보상과 무관한 순수
  // 기록이라 막을 이유 없음). 같은 전투를 또 누르면 재insert 대신 기존
  // 링크를 다시 보여준다(10칸을 낭비하지 않도록).
  // ============================================================================
  function shareUrlFor(id) {
    return new URL(`battle-log-view.html?id=${id}`, location.href).toString();
  }

  function renderSaveLogRow() {
    const row = document.getElementById("saveLogRow");
    if (!lastBattleLog) { row.style.display = "none"; return; }
    row.style.display = "";

    if (savedLogId) {
      row.innerHTML = `
        <div class="save-log-box">
          <div>✅ 저장됐습니다. 이 링크를 아는 사람만 열람할 수 있어요.</div>
          <div class="save-log-link-row">
            <input class="save-log-link-input" id="shareLinkInput" readonly value="${shareUrlFor(savedLogId)}" />
            <button class="save-log-copy-btn" id="copyShareLinkBtn">복사</button>
          </div>
          <button class="raw-log-toggle" id="toggleRawLogBtn">🔍 원본 로그 보기</button>
          <div class="raw-log-box" id="rawLogBox" style="display:none;"></div>
        </div>
      `;
      document.getElementById("copyShareLinkBtn").addEventListener("click", () => {
        const input = document.getElementById("shareLinkInput");
        input.select();
        navigator.clipboard?.writeText(input.value).catch(() => {});
      });
    } else {
      row.innerHTML = `
        <div class="save-log-box">
          <button class="save-log-btn" id="saveLogBtn">💾 이 전투 저장</button>
          <div class="save-log-hint">저장하면 나만 볼 수 있는 링크가 생겨요. 그 링크를 직접 건네준 사람만 열람할 수 있습니다(비로그인도 열람 가능). 최근 10개까지 보관돼요.</div>
          <button class="raw-log-toggle" id="toggleRawLogBtn">🔍 원본 로그 보기</button>
          <div class="raw-log-box" id="rawLogBox" style="display:none;"></div>
        </div>
      `;
      document.getElementById("saveLogBtn").addEventListener("click", saveBattleLog);
    }

    document.getElementById("toggleRawLogBtn").addEventListener("click", () => {
      const box = document.getElementById("rawLogBox");
      const show = box.style.display === "none";
      box.style.display = show ? "block" : "none";
      if (show && !box.textContent) box.textContent = lastBattleLog.lines.join("\n");
    });
  }

  async function saveBattleLog() {
    if (!lastBattleLog) return;
    const btn = document.getElementById("saveLogBtn");
    btn.disabled = true;
    btn.textContent = "저장 중...";

    const { lines, result, battleId, battleName } = lastBattleLog;
    const { data, error } = await window.sbClient.from("battle_logs").insert({
      user_id: session.user.id,
      battle_id: battleId,
      battle_name: battleName,
      saved_by: getUsername(),
      outcome: result.outcome,
      turns_elapsed: result.turnsElapsed,
      lines, // 원문 그대로(verbatim) — 재가공 금지
      result,
      events: result.events,
    }).select("id").single();

    if (error) { alert(`전투 로그 저장 실패: ${error.message}`); btn.disabled = false; btn.textContent = "💾 이 전투 저장"; return; }
    savedLogId = data.id;
    renderSaveLogRow();
  }

  // ============================================================================
  // 전투 결과를 실제로 저장함. 경험치는 characters 행(캐릭터별 exp/level/
  // exp_to_next)에, 골드는 profiles.gold에, 아이템은 warehouse_items에 —
  // 이 셋을 서로 다른 테이블에 나눠 두는 이유: 골드가 창고 테이블 안에 있으면
  // 골드를 참조할 때마다 창고를 거쳐야 해서(참조 -> 재참조) 비효율적이고 매번
  // 그림이 지저분해짐. 골드는 여러 곳에서 자주, 직접 참조되는 값이라 프로필에
  // 독립적으로 둠.
  // ============================================================================
  // 승리 시 클리어 기록 + 클리어 시각 저장(battle_progress 한 행에 통합됨 —
  // 예전엔 clearedBattles 배열과 battleClearTimes 맵으로 갈라져 있었음).
  // 예전엔 실제 전투 승리가 해금에 전혀 반영되지 않아서(개발자 버튼으로만
  // 해금됐음) 전투를 이겨도 다음 전투가 안 열렸음. 시각은 특수의뢰의
  // 재도전 대기(cooldownHours) 판정에 쓰임.
  async function markCleared(battleId) {
    if (!battleId) return;
    const { error } = await window.sbClient.from("battle_progress").upsert(
      { user_id: session.user.id, battle_id: battleId, cleared: true, cleared_at: new Date().toISOString() },
      { onConflict: "user_id,battle_id" }
    );
    if (error) console.error("[battle-view] 클리어 기록 실패", error); // 결과 표시 자체는 막지 않음
  }

  async function applyBattleRewards(result, roster) {
    // 경험치 — grantExp가 메모리 객체의 exp/level/expToNext를 제자리에서
    // 갱신하고, 그 결과 세 컬럼만 캐릭터별로 update함(예전의 로스터 통짜
    // 저장이 필요 없어짐). 파티는 최대 5명이라 한 명씩 도는 걸로 충분.
    for (const { id, gainExp } of result.expByCharacter) {
      if (!gainExp) continue;
      const character = roster.find((r) => String(r.id) === String(id));
      if (!character) continue;
      grantExp(character, gainExp);
      const { error } = await window.sbClient.from("characters")
        .update({ exp: character.exp, level: character.level, exp_to_next: character.expToNext })
        .eq("id", character.id);
      if (error) alert(`경험치 저장 실패(${character.name}): ${error.message}`);
    }

    if (result.goldGained) {
      const next = currentGold + result.goldGained;
      const { error } = await window.sbClient.from("profiles")
        .update({ gold: next }).eq("user_id", session.user.id);
      if (error) alert(`골드 저장 실패: ${error.message}`);
      else currentGold = next;
    }

    for (const loot of result.lootGained) {
      // 병합 조건은 상점 구매와 동일하게 맞춤 — held_by(누군가 장착 중인
      // 개별 인스턴스)나 enhance_level(강화품)과는 절대 안 섞여야 함.
      // 예전엔 이 조건이 없어서 드랍품이 강화된 같은 이름 장비에 합쳐지면서
      // 강화 수치가 공짜로 늘어나는 문제가 있었음. craft_material도 마찬가지
      // 이유로 필터함(2026-08-22 추가) — 없으면 드랍품(항상 미개조)이
      // 조합공방에서 개조해둔 같은 이름 장비 스택에 합쳐져서 "개조된 장비가
      // 드랍만으로 늘어나는" 문제가 생김(shop.html 구매 병합에서 동일 버그를
      // 사용자가 신고해서 발견 — 왕관 조각으로 개조한 모자가 구매 후 늘어난
      // 사례. workshop.html의 개조/제작 병합 로직은 이미 처음부터 이 필드를
      // 봤는데 상점/전리품 두 경로만 놓쳐 있었음).
      const { data: existing, error: findError } = await window.sbClient
        .from("warehouse_items").select("id,quantity")
        .eq("user_id", session.user.id).eq("name", loot.name).eq("category", loot.category)
        .is("held_by", null).is("enhance_level", null).is("craft_material", null).maybeSingle();
      if (findError) { alert(`전리품 저장 실패(${loot.name}): ${findError.message}`); continue; }

      if (existing) {
        const { error } = await window.sbClient.from("warehouse_items")
          .update({ quantity: existing.quantity + loot.quantity }).eq("id", existing.id);
        if (error) alert(`전리품 저장 실패(${loot.name}): ${error.message}`);
      } else {
        // 장비 스펙(combatReal/weight/twoHanded 등)을 그대로 실어서 저장 —
        // 상점 구매와 같은 방식. 이게 없으면 드랍 장비를 장착해도 스탯이 0이 됨.
        const { error } = await window.sbClient.from("warehouse_items")
          .insert(buildWarehouseInsertFromLoot(loot, loot.quantity));
        if (error) alert(`전리품 저장 실패(${loot.name}): ${error.message}`);
      }
    }
  }

  // "다시 전투하기" 리스너 — 최초 전투는 부트스트랩이 자동으로 실행하므로
  // 이 버튼은 재전투 전용(2026-08-20, 프리뷰+수동 시작 버튼 제거).
  document.getElementById("runBattleBtn").addEventListener("click", runRealBattle);

  // ============================================================================
  // 부트스트랩 — 로그인 확인 → 캐릭터(+장착 장비) · 몬스터 로스터 · 골드를
  // 받아온 뒤 곧바로 전투를 실행함(2026-08-20, 프리뷰+수동 "전투 시작" 버튼을
  // 없애고 진입 즉시 자동 실행으로 바꿈). 전투/보상 코드는 전부 위 캐시를
  // 동기로 읽으므로 이게 끝나기 전에는 아무것도 실행하지 않음.
  // ============================================================================
  (async () => {
    session = await window.AuthGuard.requireSession();
    username = session.user.user_metadata?.full_name || session.user.email || "플레이어";

    const [charRes, monsterRes, skillRes, profileRes] = await Promise.all([
      window.sbClient.from("characters").select("*").eq("user_id", session.user.id),
      window.sbClient.from("game_content").select("data").eq("key", "monsterRoster").single(),
      window.sbClient.from("game_content").select("data").eq("key", "skillTable").single(),
      window.sbClient.from("profiles").select("gold").eq("user_id", session.user.id).single(),
    ]);
    if (charRes.error) { alert(`용병 목록을 불러오지 못했습니다: ${charRes.error.message}`); return; }
    if (monsterRes.error) { alert(`몬스터 정보를 불러오지 못했습니다: ${monsterRes.error.message}`); return; }
    if (skillRes.error) { alert(`스킬 정보를 불러오지 못했습니다: ${skillRes.error.message}`); return; }
    if (profileRes.error) { alert(`골드 정보를 불러오지 못했습니다: ${profileRes.error.message}`); return; }

    cachedRoster = (charRes.data || []).map(mapCharacterRow);
    window.BattleEncounters.setMonsterRoster(monsterRes.data?.data || []);
    MONSTER_TABLE = window.BattleEncounters.getMonsterTable();
    // battle-adapter.js의 registerKnownSkills()가 전투 시작마다 동기로
    // 읽으므로 여기서 미리 주입해둠(battle-encounters.js의 setMonsterRoster와
    // 동일한 이유 — DB를 매번 다시 묻지 않기 위함).
    window.BattleAdapter.setSkillTable(skillRes.data?.data || { commonSkills: [], jobSkills: {} });
    currentGold = profileRes.data?.gold ?? 0;

    // 장착 장비 — characters 테이블엔 equipment 컬럼이 없고(warehouse_items.
    // held_by가 유일한 진실 공급원), battle-adapter는 rosterChar.equipment(슬롯
    // 키 객체)를 직접 읽는다(sumEquipmentCombatStats / 맨주먹 보정의
    // equipment?.mainhand). 그래서 여기서 held_by로 조회해 슬롯별로 꽂아줌 —
    // 이게 없으면 전투가 전원 맨주먹(ATK 5)으로 계산됨.
    cachedRoster.forEach((c) => { c.equipment = {}; });
    if (cachedRoster.length) {
      const byId = {};
      cachedRoster.forEach((c) => { byId[c.id] = c; });
      const { data: itemRows, error: itemError } = await window.sbClient
        .from("warehouse_items").select("*").in("held_by", cachedRoster.map((c) => c.id));
      if (itemError) { alert(`장착 장비를 불러오지 못했습니다: ${itemError.message}`); return; }
      (itemRows || []).forEach((row) => {
        const owner = byId[row.held_by];
        if (owner && row.slot) owner.equipment[row.slot] = mapItemRow(row);
      });
    }

    applyBattleCaption();
    await runRealBattle();
  })();
</script>
