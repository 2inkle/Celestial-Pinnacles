<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--ink); color:var(--mist); font-family:'Inter',sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; }

  .global-nav { background:var(--panel); border-bottom:1px solid var(--line); }
  .global-nav-inner { display:flex; gap:2px; max-width:1200px; margin:0 auto; padding:0 40px; }
  .gnav-item { font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:0.05em; color:var(--mist-dim); text-decoration:none; padding:13px 18px; border-bottom:2px solid transparent; }
  .gnav-item:hover { color:var(--mist); }
  .gnav-item.active { color:var(--gold); border-bottom-color:var(--gold); }

  header { padding:24px 40px 16px; border-bottom:1px solid var(--line); }
  .back-link { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); text-decoration:none; }
  .back-link:hover { color:var(--gold); }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  h1 { font-family:'Cinzel',serif; font-weight:700; font-size:24px; margin:6px 0 0; color:#f2efe8; }
  .header-actions { display:flex; gap:10px; }
  .action-btn {
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:9px 16px; border-radius:8px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--mist-dim);
  }
  .action-btn:hover { color:var(--mist); border-color:var(--mist-dim); }
  .action-btn.primary { background:var(--ember); border:none; color:#1a1108; font-weight:600; }
  .action-btn.primary:hover { opacity:0.9; }

  main { flex:1; padding:24px 40px 60px; max-width:900px; margin:0 auto; width:100%; }
  .job-block { margin-bottom:26px; }
  .job-title { font-family:'Cinzel',serif; font-size:16px; color:#f2efe8; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .job-title input { font-family:'Cinzel',serif; font-size:16px; background:transparent; border:none; border-bottom:1px solid var(--line); color:#f2efe8; padding:2px 0; }
  .job-title input:focus { outline:none; border-color:var(--gold); }
  .remove-job { font-family:'JetBrains Mono',monospace; font-size:10px; background:transparent; border:1px solid var(--line); color:var(--mist-dim); padding:4px 8px; border-radius:5px; cursor:pointer; }
  .remove-job:hover { color:var(--danger); border-color:var(--danger-dim); }

  .skill-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .skill-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .skill-head .name-input { font-family:'Cinzel',serif; font-size:13.5px; background:transparent; border:none; border-bottom:1px solid var(--line); color:#f2efe8; padding:3px 0; width:160px; }
  .skill-head .name-input:focus { outline:none; border-color:var(--gold); }
  .remove-skill { font-family:'JetBrains Mono',monospace; font-size:10px; background:transparent; border:1px solid var(--line); color:var(--mist-dim); padding:4px 8px; border-radius:5px; cursor:pointer; }
  .remove-skill:hover { color:var(--danger); border-color:var(--danger-dim); }

  .field-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:7px; margin-bottom:7px; }
  .fg-item label { font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--mist-dim); display:block; margin-bottom:3px; }
  .fg-item input, .fg-item select {
    width:100%; font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--panel-raised); color:var(--mist);
    border:1px solid var(--line); border-radius:6px; padding:5px 7px;
  }
  .fg-item input:focus, .fg-item select:focus { outline:none; border-color:var(--gold); }

  .json-row { margin-top:6px; }
  .json-row label { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--gold); display:block; margin-bottom:3px; }
  .json-row textarea {
    width:100%; font-family:'JetBrains Mono',monospace; font-size:10.5px; background:var(--panel-raised); color:var(--mist);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px; min-height:44px; resize:vertical;
  }
  .json-row textarea:focus { outline:none; border-color:var(--gold); }
  .json-row textarea.json-pending { border-color:var(--gold); }
  .json-warn { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--gold); margin-top:5px; line-height:1.5; }

  .add-skill-btn, .add-job-btn {
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:transparent; border:1px dashed var(--line);
    color:var(--mist-dim); padding:8px 14px; border-radius:8px; cursor:pointer; width:100%;
  }
  .add-skill-btn:hover, .add-job-btn:hover { color:var(--gold); border-color:var(--gold-dim); }

  .save-bar { position:sticky; bottom:0; background:var(--ink); padding:14px 0; text-align:center; }
  .save-flag { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mist-dim); margin-top:6px; }
  .save-flag.dirty { color:var(--gold); }
</style>

        🔒 개발자 도구 전용 페이지입니다.<br/><a href="roster-index.html" style="color:#d9b45c;">← 홈으로</a>

  // 읽어옴(예전엔 두 파일이 각자 하드코딩된 사본을 갖고 있었는데, 마이그레이션
  // 도중 "마도사"/"마법사"처럼 이름이 어긋나는 실수가 실제로 있었음 — 이제
  // 하나의 소스만 있으니 그런 종류의 불일치 자체가 생길 수 없음).
  // ============================================================================
  function getSkillTable() {
    try { return JSON.parse(localStorage.getItem("battleSim_skillTable")) || { commonSkills:[], jobSkills:{} }; }
    catch { return { commonSkills:[], jobSkills:{} }; }
  }
  function saveSkillTable(t) {
    localStorage.setItem("battleSim_skillTable", JSON.stringify(t));
  }
  function downloadJSON(filename, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // 시드 버전 방식 — "한 번 심었으면 끝"이던 예전 방식으로는 시드를 갱신해도
  // 기존 플레이어에게 반영되지 않았음(스킬을 182개로 늘려도 24개짜리 옛
  // 테이블이 그대로 남아 마법사 라인·스탠스·크리티컬 스킬이 전부 없었음).
  // 버전이 다르면 무조건 다시 심음. 시드를 고칠 때마다 버전만 올리면 됨.
  const SKILL_SEED_VERSION = "2026-08-16o";
  if (localStorage.getItem("battleSim_skillSeedVersion") !== SKILL_SEED_VERSION) {
    // 덮어쓰기 전에 직전 내용을 백업 키에 남겨둠 — 편집기에서 직접 손본
    // 내용이 시드 갱신으로 통째로 사라지는 사고를 막기 위함. 필요하면
    // localStorage의 "battleSim_skillSeedVersionBackup"에서 되살릴 수 있음.
    try { localStorage.setItem("battleSim_skillSeedVersionBackup", JSON.stringify(getSkillTable())); } catch {}
    saveSkillTable(LEGACY_SKILL_SEED);
    localStorage.setItem("battleSim_skillSeedVersion", SKILL_SEED_VERSION);
  }

  let skillData = getSkillTable();
  let isDirty = false;
  function markDirty() { isDirty = true; renderSaveFlag(); }
  function renderSaveFlag() {
    const el = document.getElementById("saveFlag");
    if (el) { el.textContent = isDirty ? "저장 안 된 변경사항 있음" : "저장됨"; el.className = "save-flag" + (isDirty ? " dirty" : ""); }
  }

          <div class="fg-item"><label>skillPointCost</label><input type="number" class="f-simple" data-key="skillPointCost" value="${skill.skillPointCost ?? ""}" /></div>
          <div class="fg-item"><label>stat</label><input type="text" class="f-simple" data-key="stat" value="${skill.stat || ""}" /></div>
          <div class="fg-item"><label>coefficient</label><input type="number" step="0.1" class="f-simple" data-key="coefficient" value="${skill.coefficient ?? ""}" /></div>
          <div class="fg-item"><label>skillType</label><input type="text" class="f-simple" data-key="skillType" value="${skill.skillType || ""}" placeholder="physical/magic/support" /></div>
          <div class="fg-item"><label>targetFaction</label><input type="text" class="f-simple" data-key="targetFaction" value="${skill.targetFaction || ""}" /></div>
          <div class="fg-item"><label>targetCount</label><input type="text" class="f-simple" data-key="targetCount" value="${skill.targetCount || ""}" /></div>
          <div class="fg-item"><label>targetPriority</label>
            <select class="f-simple" data-key="targetPriority">
              <option value="" ${!skill.targetPriority ? "selected" : ""}>(없음, 무작위)</option>
              <option value="lowestHpPct" ${skill.targetPriority==="lowestHpPct" ? "selected" : ""}>lowestHpPct(HP% 최저)</option>
              <option value="highestHpPct" ${skill.targetPriority==="highestHpPct" ? "selected" : ""}>highestHpPct(HP% 최고)</option>
              <option value="preparing" ${skill.targetPriority==="preparing" ? "selected" : ""}>preparing(시전 중인 대상)</option>
            </select>
          </div>
          <div class="fg-item"><label>preDelay</label><input type="number" class="f-simple" data-key="preDelay" value="${skill.preDelay ?? ""}" /></div>
          <div class="fg-item"><label>preDelayType</label><input type="text" class="f-simple" data-key="preDelayType" value="${skill.preDelayType || ""}" /></div>
          <div class="fg-item"><label>postDelay</label><input type="number" class="f-simple" data-key="postDelay" value="${skill.postDelay ?? ""}" /></div>
        </div>
        <div class="json-row">
          <label>costs (JSON 배열)</label>
          <textarea class="j-costs ${typeof skill.costs === "string" ? "json-pending" : ""}">${typeof skill.costs === "string" ? skill.costs : JSON.stringify(skill.costs || [])}</textarea>
          <div class="json-warn j-costs-warn" style="display:${typeof skill.costs === "string" ? "block" : "none"};">📝 JSON이 아니라서 자연어 그대로 저장돼요 — 구현이 필요한 규칙이면 이렇게 적어서 넘겨주세요.</div>
        </div>
        <div class="json-row">
          <label>effects (JSON 배열) — 액티브 스킬이 발동될 때 걸리는 효과</label>
          <textarea class="j-effects ${typeof skill.effects === "string" ? "json-pending" : ""}">${typeof skill.effects === "string" ? skill.effects : JSON.stringify(skill.effects || [])}</textarea>
          <div class="json-warn j-effects-warn" style="display:${typeof skill.effects === "string" ? "block" : "none"};">📝 JSON이 아니라서 자연어 그대로 저장돼요 — 구현이 필요한 규칙이면 이렇게 적어서 넘겨주세요.</div>
        </div>
        <div class="section-label" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gold);margin-top:8px;">passiveMods(%) — passive 체크 시에만 상시 적용(액션으로 안 씀)</div>
        <div class="field-grid">
          ${["physicalDamageDealtPct","physicalDamageTakenPct","magicDamageDealtPct","magicDamageTakenPct","hpCostReductionPct","spCostReductionPct","healingDealtPct","healingDealtFlat","lifestealPct","physicalIgnoreBonusDefPct","magicIgnoreBonusDefPct","accuracyBonusPct","completeDefenseChancePct","critChancePct"].map(k => `<div class="fg-item"><label>${k}</label><input type="number" class="f-passiveMod" data-key="${k}" value="${(skill.passiveMods && skill.passiveMods[k]) || 0}" /></div>`).join("")}
        </div>
        <div class="section-label" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gold);margin-top:8px;">statBonus/statRealBonus(고정치) — passive 체크 시에만 적용, 장비와 같은 방식</div>
        <div class="field-grid">
          ${["str","int","dex","spd","luk"].map(k => `<div class="fg-item"><label>${k}</label><input type="number" class="f-statBonus" data-key="${k}" value="${(skill.statBonus && skill.statBonus[k]) || 0}" /></div>`).join("")}
        </div>
        <div class="field-grid">
          ${["str","int","dex","spd","luk"].map(k => `<div class="fg-item"><label>real${k}</label><input type="number" class="f-statRealBonus" data-key="${k}" value="${(skill.statRealBonus && skill.statRealBonus[k]) || 0}" /></div>`).join("")}
        </div>
        <div class="field-grid">
          <div class="fg-item"><label>maxHpBonus</label><input type="number" class="f-maxHpBonus" value="${skill.maxHpBonus || 0}" /></div>
          <div class="fg-item"><label>maxSpBonus</label><input type="number" class="f-maxSpBonus" value="${skill.maxSpBonus || 0}" /></div>
          <div class="fg-item"><label>critMultiplier(최댓값적용)</label><input type="number" step="0.1" class="f-critMul" value="${skill.critMultiplier || 0}" placeholder="0=없음" /></div>
        </div>
        <div class="json-row">
          <label>conditionalPassiveMods(JSON 배열) — passive 체크 시에만, "지금 상태가 조건에 맞을 때만" 적용되는 패시브. 예: [{"key":"physicalDamageDealtPct","value":100,"condition":{"type":"isGuarding"}}]. condition.type: isGuarding / isShielded / guardAlliesIs(value:true|false) / rowIs(value:"front"|"back") / hpPctBelow(value:N) / hpPctAbove(value:N)</label>
          <textarea class="j-condPassive ${typeof skill.conditionalPassiveMods === "string" ? "json-pending" : ""}">${typeof skill.conditionalPassiveMods === "string" ? skill.conditionalPassiveMods : JSON.stringify(skill.conditionalPassiveMods || [])}</textarea>
          <div class="json-warn j-condPassive-warn" style="display:${typeof skill.conditionalPassiveMods === "string" ? "block" : "none"};">📝 JSON이 아니라서 자연어 그대로 저장돼요 — 구현이 필요한 규칙이면 이렇게 적어서 넘겨주세요.</div>
        </div>
      </div>
    `;
  }

  function render() {
    const el = document.getElementById("mainArea");
    let html = `
      <div class="job-block">
        <div class="job-title">공통 스킬(COMMON_SKILLS)</div>
        <div id="group-common">
          ${skillData.commonSkills.map((s, i) => skillCardHTML(s, "common", i)).join("")}
        </div>
        <button class="add-skill-btn" data-group="common">+ 공통 스킬 추가</button>
      </div>
    `;
    Object.keys(skillData.jobSkills).forEach((job) => {
      html += `
        <div class="job-block">
          <div class="job-title">
            <input type="text" class="job-name-input" value="${job}" data-job="${job}" />
            <button class="remove-job" data-job="${job}">✕ 직업 삭제</button>
          </div>
          <div id="group-${job}">
            ${skillData.jobSkills[job].map((s, i) => skillCardHTML(s, job, i)).join("")}
          </div>
          <button class="add-skill-btn" data-group="${job}">+ ${job} 스킬 추가</button>
        </div>
      `;
    });
    html += `<button class="add-job-btn" id="addJobBtn">+ 새 직업 그룹 추가</button>`;
    el.innerHTML = html;
    bindEvents(el);
  }

  function groupArray(groupKey) {
    return groupKey === "common" ? skillData.commonSkills : skillData.jobSkills[groupKey];
  }

  function bindEvents(el) {
    el.querySelectorAll(".skill-card").forEach((card) => {
      const groupKey = card.dataset.group;
      const idx = Number(card.dataset.idx);
      const skill = groupArray(groupKey)[idx];

      card.querySelector(".f-name").addEventListener("input", e => { skill.name = e.target.value; markDirty(); });
      card.querySelector(".f-passive-toggle").addEventListener("change", e => {
        if (e.target.checked) skill.passive = true; else delete skill.passive;
        markDirty();
      });
      card.querySelectorAll(".f-passiveMod").forEach(inp => inp.addEventListener("input", e => {
        skill.passiveMods = skill.passiveMods || {};
        skill.passiveMods[e.target.dataset.key] = Number(e.target.value) || 0;
        markDirty();
      }));
      card.querySelectorAll(".f-statBonus").forEach(inp => inp.addEventListener("input", e => {
        skill.statBonus = skill.statBonus || {};
        skill.statBonus[e.target.dataset.key] = Number(e.target.value) || 0;
        markDirty();
      }));
      card.querySelectorAll(".f-statRealBonus").forEach(inp => inp.addEventListener("input", e => {
        skill.statRealBonus = skill.statRealBonus || {};
        skill.statRealBonus[e.target.dataset.key] = Number(e.target.value) || 0;
        markDirty();
      }));
      const maxHpBonusInput = card.querySelector(".f-maxHpBonus");
      if (maxHpBonusInput) maxHpBonusInput.addEventListener("input", e => { skill.maxHpBonus = Number(e.target.value) || 0; markDirty(); });
      const maxSpBonusInput = card.querySelector(".f-maxSpBonus");
      if (maxSpBonusInput) maxSpBonusInput.addEventListener("input", e => { skill.maxSpBonus = Number(e.target.value) || 0; markDirty(); });
      const critMulInput = card.querySelector(".f-critMul");
      if (critMulInput) critMulInput.addEventListener("input", e => { const v = Number(e.target.value) || 0; if (v > 0) skill.critMultiplier = v; else delete skill.critMultiplier; markDirty(); });
      const condPassiveArea = card.querySelector(".j-condPassive");
      const condPassiveWarn = card.querySelector(".j-condPassive-warn");
      condPassiveArea.addEventListener("input", e => {
        try { skill.conditionalPassiveMods = JSON.parse(e.target.value || "[]"); e.target.classList.remove("json-pending"); condPassiveWarn.style.display = "none"; }
        catch { skill.conditionalPassiveMods = e.target.value; e.target.classList.add("json-pending"); condPassiveWarn.style.display = "block"; }
        markDirty();
      });
      card.querySelectorAll(".f-simple").forEach(inp => inp.addEventListener("input", e => {
        const key = e.target.dataset.key;
        const v = e.target.value;
        if (v === "") { delete skill[key]; return markDirty(); }
        skill[key] = (e.target.type === "number") ? Number(v) : v;
        markDirty();
      }));
      const costsArea = card.querySelector(".j-costs");
      const costsWarn = card.querySelector(".j-costs-warn");
      costsArea.addEventListener("input", e => {
        try { skill.costs = JSON.parse(e.target.value || "[]"); e.target.classList.remove("json-pending"); costsWarn.style.display = "none"; }
        catch { skill.costs = e.target.value; e.target.classList.add("json-pending"); costsWarn.style.display = "block"; }
        markDirty();
      });
      const effectsArea = card.querySelector(".j-effects");
      const effectsWarn = card.querySelector(".j-effects-warn");
      effectsArea.addEventListener("input", e => {
        try { skill.effects = JSON.parse(e.target.value || "[]"); e.target.classList.remove("json-pending"); effectsWarn.style.display = "none"; }
        catch { skill.effects = e.target.value; e.target.classList.add("json-pending"); effectsWarn.style.display = "block"; }
        markDirty();
      });
      card.querySelector(".remove-skill").addEventListener("click", () => {
        groupArray(groupKey).splice(idx, 1); markDirty(); render();
      });
    });

    el.querySelectorAll(".add-skill-btn").forEach(btn => btn.addEventListener("click", () => {
      groupArray(btn.dataset.group).push({ name: "새 스킬", requiredLevel: 1, skillPointCost: 0, stat: "str", coefficient: 1.0, costs: [] });
      markDirty(); render();
    }));

    el.querySelectorAll(".job-name-input").forEach(inp => inp.addEventListener("change", e => {
      const oldJob = e.target.dataset.job;
      const newJob = e.target.value.trim();
      if (!newJob || newJob === oldJob) { e.target.value = oldJob; return; }
      if (skillData.jobSkills[newJob]) { alert("이미 있는 직업명입니다."); e.target.value = oldJob; return; }
      skillData.jobSkills[newJob] = skillData.jobSkills[oldJob];
      delete skillData.jobSkills[oldJob];
      markDirty(); render();
    }));

    el.querySelectorAll(".remove-job").forEach(btn => btn.addEventListener("click", () => {
      if (!confirm(`"${btn.dataset.job}" 직업 그룹과 그 안의 모든 스킬을 삭제할까요?`)) return;
      delete skillData.jobSkills[btn.dataset.job];
      markDirty(); render();
    }));

    const addJobBtn = el.querySelector("#addJobBtn");
    if (addJobBtn) addJobBtn.addEventListener("click", () => {
      let n = 1;
      while (skillData.jobSkills[`새 직업${n}`]) n++;
      skillData.jobSkills[`새 직업${n}`] = [];
      markDirty(); render();
    });
  }

  document.getElementById("saveBtn").addEventListener("click", () => {
    saveSkillTable(skillData);
    isDirty = false; renderSaveFlag();
  });
  document.getElementById("uploadBtn").addEventListener("click", () => {
    document.getElementById("uploadInput").click();
  });
  document.getElementById("uploadInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch { alert("올바른 JSON 파일이 아니에요."); return; }
      if (!parsed.commonSkills || !parsed.jobSkills) { alert("스킬 테이블 형식이 아니에요(commonSkills/jobSkills 필드가 있어야 함)."); return; }
      if (!confirm("지금 이 브라우저에 저장된 스킬 테이블을 파일 내용으로 완전히 덮어쓸까요?")) return;
      saveSkillTable(parsed);
      location.reload();
    };
    reader.readAsText(file);
  });
  document.getElementById("downloadBtn").addEventListener("click", () => {
    downloadJSON("skill-table.json", skillData);
  });

  render();
  document.querySelector("main").insertAdjacentHTML("afterend", `<div class="save-bar"><div class="save-flag" id="saveFlag">저장됨</div></div>`);
</script>
</body>
</html>
